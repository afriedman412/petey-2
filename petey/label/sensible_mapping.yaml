# Mapping from Petey form_id → Sensible config file(s) used for slug vocabulary.
#
# Paths are relative to sensible-configuration-library/. When multiple configs
# exist for a form type (per-year, per-vendor), list the most recent or most
# generic one first; the loader takes the union of field IDs across listed
# configs.
#
# Sensible field IDs are loaded from fields[].id of each linked config and
# fed to vlm_label.py as the PREFERRED slug source (per label-source-priority
# decision 2026-06-27 in project_labeler_first_generation.md).
#
# Add new entries as new forms get labeled. Missing entries fall back to
# existing bpt vocab + LLM invention.

