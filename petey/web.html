<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petey</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111111'/%3E%3Ctext x='14' y='48' font-family='Georgia,serif' font-size='44' fill='%23f2ece4'%3EP%3C/text%3E%3Ccircle cx='52' cy='52' r='6' fill='%23d8572a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  /* petey-web's tokens and components (petey-master/petey-web/templates/builder.html, static/dropzone.js) */
  :root {
    --bg:#111111; --surface:#1c1c1c; --surface-2:#262626; --border:#333333;
    --accent:#d8572a; --accent-h:#e06b3e; --accent-dim:rgba(216,87,42,.12);
    --amber:#f7b538; --amber-dim:rgba(247,181,56,.12); --green:#86efac; --danger:#c32f27; --red:#f0716a;
    --text:#f2ece4; --text-muted:#db7c26; --text-dim:#999999; --r:8px; --r-lg:12px;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html { background:var(--bg); }
  body { font-family:'DM Sans', system-ui, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }
  .main { max-width:1040px; margin:0 auto; padding:2.75rem 2rem 5rem; }

  .hero { margin-bottom:2.25rem; display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap; }
  .hero h1 { font-family:'DM Serif Display', Georgia, serif; font-size:3.2rem; font-weight:400; letter-spacing:-.01em; line-height:.95; }
  .hero h1 .dot { color:var(--accent); }
  .hero-sub { font-size:.82rem; color:var(--text-muted); letter-spacing:.04em; margin-top:.45rem; }
  .lib { font-size:.78rem; color:var(--text-dim); padding-bottom:.2rem; }
  .lib .loading { animation:pulse 1.5s ease-in-out infinite; }
  .toplink { color:var(--text-muted); text-decoration:none; letter-spacing:.03em; margin-right:1.25rem; transition:color .15s; }
  .toplink:hover { color:var(--text); }

  .dropzone { border:1.5px dashed var(--border); border-radius:var(--r-lg); padding:2.75rem 2rem; text-align:center; cursor:pointer;
    background:var(--surface); background-image:radial-gradient(circle, var(--border) 1px, transparent 1px); background-size:22px 22px;
    background-position:center; transition:border-color .2s, background-color .2s; margin-bottom:1.25rem; }
  .dropzone:hover, .dropzone.over { border-color:var(--accent); background-color:var(--accent-dim); }
  .dropzone p { font-size:.88rem; color:var(--text-muted); }
  .dropzone .hint { font-size:.75rem; color:var(--text-dim); margin-top:.45rem; }
  .dropzone input { display:none; }

  .controls-label { font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:1.25rem 1.5rem; margin-bottom:1.25rem; }
  .card-header { display:flex; align-items:center; gap:.9rem; margin-bottom:1rem; padding-bottom:.8rem; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .card-label { font-size:.67rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--text-muted); flex-shrink:0; }
  .card-title { font-size:.95rem; font-weight:600; }
  .card-meta { font-size:.75rem; color:var(--text-dim); }
  .spacer { flex:1; }

  /* file list */
  .files { display:flex; flex-direction:column; gap:.1rem; }
  .file { display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(0, 1.6fr) auto; gap:.9rem; align-items:center; padding:.45rem .2rem;
    border-bottom:1px solid var(--border); font-size:.82rem; }
  .file:last-child { border-bottom:none; }
  .file .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file .form { color:var(--text-dim); font-size:.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file .form b { color:var(--text); font-weight:500; }
  .file .state { font-size:.74rem; color:var(--text-dim); white-space:nowrap; }
  .file.working .state { color:var(--accent); animation:pulse 1.5s ease-in-out infinite; }
  .file.done .state { color:var(--green); }
  .file.error .state, .file.error .form { color:var(--red); }
  .fix { grid-column:1 / -1; display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; font-size:.78rem; color:var(--text-dim); padding:0 0 .25rem; }
  select { background:var(--surface-2); border:1px solid var(--border); border-radius:4px; color:var(--text); padding:.22rem .4rem;
    font-size:.78rem; font-family:inherit; max-width:22rem; }
  select:focus { outline:none; border-color:var(--accent); }
  select option { background:var(--surface-2); color:var(--text); }

  .btn { padding:.32rem .8rem; font-size:.78rem; font-weight:500; background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted);
    border-radius:5px; cursor:pointer; font-family:inherit; transition:all .15s; text-decoration:none; display:inline-block; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#000; font-weight:700; }
  .btn.primary:hover { background:var(--accent-h); color:#000; }
  .btn-ghost { background:none; border:none; color:var(--text-muted); font-size:.78rem; cursor:pointer; padding:0; font-family:inherit;
    text-decoration:underline; text-underline-offset:3px; transition:color .15s; }
  .btn-ghost:hover { color:var(--text); }

  .toggle-group { display:flex; border:1px solid var(--border); border-radius:5px; overflow:hidden; }
  .toggle-group button { padding:.26rem .8rem; border:none; background:transparent; cursor:pointer; font-size:.76rem; color:var(--text-muted);
    font-family:inherit; transition:all .15s; }
  .toggle-group button + button { border-left:1px solid var(--border); }
  .toggle-group button.active { background:var(--accent); color:#000; font-weight:600; }
  label.chk { font-size:.76rem; color:var(--text-dim); display:inline-flex; align-items:center; gap:.35rem; cursor:pointer; }
  label.chk input { accent-color:var(--accent); }

  /* results */
  .table-wrap { max-height:560px; overflow:auto; border-radius:var(--r); border:1px solid var(--border); }
  table.results { width:100%; border-collapse:collapse; font-size:.78rem; }
  table.results th { background:var(--surface-2); color:var(--text-muted); font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em;
    padding:.38rem .6rem; border-bottom:1px solid var(--border); position:sticky; top:0; text-align:left; white-space:nowrap; z-index:1; }
  table.results td { padding:.3rem .6rem; border-bottom:1px solid var(--border); color:var(--text); vertical-align:top; }
  table.results tr:last-child td { border-bottom:none; }
  table.results tr:hover td { background:var(--surface-2); }
  table.results td.k { font-family:ui-monospace, Menlo, monospace; font-size:.74rem; color:var(--text-dim); white-space:nowrap; width:1%; }
  table.results td.v { white-space:pre-wrap; word-break:break-word; }
  table.results.wide td { white-space:nowrap; max-width:22rem; overflow:hidden; text-overflow:ellipsis; }
  table.results.wide td:first-child, table.results.wide th:first-child { position:sticky; left:0; background:var(--surface); z-index:1; }
  table.results.wide th:first-child { background:var(--surface-2); z-index:2; }
  .nil { color:var(--text-dim); opacity:.6; }
  .yes { color:var(--green); } .no { color:var(--text-dim); }
  pre { background:var(--bg); border:1px solid var(--border); padding:1rem; border-radius:var(--r); overflow:auto; max-height:560px;
    font-size:.76rem; color:var(--text); line-height:1.6; font-family:ui-monospace, Menlo, monospace; }
  .downloads { display:flex; gap:.5rem; margin-top:.85rem; flex-wrap:wrap; align-items:center; }

  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--surface-2); border-radius:5px; border:2px solid var(--surface); } ::-webkit-scrollbar-thumb:hover { background:var(--border); }

  @keyframes pulse { 0%, 100% { opacity:1; } 50% { opacity:.4; } }
  @media (max-width:640px) {
    .main { padding:1.5rem 1rem 3rem; }
    .hero h1 { font-size:2.2rem; }
    .card { padding:1rem; }
    .file { grid-template-columns:1fr auto; }
    .file .form { grid-column:1 / -1; grid-row:2; }
  }
</style>
</head>
<body>
<main class="main">
  <div class="hero">
    <div>
      <h1>Petey<span class="dot">.</span></h1>
      <p class="hero-sub">Easy PDF Extraction</p>
    </div>
    <span class="lib"><a class="toplink" id="reviewLink" href="/" hidden>Blueprint review</a><span class="loading" id="lib">loading the form library…</span></span>
  </div>

  <div class="dropzone" id="dz">
    <p>Drop filled PDFs here, or click to select</p>
    <p class="hint">The form is detected for you; each file comes back as one record.</p>
    <input type="file" id="fileInput" accept=".pdf,application/pdf" multiple>
  </div>

  <div class="card" id="filesCard" hidden>
    <div class="card-header">
      <span class="card-label">Files</span>
      <span class="card-meta" id="filesMeta"></span>
      <span class="spacer"></span>
      <button class="btn-ghost" id="clear">Clear</button>
    </div>
    <div class="files" id="files"></div>
  </div>

  <div id="results"></div>
  <div class="downloads" id="allDownloads" hidden></div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const CONCURRENCY = 2;

let FORMS = [];                    // library blueprints, for "extract as"
let items = [];                    // {id, file, state: queued|working|done|error, record, choice}
let nextId = 1, running = 0;
const view = {};                   // per blueprint: {mode: 'table'|'json', empty: bool}

const isMeta = k => k.startsWith('_');
const fieldsOf = rec => Object.keys(rec).filter(k => !isMeta(k));
const formName = f => f ? (f.title || f.form_id || f.blueprint) : '';
const blank = v => v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length);

async function loadLibrary() {
  for (;;) {
    try {
      const s = await (await fetch('/extract/api/status')).json();
      $('#reviewLink').hidden = !s.review;
      if (s.ready) {
        FORMS = s.error ? [] : await (await fetch('/extract/api/forms')).json();
        $('#lib').classList.remove('loading');
        $('#lib').textContent = s.error ? `library failed to load: ${s.error}` : `${FORMS.length} forms in the library`;
        FORMS.sort((a, b) => formName(a).localeCompare(formName(b)));
        return;
      }
    } catch (e) { /* server starting */ }
    await new Promise(r => setTimeout(r, 700));
  }
}

function addFiles(list) {
  const pdfs = [...list].filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  for (const file of pdfs) items.push({id: nextId++, file, state: 'queued', record: null, choice: null});
  render();
  pump();
}

function pump() {
  while (running < CONCURRENCY) {
    const it = items.find(x => x.state === 'queued');
    if (!it) break;
    run(it);
  }
}

async function run(it) {
  it.state = 'working'; running++; renderFiles();
  try {
    const headers = {'Content-Type': 'application/pdf', 'X-Filename': encodeURIComponent(it.file.name)};
    if (it.choice) headers['X-Blueprint'] = encodeURIComponent(it.choice);
    const r = await fetch('/extract/api/extract', {method: 'POST', headers, body: it.file});
    it.record = await r.json();
    it.state = it.record._error ? 'error' : 'done';
  } catch (e) {
    it.record = {_source_file: it.file.name, _error: String(e)};
    it.state = 'error';
  }
  running--;
  render();
  pump();
}

function render() { renderFiles(); renderResults(); }

function renderFiles() {
  $('#filesCard').hidden = !items.length;
  const done = items.filter(x => x.state === 'done').length, err = items.filter(x => x.state === 'error').length;
  $('#filesMeta').textContent = `${items.length} file${items.length === 1 ? '' : 's'} · ${done} extracted` + (err ? ` · ${err} not extracted` : '');
  $('#files').innerHTML = items.map(it => {
    const rec = it.record || {}, f = rec._form;
    let form = '', state = {queued: 'queued', working: 'reading…', done: 'done', error: 'not extracted'}[it.state], fix = '';
    if (it.state === 'done') {
      const how = f.method === 'chosen' ? 'chosen by you' : `${f.method} match ${Math.round(f.score * 100)}%`;
      form = `<b>${esc(formName(f))}</b> · ${esc(how)}`;
      state = `done · ${f.seconds}s`;
    } else if (it.state === 'error') {
      form = esc(rec._error);
      const near = f && f.runner_up;
      const opts = FORMS.map(x => `<option value="${esc(x.blueprint)}"${near && x.blueprint === near.blueprint ? ' selected' : ''}>${esc(formName(x))} (${esc(x.blueprint)})</option>`).join('');
      if (f !== undefined && FORMS.length) fix = `<div class="fix">
          ${near ? `closest: <b>${esc(near.blueprint)}</b> at ${Math.round(near.score * 100)}% ·` : ''} extract as
          <select data-id="${it.id}"><option value="">choose a form…</option>${opts}</select>
          <button class="btn" data-retry="${it.id}">extract</button></div>`;
    }
    return `<div class="file ${it.state}"><span class="name" title="${esc(it.file.name)}">${esc(it.file.name)}</span>
      <span class="form">${form}</span><span class="state">${esc(state)}</span>${fix}</div>`;
  }).join('');
}

function groups() {
  const out = new Map();
  for (const it of items) {
    if (it.state !== 'done') continue;
    const bp = it.record._form.blueprint;
    if (!out.has(bp)) out.set(bp, {form: it.record._form, records: []});
    out.get(bp).records.push(it.record);
  }
  return [...out.entries()];
}

function cell(v) {
  if (blank(v)) return '<span class="nil">—</span>';
  if (v === true) return '<span class="yes">yes</span>';
  if (v === false) return '<span class="no">no</span>';
  if (typeof v === 'object') return esc(JSON.stringify(v));
  return esc(v);
}

function renderResults() {
  const gs = groups();
  $('#results').innerHTML = gs.map(([bp, g]) => {
    const v = view[bp] || (view[bp] = {mode: 'table', empty: false});
    const recs = g.records, fields = fieldsOf(recs[0]);
    const shown = v.empty ? fields : fields.filter(k => recs.some(r => !blank(r[k]) && r[k] !== false));
    let body;
    if (v.mode === 'json') {
      body = `<pre>${esc(JSON.stringify(recs.length === 1 ? recs[0] : recs, null, 2))}</pre>`;
    } else if (recs.length === 1) {
      body = `<div class="table-wrap"><table class="results"><tbody>${shown.map(k =>
        `<tr><td class="k">${esc(k)}</td><td class="v">${cell(recs[0][k])}</td></tr>`).join('')}</tbody></table></div>`;
    } else {
      body = `<div class="table-wrap"><table class="results wide"><thead><tr><th>file</th>${shown.map(k => `<th>${esc(k)}</th>`).join('')}</tr></thead>
        <tbody>${recs.map(r => `<tr><td title="${esc(r._source_file)}">${esc(r._source_file)}</td>${shown.map(k => `<td>${cell(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
    const hidden = fields.length - shown.length;
    return `<div class="card">
      <div class="card-header">
        <span class="card-label">Form</span>
        <span class="card-title">${esc(formName(g.form))}</span>
        <span class="card-meta">${esc(bp)} · ${recs.length} file${recs.length === 1 ? '' : 's'} · ${fields.length} fields</span>
        <span class="spacer"></span>
        <label class="chk"><input type="checkbox" data-empty="${esc(bp)}" ${v.empty ? 'checked' : ''}> empty fields${hidden && !v.empty ? ` (${hidden})` : ''}</label>
        <div class="toggle-group">
          <button data-mode="table" data-bp="${esc(bp)}" class="${v.mode === 'table' ? 'active' : ''}">Table</button><button data-mode="json" data-bp="${esc(bp)}" class="${v.mode === 'json' ? 'active' : ''}">JSON</button>
        </div>
      </div>
      ${body}
      <div class="downloads">
        <button class="btn" data-dl="csv" data-bp="${esc(bp)}">Download CSV</button>
        <button class="btn" data-dl="json" data-bp="${esc(bp)}">Download JSON</button>
      </div>
    </div>`;
  }).join('');
  const all = items.filter(x => x.state === 'done');
  $('#allDownloads').hidden = gs.length < 2;
  $('#allDownloads').innerHTML = gs.length < 2 ? '' : `<span class="controls-label">All ${all.length} records</span>
    <button class="btn primary" data-dl="json" data-bp="">Download JSON</button>`;
}

function csvOf(recs) {
  const fields = fieldsOf(recs[0]);
  const q = v => {
    if (blank(v)) return '';
    const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const rows = [['_source_file', ...fields].join(',')];
  for (const r of recs) rows.push([q(r._source_file), ...fields.map(k => q(r[k]))].join(','));
  return rows.join('\r\n') + '\r\n';
}

function save(text, name, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = Object.assign(document.createElement('a'), {href: url, download: name});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function download(kind, bp) {
  const recs = bp ? groups().find(([b]) => b === bp)[1].records : items.filter(x => x.state === 'done').map(x => x.record);
  const base = bp ? (recs.length === 1 ? recs[0]._source_file.replace(/\.pdf$/i, '') : bp) : 'petey';
  if (kind === 'csv') save(csvOf(recs), `${base}_extracted.csv`, 'text/csv');
  else save(JSON.stringify(recs.length === 1 && bp ? recs[0] : recs, null, 2), `${base}_extracted.json`, 'application/json');
}

const dz = $('#dz'), input = $('#fileInput');
dz.addEventListener('click', () => input.click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); addFiles(e.dataTransfer.files); });
input.addEventListener('change', () => { addFiles(input.files); input.value = ''; });
// a file dropped outside the zone would open in the tab and lose the page
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

$('#clear').addEventListener('click', () => { items = items.filter(x => x.state === 'working'); render(); });
document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.retry) {
    const it = items.find(x => x.id === +t.dataset.retry), sel = document.querySelector(`select[data-id="${it.id}"]`);
    if (!sel.value) return sel.focus();
    it.choice = sel.value; it.state = 'queued'; it.record = null; renderFiles(); pump();
  } else if (t.dataset.mode && t.dataset.bp !== undefined) {
    view[t.dataset.bp].mode = t.dataset.mode; renderResults();
  } else if (t.dataset.dl) {
    download(t.dataset.dl, t.dataset.bp);
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.empty !== undefined) { view[e.target.dataset.empty].empty = e.target.checked; renderResults(); }
});

loadLibrary();
</script>
</body>
</html>
