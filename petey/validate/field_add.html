<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field add</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --line:#ddd; --panel:#fafafa; --card:#fff; --sel:#1a73e8; --ok:#1e8e3e; --bad:#c5221f;
          --field:#8e24aa; --sug:#e37400; --added:#188038; }
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.4 -apple-system, Helvetica, Arial, sans-serif; color:var(--fg); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header select { font:inherit; max-width:420px; }
  .pages button, .btn { font:inherit; padding:3px 9px; border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:4px; cursor:pointer; }
  .pages button.on { background:#e8f0fe; border-color:var(--sel); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.primary { border-color:var(--ok); color:var(--ok); }
  .btn.warn { border-color:var(--bad); color:var(--bad); }
  .help { color:var(--muted); font-size:12px; }
  .stale, .err { color:var(--bad); }
  .progress b { color:var(--fg); }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; overflow:auto; background:#efefef; }
  #canvas { position:relative; margin:12px; display:inline-block; box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:crosshair; user-select:none; }
  #canvas img { display:block; -webkit-user-drag:none; pointer-events:none; }
  .ov { position:absolute; }
  .ov.field { border:1.5px solid var(--field); background:color-mix(in srgb, var(--field) 10%, transparent); }
  .ov.field:hover { background:color-mix(in srgb, var(--field) 25%, transparent); }
  .ov.sug { border:2px solid var(--sug); background:color-mix(in srgb, var(--sug) 10%, transparent); cursor:pointer; }
  .ov.sug.finder { border-style:dashed; }
  .ov.sug.copy { opacity:.35; }
  .ov.sug.cur { box-shadow:0 0 0 2px var(--sel); }
  .ov.added { border:2px solid var(--added); background:color-mix(in srgb, var(--added) 12%, transparent); cursor:pointer; }
  .ov.added .tag { position:absolute; left:0; top:-14px; font-size:10px; line-height:12px; background:var(--card); color:var(--added); padding:0 3px; white-space:nowrap; pointer-events:none; }
  .ov.prop { border:2px solid var(--sel); background:color-mix(in srgb, var(--sel) 12%, transparent); pointer-events:none; }
  .ov.draw { border:1.5px dashed var(--sel); background:color-mix(in srgb, var(--sel) 8%, transparent); pointer-events:none; }
  aside { width:440px; border-left:1px solid var(--line); overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  aside > * { flex-shrink:0; }
  .card { border:1px solid var(--sel); border-radius:4px; padding:8px 10px; background:var(--card); }
  .card h3 { margin:0 0 6px; font-size:13px; }
  .card input[type=text], .card textarea, .card select { font:inherit; width:100%; padding:3px 5px; }
  .card textarea { min-height:40px; }
  .grid { display:grid; grid-template-columns:84px 1fr; gap:4px 8px; align-items:center; margin:6px 0; }
  .grid label { color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .chip { border:1px solid var(--line); border-radius:10px; padding:1px 8px; background:var(--panel); cursor:pointer; font-size:12px; }
  .chip.on { border-color:var(--sel); background:#e8f0fe; }
  .chip .src { color:var(--muted); margin-left:4px; }
  .ev { font-size:12px; color:var(--muted); margin:6px 0 0; padding-left:16px; }
  .opts td { padding:1px 3px; } .opts input { font:inherit; width:100%; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .notes { font-size:12px; color:var(--muted); }
  .list div { padding:2px 4px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .list div:hover { background:var(--panel); }
  .list .x { color:var(--muted); }
  h4 { margin:0 0 4px; font-size:12px; color:var(--muted); font-weight:600; }
  .changes { font-size:12px; } .changes li { margin:1px 0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1e1e; --fg:#eee; --muted:#aaa; --line:#444; --panel:#2c2c2c; --card:#242424; --field:#ce93d8; }
    #stage { background:#2a2a2a; } .pages button.on, .chip.on { background:#1f2d44; }
  }
</style>
</head>
<body>
<header>
  <select id="pick"></select>
  <span class="pages" id="pages"></span>
  <span class="progress help" id="progress"></span>
  <label class="help"><input type="checkbox" id="showFields" checked> fields (f)</label>
  <label class="help"><input type="checkbox" id="showSug" checked> suggestions (s)</label>
  <label class="help"><input type="checkbox" id="copies"> repeated copies</label>
  <span class="help">zoom <button class="btn" id="zout">-</button> <button class="btn" id="zin">+</button></span>
  <span class="help">drag over an area, or click a box · n/p suggestion · Enter add · x not a field · Esc cancel</span>
</header>
<main>
  <div id="stage"><div id="canvas"><img id="img" alt=""></div></div>
  <aside id="panel"><p class="help">Pick a blueprint.</p></aside>
</main>
<script>
let LIST = [], BP = null, bid = null, page = 1, zoom = 1.6, scale = 1;
let props = [], notes = [], curSid = null, added = [], dismissed = [], PLAN = null, busy = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function j(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); }
const post = (url, body) => j(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
function localNow() { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; }
const api = p => `/api/blueprints/${encodeURIComponent(bid)}${p}`;

function overlap(a, b) {
  const ix = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])), iy = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  const i = ix * iy; if (i <= 0) return 0;
  return i / Math.min(Math.max((a[2] - a[0]) * (a[3] - a[1]), 1e-6), Math.max((b[2] - b[0]) * (b[3] - b[1]), 1e-6));
}
const boxesOf = p => p.kind === 'group' ? p.options.map(o => ({page: o.page, rect: o.rect})) : [{page: p.page, rect: (p.widget || p).rect}];

async function init() {
  $('#pick').innerHTML = '<option>loading blueprints…</option>';
  try { LIST = await j('/api/blueprints'); } catch (e) { $('#panel').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  try { zoom = parseFloat(localStorage.getItem('fa_zoom')) || zoom; } catch (e) {}
  renderPicker();
  $('#pick').addEventListener('change', () => load($('#pick').value));
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash && LIST.some(b => b.id === hash)) { $('#pick').value = hash; load(hash); }
  for (const id of ['showFields', 'showSug', 'copies']) $('#' + id).addEventListener('change', () => { placeBoxes(); renderPanel(); });
  $('#zin').onclick = () => setZoom(zoom * 1.25); $('#zout').onclick = () => setZoom(zoom / 1.25);
  window.addEventListener('keydown', onKey);
  bindDraw();
}

function renderPicker() {
  const pick = $('#pick'), keep = pick.value || decodeURIComponent(location.hash.slice(1));
  pick.innerHTML = '<option value="">pick a blueprint…</option>';
  const groups = {lib: 'library', je: 'judge-eval side copies', rl: 'relabels', fl: 'flat forms'};
  for (const src of Object.keys(groups)) {
    const items = LIST.filter(x => x.source === src).sort((a, b) => a.form.localeCompare(b.form)); if (!items.length) continue;
    const og = document.createElement('optgroup'); og.label = groups[src];
    for (const b of items) {
      const o = document.createElement('option'); o.value = b.id;
      const bits = [b.added && `${b.added} to add`, b.dismissed && `${b.dismissed} not fields`, b.applied && `${b.applied} applied`].filter(Boolean);
      o.textContent = b.form + (bits.length ? `  (${bits.join(', ')})` : '');
      og.appendChild(o);
    }
    pick.appendChild(og);
  }
  if (keep && LIST.some(b => b.id === keep)) pick.value = keep;
}

async function load(id) {
  if (!id) return;
  bid = id; location.hash = encodeURIComponent(id);
  $('#panel').innerHTML = '<p class="help">reading the blank…</p>';
  try { BP = await j(api('')); } catch (e) { $('#panel').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  added = BP.added; dismissed = BP.dismissed; props = []; notes = []; curSid = null; PLAN = null;
  page = (remaining()[0] || {}).page || (BP.pages[0] || {}).page || 1;
  renderPages(); await showPage(); renderPanel(); refreshPlan();
}

// ------------------------------------------------------------------ suggestions

function covered(s) { return added.some(a => boxesOf(a).some(b => b.page === s.page && overlap(b.rect, s.rect) >= 0.5)); }
function remaining() {
  const gone = new Set(dismissed.map(d => d.sid));
  return BP.suggestions.filter(s => !gone.has(s.sid) && (!s.copy || $('#copies').checked) && !covered(s));
}
async function gotoSuggestion(step) {
  const list = remaining(); if (!list.length) { notes = ['no suggestions left']; renderPanel(); return; }
  let i = list.findIndex(s => s.sid === curSid);
  i = i < 0 ? (step > 0 ? 0 : list.length - 1) : (i + step + list.length) % list.length;
  await proposeSid(list[i]);
}
async function proposeSid(s) {
  curSid = s.sid;
  if (s.page !== page) { page = s.page; renderPages(); await showPage(); }
  await propose({page: s.page, sid: s.sid});
  const el = document.querySelector('.ov.sug.cur'); if (el) el.scrollIntoView({block: 'center', inline: 'center', behavior: 'smooth'});
}
async function propose(body) {
  if (busy) return; busy = true;
  try {
    const r = await post(api('/propose'), {...body, taken: added.map(a => a.name)});
    props = r.proposals; notes = r.notes;
  } catch (e) { props = []; notes = ['proposal failed: ' + e.message]; }
  busy = false; placeBoxes(); renderPanel();
}

// ------------------------------------------------------------------ page and drawing

function setZoom(z) { zoom = Math.min(6, Math.max(0.6, z)); try { localStorage.setItem('fa_zoom', zoom); } catch (e) {} if (BP) { sizeImage(); placeBoxes(); } }
function renderPages() {
  const el = $('#pages'); el.innerHTML = '';
  const left = remaining();
  for (const p of BP.pages) {
    const n = left.filter(s => s.page === p.page).length;
    const b = document.createElement('button'); b.textContent = `p${p.page}${n ? ` (${n})` : ''}`;
    b.className = p.page === page ? 'on' : ''; b.onclick = async () => { page = p.page; renderPages(); await showPage(); };
    el.appendChild(b);
  }
}
function sizeImage() { const p = BP.pages.find(x => x.page === page); if (p) $('#img').style.width = (p.w_pt * zoom) + 'px'; }
async function showPage() {
  const img = $('#img'); sizeImage();
  await new Promise(res => { img.onload = res; img.onerror = res; img.src = api(`/png/${page}`); });
  placeBoxes();
}
function put(cls, r, title) {
  const d = document.createElement('div'); d.className = 'ov ' + cls;
  d.style.left = (r[0] * scale) + 'px'; d.style.top = (r[1] * scale) + 'px';
  d.style.width = Math.max(5, (r[2] - r[0]) * scale) + 'px'; d.style.height = Math.max(5, (r[3] - r[1]) * scale) + 'px';
  if (title) d.title = title;
  $('#canvas').appendChild(d); return d;
}
function placeBoxes() {
  const canvas = $('#canvas'), pinfo = BP && BP.pages.find(p => p.page === page);
  canvas.querySelectorAll('.ov').forEach(e => e.remove()); if (!pinfo) return;
  scale = $('#img').clientWidth / pinfo.w_pt;
  if ($('#showFields').checked) for (const f of BP.fields) if (f.page === page) put('field', f.rect, f.name).dataset.field = f.name;
  if ($('#showSug').checked) for (const s of remaining()) if (s.page === page) {
    const d = put(`sug ${s.source}${s.copy ? ' copy' : ''}${s.sid === curSid ? ' cur' : ''}`, s.rect, s.what);
    d.dataset.sid = s.sid;
  }
  added.forEach((a, i) => boxesOf(a).filter(b => b.page === page).forEach((b, k) => {
    const d = put('added', b.rect, a.name); d.dataset.added = i;
    if (k === 0) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = a.name; d.appendChild(t); }
  }));
  for (const p of props) for (const b of boxesOf(p)) if (b.page === page) put('prop', b.rect);
}

function bindDraw() {
  const canvas = $('#canvas'); let start = null, box = null, target = null;
  const pt = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale]; };
  canvas.addEventListener('mousedown', e => { if (!BP || e.button !== 0) return; e.preventDefault(); start = pt(e); target = e.target; });
  window.addEventListener('mousemove', e => {
    if (!start) return; const p = pt(e);
    const r = [Math.min(start[0], p[0]), Math.min(start[1], p[1]), Math.max(start[0], p[0]), Math.max(start[1], p[1])];
    if (!box && (r[2] - r[0]) * scale < 4 && (r[3] - r[1]) * scale < 4) return;
    if (!box) box = put('draw', r); else { box.style.left = r[0] * scale + 'px'; box.style.top = r[1] * scale + 'px'; box.style.width = (r[2] - r[0]) * scale + 'px'; box.style.height = (r[3] - r[1]) * scale + 'px'; }
    box._r = r;
  });
  window.addEventListener('mouseup', async e => {
    if (!start) return;
    const s = start, b = box, t = target; start = null; box = null; target = null;
    if (b) { b.remove(); curSid = null; return propose({page, rect: b._r}); }
    if (t && t.dataset && t.dataset.sid) { const sg = BP.suggestions.find(x => x.sid === t.dataset.sid); if (sg) return proposeSid(sg); }
    if (t && t.dataset && t.dataset.field) { props = []; curSid = null; notes = [fieldInfo(t.dataset.field)]; placeBoxes(); return renderPanel(); }
    if (t && t.dataset && t.dataset.added !== undefined) { notes = [`${added[+t.dataset.added].name} is recorded to be added (remove it from the list below)`]; return renderPanel(); }
    curSid = null; propose({page, rect: [s[0] - 1, s[1] - 1, s[0] + 1, s[1] + 1]});
  });
}

// ------------------------------------------------------------------ panel

function optHtml(p, i) {
  return `<table class="opts"><tr><th class="help">key</th><th class="help">caption</th><th></th></tr>${p.options.map((o, k) =>
    `<tr><td><input type="text" data-i="${i}" data-o="${k}" data-ok="key" value="${esc(o.key)}"></td>
         <td><input type="text" data-i="${i}" data-o="${k}" data-ok="caption" value="${esc(o.caption || '')}"></td>
         <td><span class="chip" data-drop="${i}:${k}" title="leave this box out">×</span></td></tr>`).join('')}</table>
    <div class="help">keyed by ${esc(p.keyed_by)}${p.options.some(o => o.on_state) ? '; on-states ' + esc(p.options.map(o => o.on_state || '?').join(', ')) : ''}</div>`;
}
function cardHtml(p, i) {
  const types = ['string', 'number', 'integer', 'date', 'boolean', 'category', 'multi_category'];
  const sem = ['', ...BP.semantic_types];
  const what = p.kind === 'group' ? `group of ${p.options.length} options` : p.kind === 'option' ? `${p.widget.widget_type}` : 'text box';
  const clash = added.some(a => a.name === p.name) || props.some((q, k) => k !== i && q.name === p.name);
  return `<div class="card" data-card="${i}">
    <h3>${esc(what)} on p${p.page} <span class="help">· ${esc(p.geometry)} geometry</span></h3>
    <input type="text" data-i="${i}" data-k="name" value="${esc(p.name)}">
    ${!/^[a-z][a-z0-9_]*$/.test(p.name) ? '<div class="err help">not a field name (lower case, digits, underscores)</div>' : clash ? '<div class="err help">another field has this name</div>' : ''}
    <div class="chips">${p.name_options.map((o, k) => `<span class="chip ${o.name === p.name ? 'on' : ''}" data-name="${i}:${k}">${esc(o.name)}<span class="src">${esc(o.source)}</span></span>`).join('')}
      <span class="chip" data-labeler="${i}" title="one call to ${esc(BP.label_model)} with this page's words">ask the labeler</span></div>
    <div class="grid">
      <label>type</label><select data-i="${i}" data-k="type">${types.map(t => `<option ${t === p.type ? 'selected' : ''}>${t}</option>`).join('')}</select>
      ${p.kind === 'text' ? `<label>semantic</label><select data-i="${i}" data-k="semantic_type">${sem.map(t => `<option value="${t}" ${t === (p.semantic_type || '') ? 'selected' : ''}>${t || '(none)'}</option>`).join('')}</select>
      <label>pattern</label><input type="text" data-i="${i}" data-k="pattern" value="${esc(p.pattern || '')}" ${p.type !== 'string' ? 'disabled' : ''}>` : ''}
      <label>description</label><textarea data-i="${i}" data-k="description">${esc(p.description || '')}</textarea>
    </div>
    ${p.kind === 'group' ? optHtml(p, i) : ''}
    ${p.page_class ? `<div class="help">classifier: ${esc(p.page_class)}${p.entity ? ' for ' + esc(p.entity) : ''} (shown, not applied)</div>` : ''}
    <ul class="ev">${p.evidence.map(e => `<li>${esc(e)}</li>`).join('')}</ul>
    <div class="row"><button class="btn primary" data-add="${i}">add this field</button>${props.length > 1 ? `<button class="btn" data-skip="${i}">leave out</button>` : ''}</div>
  </div>`;
}

function fieldInfo(name) {
  const f = (BP.field_specs || {})[name] || {};
  return `already a field: ${name}` + (f.type ? ` · ${f.type}${f.semantic_type ? '/' + f.semantic_type : ''}` : '') + (f.description ? ` · ${f.description}` : '');
}

function renderPanel() {
  const a = $('#panel'); if (!BP) return;
  const left = remaining();
  const sugCounts = `${left.filter(s => s.source === 'widget').length} widgets, ${left.filter(s => s.source === 'finder').length} finder boxes`;
  const head = `<div class="help">${esc(BP.path)}${BP.stale ? ' <span class="stale">· recorded against an earlier version of this file</span>' : ''}</div>
    <div class="help">${BP.has_widgets ? 'form layer: yes' : 'no form layer (flat)'} · finder: ${BP.finder}${BP.finder !== 'cached' ? ' <button class="btn" id="runFinder" title="step2flat on this blank, local CPU, cached afterwards">run it</button>' : ''} · classifier map: ${BP.classifier}</div>
    <div><b>${left.length}</b> suggestion${left.length === 1 ? '' : 's'} left <span class="help">(${sugCounts}${BP.suggestions.some(s => s.copy) && !$('#copies').checked ? '; repeated copies hidden' : ''})</span>
      <button class="btn" id="nextSug">next (n)</button></div>`;
  const cards = props.length ? props.map(cardHtml).join('') + `<div class="row">
      ${props.length > 1 ? '<button class="btn primary" id="addAll">add all (Enter)</button>' : '<span class="help">Enter adds it</span>'}
      ${curSid ? '<button class="btn warn" id="notField" title="record this suggestion as not a field">not a field (x)</button>' : ''}
      <button class="btn" id="cancel">cancel (Esc)</button></div>`
    : '<p class="help">Drag a box over an area of the page, click a box, or press n for the next suggestion. Orange: suggestions (solid: an unclaimed widget; dashed: a finder box). Purple: fields the blueprint has (hover for the name, click for its type). Green: fields you have added.</p>';
  const nts = notes.length ? `<div class="notes">${notes.map(n => `<div>${esc(n)}</div>`).join('')}</div>` : '';
  const list = `<div><h4>To add (${added.length})</h4><div class="list">${added.map((x, i) =>
      `<div data-goto="${i}"><span>p${x.page} · ${esc(x.name)} <span class="help">${esc(x.kind === 'group' ? 'group' : x.type)}</span></span><span class="x" data-del="${i}" title="remove">×</span></div>`).join('') || '<p class="help">nothing yet</p>'}</div></div>
    ${dismissed.length ? `<div><h4>Not fields (${dismissed.length})</h4><div class="list">${dismissed.map((x, i) =>
      `<div data-dgoto="${i}"><span>p${x.page} · ${esc(x.what || x.sid)}</span><span class="x" data-undismiss="${i}" title="put it back">×</span></div>`).join('')}</div></div>` : ''}
    <div class="changes" id="changes"></div>`;
  a.innerHTML = head + cards + nts + list;
  bindPanel(); renderChanges(); renderProgress(); renderPages();
}

function bindPanel() {
  const rf = $('#runFinder'); if (rf) rf.onclick = runFinder;
  $('#nextSug').onclick = () => gotoSuggestion(1);
  const aa = $('#addAll'); if (aa) aa.onclick = () => addProps(props.map((_, i) => i));
  const nf = $('#notField'); if (nf) nf.onclick = notAField;
  const cc = $('#cancel'); if (cc) cc.onclick = cancel;
  document.querySelectorAll('[data-k]').forEach(el => {
    const i = +el.dataset.i, k = el.dataset.k;
    const set = () => { props[i][k] = el.value || null; if (k === 'name') { props[i].name_source = 'hand'; } if (k === 'type') renderPanel(); };
    el.addEventListener('change', set);
    el.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && el.tagName !== 'TEXTAREA') { set(); addProps(props.map((_, n) => n)); } if (e.key === 'Escape') cancel(); });
  });
  document.querySelectorAll('[data-ok]').forEach(el => {
    const i = +el.dataset.i, o = +el.dataset.o;
    el.addEventListener('change', () => { props[i].options[o][el.dataset.ok] = el.value; if (el.dataset.ok === 'key') props[i].keyed_by = 'hand'; });
    el.addEventListener('keydown', e => e.stopPropagation());
  });
  document.querySelectorAll('[data-drop]').forEach(el => el.onclick = () => {
    const [i, o] = el.dataset.drop.split(':').map(Number); props[i].options.splice(o, 1);
    if (!props[i].options.length) props.splice(i, 1);
    placeBoxes(); renderPanel();
  });
  document.querySelectorAll('[data-name]').forEach(el => el.onclick = () => {
    const [i, k] = el.dataset.name.split(':').map(Number), p = props[i], o = p.name_options[k];
    p.name = o.name; p.name_source = o.source;
    for (const t of ['type', 'semantic_type', 'pattern']) delete p[t];
    Object.assign(p, o.types || {}); if (o.twin) p.twin = o.twin; else delete p.twin;
    renderPanel();
  });
  document.querySelectorAll('[data-labeler]').forEach(el => el.onclick = () => askLabeler(+el.dataset.labeler, el));
  document.querySelectorAll('[data-add]').forEach(el => el.onclick = () => addProps([+el.dataset.add]));
  document.querySelectorAll('[data-skip]').forEach(el => el.onclick = () => { props.splice(+el.dataset.skip, 1); placeBoxes(); renderPanel(); });
  document.querySelectorAll('[data-del]').forEach(el => el.onclick = e => { e.stopPropagation(); added.splice(+el.dataset.del, 1); save(); });
  document.querySelectorAll('[data-undismiss]').forEach(el => el.onclick = e => { e.stopPropagation(); dismissed.splice(+el.dataset.undismiss, 1); save(); });
  document.querySelectorAll('[data-goto]').forEach(el => el.onclick = async () => { const x = added[+el.dataset.goto]; if (x.page !== page) { page = x.page; await showPage(); } });
  document.querySelectorAll('[data-dgoto]').forEach(el => el.onclick = async () => { const x = dismissed[+el.dataset.dgoto]; if (x.page !== page) { page = x.page; await showPage(); } });
}

async function askLabeler(i, el) {
  el.textContent = 'asking…';
  try {
    const r = await post(api('/labeler'), {proposal: props[i]});
    if (r.name) {
      const p = props[i], taken = new Set([...added.map(a => a.name), ...props.filter((_, k) => k !== i).map(q => q.name)]);
      let n = r.name, k = 2; while (taken.has(n)) n = `${r.name}_${k++}`;
      p.name_options = p.name_options.filter(o => o.source !== 'labeler').concat([{name: n, source: 'labeler', types: {}}]);
      p.name = n; p.name_source = 'labeler';
    } else notes = ['the labeler returned no name'];
  } catch (e) { notes = ['labeler failed: ' + e.message]; }
  renderPanel();
}

function addProps(idx) {
  const now = localNow();
  const bad = idx.map(i => props[i]).filter(p => !/^[a-z][a-z0-9_]*$/.test(p.name || ''));
  if (bad.length) { notes = [`not a field name: ${bad.map(p => p.name).join(', ')}`]; return renderPanel(); }
  for (const i of idx) added.push({...props[i], when: now});
  props = props.filter((_, i) => !idx.includes(i));
  if (!props.length) { notes = []; save().then(() => gotoSuggestionIfAny()); } else save();
}
function gotoSuggestionIfAny() { if (curSid && remaining().length) gotoSuggestion(1); else { curSid = null; placeBoxes(); renderPanel(); } }
function notAField() {
  const s = BP.suggestions.find(x => x.sid === curSid); if (!s) return;
  dismissed.push({sid: s.sid, page: s.page, rect: s.rect, source: s.source, what: s.what, when: localNow()});
  props = []; notes = []; save().then(() => gotoSuggestion(1));
}
function cancel() { props = []; notes = []; placeBoxes(); renderPanel(); }

async function save() {
  try {
    PLAN = await j(api('/record'), {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({added, dismissed})});
    BP.stale = false;
    const e = LIST.find(b => b.id === bid); if (e) { e.added = added.length; e.dismissed = dismissed.length; renderPicker(); }
  } catch (e) { alert('Save failed: ' + e.message); }
  placeBoxes(); renderPanel();
}
function refreshPlan() { PLAN = BP.plan; renderChanges(); }
async function runFinder() {
  $('#runFinder').textContent = 'running (local CPU)…'; $('#runFinder').disabled = true;
  try { const d = await post(api('/finder')); BP = {...d}; added = BP.added; dismissed = BP.dismissed; }
  catch (e) { notes = ['finder failed: ' + e.message]; }
  placeBoxes(); renderPanel();
}

function renderChanges() {
  const el = $('#changes'); if (!el) return;
  if (!PLAN || !added.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<h4>What applying would change in the blueprint</h4><ul>
    ${PLAN.errors.map(e => `<li class="err">${esc(e)}</li>`).join('')}${PLAN.skipped.map(e => `<li class="help">skip ${esc(e)}</li>`).join('')}${PLAN.changes.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    <div class="help">The page only records. To write it into the blueprint:<br><code>PYTHONPATH=. venv/bin/python -m petey.validate.field_add --apply ${esc(bid)}</code></div>`;
}
function renderProgress() {
  $('#progress').innerHTML = BP ? `<b>${added.length}</b> to add · <b>${dismissed.length}</b> not fields · <b>${remaining().length}</b> suggestions left` : '';
}

function onKey(e) {
  if (!BP || e.metaKey || e.ctrlKey) return;
  if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) && e.target.type !== 'checkbox') return;
  if (e.key === 'n') gotoSuggestion(1);
  else if (e.key === 'p') gotoSuggestion(-1);
  else if (e.key === 'Enter' && props.length) addProps(props.map((_, i) => i));
  else if (e.key === 'x' && curSid) notAField();
  else if (e.key === 'Escape') cancel();
  else if (e.key === 'f') { $('#showFields').checked = !$('#showFields').checked; placeBoxes(); }
  else if (e.key === 's') { $('#showSug').checked = !$('#showSug').checked; placeBoxes(); }
  else if (e.key === '+' || e.key === '=') setZoom(zoom * 1.25);
  else if (e.key === '-') setZoom(zoom / 1.25);
  else if (/^[1-9]$/.test(e.key)) { const p = +e.key; if (BP.pages.some(x => x.page === p)) { page = p; renderPages(); showPage(); } }
  else return;
  e.preventDefault();
}

init();
</script>
</body>
</html>
