<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Petey · Blueprint review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  /* Look of petey-web (petey-master/petey-web/templates/builder.html): its tokens, fonts, toggle groups and buttons.
     Overlay colours on the page image (--sel, --field, --sug, --added, --none, --txt, group palette) stay saturated:
     they draw on a white PDF page, not on the dark chrome. */
  :root {
    --bg:#111111; --surface:#1c1c1c; --surface-2:#262626; --border:#333333;
    --accent:#d8572a; --accent-h:#e06b3e; --accent-dim:rgba(216,87,42,.12);
    --amber:#f7b538; --amber-dim:rgba(247,181,56,.12); --green:#86efac; --danger:#c32f27; --red:#f0716a;
    --text:#f2ece4; --text-muted:#db7c26; --text-dim:#999999; --r:8px; --r-lg:12px;
    /* older names the rules below use */
    --fg:var(--text); --muted:var(--text-dim); --line:var(--border); --panel:var(--surface-2); --card:var(--surface);
    --ok:var(--green); --bad:var(--red);
    /* on the page image */
    --sel:#1a73e8; --accept:#1e8e3e; --flag:#c5221f; --none:#8a8a8a; --orphan:#9a9a9a; --over:rgba(26,115,232,.18);
    --field:#8e24aa; --sug:#e37400; --added:#188038; --txt:#00838f;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; font:13px/1.45 'DM Sans', system-ui, sans-serif; color:var(--text); background:var(--bg); height:100vh;
         display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  code, kbd, .fid { font-family:ui-monospace, Menlo, monospace; }
  a { color:var(--text-muted); }

  header, #modebar { display:flex; gap:14px; align-items:center; padding:8px 16px; flex-wrap:wrap; }
  header { border-bottom:1px solid var(--border); background:var(--bg); }
  .brand { display:flex; align-items:baseline; gap:10px; margin-right:6px; }
  .brand h1 { margin:0; font:400 1.65rem/1 'DM Serif Display', Georgia, serif; letter-spacing:-.01em; }
  .brand h1 .dot { color:var(--accent); }
  .brand .sub { font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); }
  .ctl { display:inline-flex; align-items:center; gap:6px; font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); }
  .spacer { flex:1; }
  #modebar { border-bottom:1px solid var(--border); background:var(--surface); min-height:40px; }

  select, input[type=text], input:not([type]), textarea {
    font:inherit; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; color:var(--text);
    padding:.24rem .45rem; transition:border-color .15s; }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  select option { background:var(--surface-2); color:var(--text); }
  input[type=checkbox] { accent-color:var(--accent); vertical-align:-2px; }
  textarea::placeholder, input::placeholder { color:var(--text-dim); }
  header select { max-width:520px; }
  /* one line (2026-10-13): the form menu gives way first, then the subtitle */
  header { flex-wrap:nowrap; gap:8px; } header > * { flex-shrink:0; }
  header #listorder { width:112px; }
  header #pick { flex:0 1 380px; min-width:140px; width:380px; }
  @media (max-width:1500px) { .brand .sub { display:none; } }
  header .ctl select { text-transform:none; letter-spacing:0; font-weight:400; font-size:.8rem; }

  /* toggle group, as petey-web's mode toggle */
  .tabs { display:flex; border:1px solid var(--border); border-radius:5px; overflow:hidden; }
  .tabs button { font:inherit; font-size:.8rem; padding:.32rem .95rem; border:none; background:transparent; color:var(--text-muted); cursor:pointer; transition:all .15s; }
  .tabs button + button { border-left:1px solid var(--border); }
  .tabs button:hover:not(.on) { color:var(--text); }
  .tabs button.on { background:var(--accent); color:#000; font-weight:600; }

  /* buttons, as petey-web's schema buttons */
  .pages button, .btn { font:inherit; font-size:.78rem; font-weight:500; padding:.26rem .75rem; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-muted); border-radius:5px; cursor:pointer; transition:all .15s; text-decoration:none; }
  .pages button:hover, .btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .pages button.on { background:var(--accent-dim); border-color:var(--accent); color:var(--text); font-weight:600; }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#000; font-weight:700; letter-spacing:.02em; }
  .btn.primary:hover:not(:disabled) { background:var(--accent-h); color:#000; }
  .btn.warn { border-color:rgba(195,47,39,.55); color:var(--red); }
  .btn.warn:hover:not(:disabled) { background:var(--danger); border-color:var(--danger); color:#000; }
  .help { color:var(--text-dim); font-size:12px; }
  .stale, .err { color:var(--red); }
  .progress { color:var(--text-dim); font-size:.8rem; } .progress b { color:var(--text); }
  .progress.justchecked { color:var(--green); }

  main { flex:1; display:flex; min-height:0; }
  /* Audit mode (run_audit): read-only tables, so the page image gives way and the panel takes the width */
  body.audit #left, body.audit #sidegrip { display:none; }
  body.audit #panel { flex:1; width:auto !important; max-width:none; }
  .aud table { border-collapse:collapse; font-size:12px; margin:6px 0 14px; }
  .aud th, .aud td { border-bottom:1px solid var(--border); padding:3px 8px; text-align:left; vertical-align:top; }
  .aud th { color:var(--text-dim); font-weight:500; }
  .aud td.n, .aud th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .aud tr.click { cursor:pointer; } .aud tr.click:hover td { background:var(--surface-2); }
  .aud tr.cur td { background:var(--accent-dim); }
  .aud .kind { display:inline-block; padding:0 6px; border-radius:4px; background:var(--surface-2); border:1px solid var(--border); font-size:11px; white-space:nowrap; }
  .aud .bad { color:var(--red); } .aud .good { color:var(--green); } .aud .warnc { color:var(--amber); }
  .aud details { margin:0; } .aud details summary { cursor:pointer; }
  .aud pre { white-space:pre-wrap; font-size:11px; margin:2px 0 0; color:var(--text-dim); }
  .aud h3 { margin:4px 0 2px; } .aud h4 { margin:12px 0 2px; }
  #left { flex:1; display:flex; flex-direction:column; min-width:0; }
  #pages { display:flex; gap:4px; padding:6px 16px; border-bottom:1px solid var(--border); background:var(--surface); overflow-x:auto; white-space:nowrap; flex-shrink:0; }
  #pages:empty { display:none; }
  #stage { flex:1; overflow:auto; background:var(--bg); }
  #helpmenu { position:fixed; right:16px; top:56px; width:440px; max-height:75vh; overflow:auto; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-lg); box-shadow:0 8px 28px rgba(0,0,0,.55); padding:14px 18px; z-index:20; }
  #helpmenu h4 { margin:12px 0 6px; } #helpmenu h4:first-child { margin-top:0; }
  #helpmenu table { border-collapse:collapse; width:100%; } #helpmenu td { padding:3px 8px 3px 0; vertical-align:top; }
  #helpmenu td:first-child { white-space:nowrap; width:1%; } #helpmenu ul { margin:4px 0; padding-left:18px; } #helpmenu li { margin:3px 0; }
  kbd { font-size:11px; border:1px solid var(--border); border-bottom-width:2px; border-radius:3px; padding:0 5px; background:var(--surface-2); color:var(--text); }
  #canvas { position:relative; margin:16px; display:inline-block; box-shadow:0 2px 14px rgba(0,0,0,.6); border-radius:2px; user-select:none; }
  #canvas.drawable { cursor:crosshair; }
  #canvas img { display:block; -webkit-user-drag:none; pointer-events:none; }
  aside { width:460px; border-left:1px solid var(--border); background:var(--bg); overflow:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  aside > * { flex-shrink:0; }
  #sidegrip { width:6px; margin-left:-3px; cursor:col-resize; flex-shrink:0; z-index:7; }
  #sidegrip:hover, #sidegrip.drag { background:var(--accent-dim); }
  #toast { position:fixed; left:16px; bottom:16px; background:var(--surface-2); color:var(--text); border:1px solid var(--border); padding:7px 14px;
    border-radius:var(--r); font-size:12px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:10; }
  #toast.on { opacity:.97; }
  h4 { margin:0 0 6px; font-size:.74rem; color:var(--text-muted); font-weight:700; letter-spacing:.03em; }
  .sect > h4, #helpmenu h4 { font-size:.67rem; letter-spacing:.13em; text-transform:uppercase; }
  h2, h3 { color:var(--text); font-weight:600; }
  .badge { font-size:11px; font-weight:600; border-radius:3px; padding:0 5px; }
  code { color:var(--text); }

  /* review */
  .rv { position:absolute; border:1.5px solid var(--none); cursor:pointer; }
  .rv.accept { border-color:var(--accept); }
  .rv.flag { border-color:var(--flag); background:rgba(197,34,31,.06); }
  .rv.contested:not(.accept):not(.flag) { border-style:dashed; border-color:#c5221f; }
  .rv.removed { border:2px dashed var(--flag); background:rgba(197,34,31,.18); }
  .rlist div.removed { text-decoration:line-through; color:var(--text-dim); }
  .rbanner { background:rgba(195,47,39,.14); border:1px solid rgba(195,47,39,.45); color:var(--red); padding:7px 10px; border-radius:var(--r); margin:8px 0; }
  .rv.clash { outline:3px solid var(--cc); outline-offset:1px; z-index:6; }
  /* the selected field, loud (Andrew, 2026-10-14: hard to find on a dense page): a thick border, a white ring that
     shows on any background, a wide glow, and one pulse when it is selected */
  .rv.sel { border:3px solid var(--sel); box-shadow:0 0 18px 6px rgba(26,115,232,.55); z-index:2; }
  .rv.sel.pulse { animation:selpulse .9s ease-out 1; }     /* only when a different field is selected */
  @keyframes selpulse { 0% { box-shadow:0 0 0 0 rgba(26,115,232,.9); } 60% { box-shadow:0 0 0 24px rgba(26,115,232,0); }
                        100% { box-shadow:0 0 18px 6px rgba(26,115,232,.55); } }
  .rv.optsel { border-color:var(--accent); box-shadow:0 0 14px 5px color-mix(in srgb, var(--accent) 60%, transparent); z-index:3; }
  .orow.osel input { outline:2px solid var(--accent); outline-offset:-1px; }
  dl { display:grid; grid-template-columns:96px 1fr; gap:3px 8px; margin:8px 0; } dt { color:var(--text-dim); } dd { margin:0; word-break:break-word; }
  .rpanel h2 { font-size:15px; margin:0 0 6px; word-break:break-all; }
  .verdict { display:flex; gap:8px; margin:12px 0 6px; }
  .verdict .btn { padding:.4rem 1.1rem; }
  .verdict .btn.accept { border-color:rgba(134,239,172,.4); color:var(--green); } .verdict .btn.flag { border-color:rgba(240,113,106,.45); color:var(--red); }
  .verdict .btn.on.accept { background:var(--green); border-color:var(--green); color:#000; font-weight:700; }
  .verdict .btn.on.flag { background:var(--danger); border-color:var(--danger); color:#000; font-weight:700; }
  textarea { width:100%; min-height:54px; resize:vertical; }
  .loop { background:var(--amber-dim); border:1px solid rgba(247,181,56,.28); padding:7px 10px; border-radius:var(--r); margin:8px 0; }
  .adj { background:var(--accent-dim); border:1px solid rgba(216,87,42,.3); padding:7px 10px; border-radius:var(--r); margin:8px 0; }
  .rlist { margin-top:4px; border-top:1px solid var(--border); padding-top:8px; max-height:38vh; overflow:auto; }
  .rlist div { padding:2px 6px; cursor:pointer; border-left:3px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:0 3px 3px 0; }
  .rlist div:hover { background:var(--surface); }
  .rlist div.accept { border-left-color:var(--green); } .rlist div.flag { border-left-color:var(--red); } .rlist div.sel { background:var(--accent-dim); color:var(--text); }
  .badge.checked { background:var(--accent-dim); color:var(--text-muted); border:1px solid rgba(216,87,42,.35); }
  .badge.validated { background:var(--green); color:#000; border:1px solid var(--green); }
  .badge.stalecheck { background:var(--amber-dim); color:var(--amber); border:1px solid rgba(247,181,56,.3); }
  .tier { display:inline-block; min-width:1.1em; text-align:center; font-size:11px; font-weight:600; border-radius:3px; padding:0 3px; margin-right:4px; }
  .tier.contested { background:rgba(195,47,39,.2); color:var(--red); } .tier.unknown { background:var(--surface-2); color:var(--text-dim); }
  .tier.single { background:var(--amber-dim); color:var(--amber); } .tier.settled { background:rgba(134,239,172,.12); color:var(--green); }
  .agent { margin:8px 0; padding:7px 10px; border:1px solid var(--accent); border-radius:var(--r); font-size:13px; background:var(--accent-dim); }
  details.meta { font-size:12px; } details.meta summary { cursor:pointer; color:var(--text-dim); } details.meta dl { margin:4px 0; }
  .fcard { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:12px 14px; }
  .fcard h4 { display:flex; gap:6px; align-items:center; cursor:copy; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--border); }
  .fgrid { display:grid; grid-template-columns:104px 1fr; gap:5px 8px; align-items:center; margin:6px 0; }
  .fgrid > label, .fgrid > .lbl { color:var(--text-dim); } .fgrid > span { word-break:break-word; }
  .fcard input, .fcard select { width:100%; padding:3px 6px; }
  .fcard input.dirty, .fcard select.dirty { border-color:var(--amber); background:var(--amber-dim); }
  .frow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sect { margin:12px 0 0; }
  .listorder { display:flex; gap:14px; align-items:center; margin-top:6px; }
  .otable { display:flex; flex-direction:column; gap:3px; } .orow { display:grid; grid-template-columns:38% 1fr; gap:4px; }
  .fid { font-size:11px; color:var(--text-dim); }
  .fcard h4 .fid { font-size:12px; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:3px; padding:0 5px; }
  .why { margin:8px 0; font-size:13px; } .why div { padding:2px 0 2px 9px; border-left:3px solid; margin:3px 0; }
  .why .usefix { padding:0 7px; font-size:11px; margin-left:4px; }
  .why .error { border-color:var(--red); } .why .suggestion { border-color:var(--amber); color:var(--text-dim); }
  details.raw { font-size:12px; } details.raw summary { cursor:pointer; color:var(--text-dim); }
  .wit { margin:8px 0; font-size:12px; } .wit div { padding:1px 0; } .wit .no { color:var(--red); } .wit .yes { color:var(--green); } .wit .mute { color:var(--text-dim); }

  /* groups */
  .gh { position:absolute; border:1.5px dashed var(--c); background:color-mix(in srgb, var(--c) 7%, transparent); border-radius:3px; z-index:1; cursor:pointer; }
  .gh.sel { border-style:solid; border-width:2px; background:color-mix(in srgb, var(--c) 14%, transparent); z-index:2; }
  .gh.ok { border-style:solid; }
  .gh.rvg, .gh.rvg.sel { z-index:0; }      /* Review's group hulls sit under the field boxes, which stay clickable */
  .gi { position:absolute; border:2px solid var(--c); background:color-mix(in srgb, var(--c) 18%, transparent); z-index:3; cursor:grab; }
  .gi::after { content:''; position:absolute; inset:-3px; }
  .gi.orphan { border-style:dashed; background:transparent; }
  .gi.sel { box-shadow:0 0 0 2px #fff, 0 0 0 5px var(--sel), 0 0 16px 5px rgba(26,115,232,.5); z-index:4; }
  .gi.locked { cursor:not-allowed; } .gi.dragging { opacity:.35; }
  .gi.picked { outline:2.5px solid var(--sel); outline-offset:2px; z-index:5; }
  .over { outline:3px solid var(--accent) !important; background:var(--accent-dim) !important; }
  .gcard { border:1px solid var(--border); border-left:4px solid var(--c, var(--orphan)); border-radius:var(--r); padding:7px 10px; background:var(--surface); }
  .gcard.sel { box-shadow:0 0 0 1.5px var(--accent); } .gcard.ok { border-left-color:var(--green); }
  .gcard h3 { margin:0; font-size:13px; display:flex; gap:6px; align-items:center; cursor:pointer; word-break:break-all; }
  .gcard h3 .grip { cursor:grab; color:var(--text-dim); }
  .gchips { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .gchip { border:1px solid var(--border); border-radius:10px; padding:1px 8px; background:var(--surface-2); cursor:grab; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  .gchip.orphan { border-style:dashed; } .gchip.sel { border-color:var(--accent); color:var(--text); } .gchip .x { margin-left:5px; color:var(--text-dim); cursor:pointer; }
  .tray { border:1.5px dashed var(--border); border-radius:var(--r); padding:8px 10px; min-height:44px; }
  .gcur { background:var(--surface); border:1px solid var(--accent); border-radius:var(--r-lg); padding:12px 14px; }
  .gcur h2 { margin:0 0 6px; font-size:14px; } .gcur input[type=text] { width:100%; }
  .gcur .row { display:flex; gap:8px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  .gcur ol { margin:6px 0; padding-left:20px; }
  .btn.ok { border-color:rgba(134,239,172,.4); color:var(--green); } .btn.ok:hover:not(:disabled) { border-color:var(--green); color:var(--green); }
  .btn.ok.on { background:var(--green); border-color:var(--green); color:#000; font-weight:700; }
  #draftBar { display:flex; gap:6px; align-items:center; font-size:.8rem; } #draftBar[hidden] { display:none; }
  .badge.edit { background:var(--amber-dim); color:var(--amber); } .badge.new { background:var(--accent-dim); color:var(--text-muted); } .badge.ok { background:rgba(134,239,172,.12); color:var(--green); }
  .warn { color:var(--red); font-size:12px; }
  .changes { font-size:12px; } .changes li { margin:2px 0; } .changes .err { color:var(--red); }

  /* add fields */
  .ov { position:absolute; }
  .ov.field { border:1.5px solid var(--field); background:color-mix(in srgb, var(--field) 10%, transparent); }
  .ov.field.removed { border:2px dashed var(--flag); background:rgba(197,34,31,.18); }
  .ov.field.picked { box-shadow:0 0 0 2px var(--sel); }
  .ov.field:hover { background:color-mix(in srgb, var(--field) 25%, transparent); }
  .ov.sug { border:2px solid var(--sug); background:color-mix(in srgb, var(--sug) 10%, transparent); cursor:pointer; }
  .ov.sug.finder { border-style:dashed; } .ov.sug.copy { opacity:.35; } .ov.sug.cur { box-shadow:0 0 0 2px var(--sel); }
  .ov.added { border:2px solid var(--added); background:color-mix(in srgb, var(--added) 12%, transparent); cursor:pointer; }
  .ov.added .tag { position:absolute; left:0; top:-14px; font-size:10px; line-height:12px; background:#fff; color:var(--added); padding:0 3px; white-space:nowrap; pointer-events:none; }
  .ov.prop { border:2px solid var(--sel); background:color-mix(in srgb, var(--sel) 12%, transparent); pointer-events:none; }
  .ov.draw { border:1.5px dashed var(--sel); background:color-mix(in srgb, var(--sel) 8%, transparent); pointer-events:none; }
  .acard { background:var(--surface); border:1px solid var(--accent); border-radius:var(--r-lg); padding:12px 14px; }
  .acard h3 { margin:0 0 8px; font-size:13px; }
  .acard input[type=text], .acard textarea, .acard select { width:100%; }
  .acard textarea { min-height:40px; }
  .grid { display:grid; grid-template-columns:84px 1fr; gap:5px 8px; align-items:center; margin:6px 0; } .grid label { color:var(--text-dim); }
  .achips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .achip { border:1px solid var(--border); border-radius:10px; padding:1px 8px; background:var(--surface-2); cursor:pointer; font-size:12px; }
  .achip.on { border-color:var(--accent); background:var(--accent-dim); color:var(--text); } .achip .src { color:var(--text-dim); margin-left:4px; }
  .ev { font-size:12px; color:var(--text-dim); margin:6px 0 0; padding-left:16px; }
  .opts td { padding:1px 3px; } .opts input { width:100%; }
  .arow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .notes { font-size:12px; color:var(--text-dim); }
  .alist div { padding:2px 6px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; border-radius:3px; }
  .alist div:hover { background:var(--surface); } .alist .x { color:var(--text-dim); }

  .gi.text { border-width:1.5px; background:color-mix(in srgb, var(--c) 8%, transparent); }
  .gi.text.loose { opacity:.85; }
  .gh.text { border-style:solid; border-width:2px; }

  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--surface-2); border-radius:5px; border:2px solid var(--bg); } ::-webkit-scrollbar-thumb:hover { background:var(--border); }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Petey<span class="dot">.</span></h1><span class="sub">Blueprint review</span></div>
  <select id="pick"></select>
  <label class="ctl" title="order of the form menu"><select id="listorder"><option value="name">by name</option><option value="oldest">oldest first</option><option value="errors">most errors first</option></select></label>
  <span class="tabs" id="tabs">
    <button data-mode="review" title="Shift+1">Review</button><button data-mode="groups" title="Shift+2">Groups</button><button data-mode="add" title="Shift+3">Add / remove</button><button data-mode="audit" title="Shift+4">Audit</button>
  </span>
  <button class="btn" id="clashBtn" disabled title="fields that would share a name once saved corrections are applied (apply refuses them): click to outline each set in its own color, in Review">clashes</button>
  <span id="draftBar" hidden></span>
  <span class="spacer"></span>
  <span class="ctl"><button class="btn" id="zout" title="zoom out (-)">-</button> <button class="btn" id="zin" title="zoom in (+)">+</button></span>
  <a class="btn" href="/extract" title="drop filled PDFs and get their data (petey.web)">extract</a>
  <button class="btn" id="reboot" title="restart the server so edited code loads, then reload this page">reboot</button>
  <button class="btn" id="helpBtn" title="keyboard shortcuts and how this mode works">help</button>
</header>
<div id="modebar"></div>
<div id="helpmenu" hidden></div>
<main>
  <div id="left">
    <div class="pages" id="pages"></div>
    <div id="stage"><div id="canvas"><img id="img" alt=""></div></div>
  </div>
  <div id="sidegrip" title="drag to resize the sidebar"></div>
  <aside id="panel"><p class="help">Pick a blueprint.</p></aside>
</main>
<div id="toast"></div>
<script>
// ======================================================================= shared: picker, modes, page, zoom, keys
let LIST = [], bid = null, page = 1, zoom = 1.6, scale = 1, mode = 'review', shaSeen = null;
const MODE = {};
const M = () => MODE[mode];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function j(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); }
const send = (method, url, body) => j(url, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
const mapi = (m, p = '') => `/api/${m}/${encodeURIComponent(bid)}${p}`;
function localNow() { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; }
function overlap(a, b) {
  const ix = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])), iy = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  const i = ix * iy; if (i <= 0) return 0;
  return i / Math.min(Math.max((a[2] - a[0]) * (a[3] - a[1]), 1e-6), Math.max((b[2] - b[0]) * (b[3] - b[1]), 1e-6));
}
// the sidebar's width: drag its left edge; kept per browser (Andrew, 2026-10-13: long field names did not fit)
function bindSideGrip() {
  const g = $('#sidegrip'), a = $('#panel'); if (!g || !a) return;
  const setW = w => { a.style.width = Math.max(280, Math.min(window.innerWidth - 320, w)) + 'px'; };
  const saved = +store('br_side_w'); if (saved) setW(saved);
  g.onmousedown = e => {
    e.preventDefault(); g.classList.add('drag');
    const move = ev => setW(window.innerWidth - ev.clientX);
    const up = () => {
      g.classList.remove('drag'); window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up);
      store('br_side_w', parseInt(a.style.width)); if (bid) placeAll();
    };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

async function init() {
  $('#pick').innerHTML = '<option>loading blueprints…</option>';
  try { LIST = await j('/api/blueprints'); }
  catch (e) { $('#pick').innerHTML = ''; $('#panel').innerHTML = `<p class="err">Could not load the blueprint list: ${esc(e.message)}</p>`; return; }
  zoom = parseFloat(store('br_zoom')) || zoom;
  $('#listorder').value = store('br_listorder') || 'name';
  const [hm, hb] = decodeURIComponent(location.hash.slice(1)).split('/');
  mode = MODE[hm] ? hm : (store('br_mode') || 'review');
  renderTabs(); renderPicker(); renderModebar();
  $('#pick').addEventListener('change', () => openBlueprint($('#pick').value));
  $('#listorder').addEventListener('change', e => { store('br_listorder', e.target.value); renderPicker(); });
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  bindSideGrip();
  $('#clashBtn').onclick = async () => { if (mode !== 'review') await setMode('review'); MODE.review.toggleClashes(); };
  $('#zin').onclick = () => setZoom(zoom * 1.25); $('#zout').onclick = () => setZoom(zoom / 1.25);
  $('#reboot').onclick = reboot;
  $('#helpBtn').onclick = e => { e.stopPropagation(); toggleHelp(); };
  document.addEventListener('click', e => { if (!$('#helpmenu').hidden && !$('#helpmenu').contains(e.target)) toggleHelp(false); });
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', () => bid && placeAll());
  window.addEventListener('focus', checkFresh);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkFresh(); });
  setInterval(() => { if (!document.hidden) checkFresh(); }, 20000);
  bindCanvas();
  const first = hb && LIST.some(b => b.id === hb) ? hb : null;
  if (first) { $('#pick').value = first; openBlueprint(first); }
}

// the reboot button: the server re-execs itself on the same port (edited Python loads); wait for it to answer
// again, re-indexing takes a while, then reload the page so edited HTML loads too
async function reboot() {
  const b = $('#reboot'); b.disabled = true; b.textContent = 'rebooting…';
  try { await send('POST', '/api/restart'); }
  catch (e) { b.disabled = false; b.textContent = 'reboot'; alert('Reboot failed: ' + e.message); return; }
  await new Promise(r => setTimeout(r, 1000));
  for (let i = 0; i < 300; i++) {
    try { const r = await fetch('/api/blueprints', {cache: 'no-store'}); if (r.ok) { location.reload(); return; } } catch (e) {}
    await new Promise(r => setTimeout(r, 1000));
  }
  b.disabled = false; b.textContent = 'reboot';
  alert('The server did not come back within 5 minutes; check the terminal it was started from.');
}
function setHash() { history.replaceState(null, '', '#' + encodeURIComponent(mode) + (bid ? '/' + encodeURIComponent(bid) : '')); }
function renderTabs() { document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode)); $('#canvas').classList.toggle('drawable', mode === 'add'); document.body.classList.toggle('audit', mode === 'audit'); }

function pickerText(b) {
  // short (Andrew, 2026-10-13: the long rows widened the menu and pushed the header buttons onto a second line):
  // fields, reviewed, VALIDATED; a * marks an unsaved working copy
  const done = b.accepted + b.flagged;
  const bits = [`${b.fields} fields`, `${done} reviewed`];
  if (b.checked && b.checked.validated) bits.push('VALIDATED');
  return `${b.form}${b.draft ? ' *' : ''}  (${bits.join(', ')})`;
}
function renderPicker() {
  const pick = $('#pick'), keep = pick.value || bid;
  pick.innerHTML = '<option value="">pick a blueprint…</option>';
  const groups = {focus: 'name-check follow-up (flags to confirm)', t1: 'launch T1', t2: 'launch T2', t3: 'launch T3', t4: 'launch T4',
                  rerun: 'fresh runs of library forms (new code)', lib: 'library', je: 'judge-eval side copies',
                  rl: 'relabels', fl: 'flat forms'};
  const how = $('#listorder').value;
  // most errors first (Andrew, 2026-10-07): the page check's errors, then its suggestions, within each section; a
  // blueprint with no page check sorts last
  const errs = x => x.check_errors ?? (x.page_check_flags ?? -1), sugs = x => x.check_suggestions ?? 0;
  const order = how === 'oldest' ? (a, b) => ((a.age || {}).when || '').localeCompare((b.age || {}).when || '') || a.form.localeCompare(b.form)
              : how === 'errors' ? (a, b) => (errs(b) - errs(a)) || (sugs(b) - sugs(a)) || a.form.localeCompare(b.form)
              : (a, b) => a.form.localeCompare(b.form);
  const groupOf = x => x.focus != null ? 'focus' : x.launch ? 't' + x.launch : x.rerun ? 'rerun' : x.source;
  for (const src of Object.keys(groups)) {
    const items = LIST.filter(x => groupOf(x) === src); if (!items.length) continue;
    items.sort(src === 'focus' ? (a, b) => (b.focus - a.focus) || a.form.localeCompare(b.form) : order);
    const nv = items.filter(x => x.checked && x.checked.validated).length;
    const og = document.createElement('optgroup'); og.label = `${groups[src]} (${nv} of ${items.length} validated)`;
    for (const b of items) { const o = document.createElement('option'); o.value = b.id; o.textContent = pickerText(b); og.appendChild(o); }
    pick.appendChild(og);
  }
  if (keep && LIST.some(b => b.id === keep)) pick.value = keep;
}
function updateEntry(e) { if (!e) return; const i = LIST.findIndex(b => b.id === e.id); if (i >= 0) LIST[i] = e; renderPicker(); if (e.id === bid) renderDraft(); }

// the working copy (2026-10-13, Andrew: "everything should be reading from the same source"): every change goes into
// one copy of the blueprint that all three modes read; this bar saves it over the blueprint or throws it away
function renderDraft() {
  const el = $('#draftBar'), d = bid && (LIST.find(b => b.id === bid) || {}).draft;
  if (!d) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = `${d.real_changed ? '<span class="stale" title="a loop run or an edit by hand changed the blueprint after the working copy was made">file changed on disk</span>' : ''}
    <button class="btn ok" id="dSave" title="${esc('save the working copy into the blueprint\n\n' + (d.log.length ? d.log.join('\n') : 'no changes to the blueprint yet (verdicts only)'))}">save (${d.changes})</button>
    <button class="btn" id="dDiscard" title="throw the working copy away (made ${esc(d.made)}); verdicts and notes since then go with it">discard</button>`;
  $('#dSave').onclick = saveDraft; $('#dDiscard').onclick = discardDraft;
}
async function saveDraft() {
  if (mode === 'groups') await MODE.groups.leave();
  const d = (LIST.find(b => b.id === bid) || {}).draft; if (!d) return;
  if (!confirm(`Write ${d.changes} change(s) into the blueprint?\n\n${d.log.slice(0, 40).join('\n')}${d.log.length > 40 ? `\n… ${d.log.length - 40} more` : ''}`)) return;
  let out;
  try { out = await send('POST', mapi('draft', '/save')); }
  catch (e) {
    if (!/changed on disk/.test(e.message) || !confirm(e.message + '\n\nOverwrite it with the working copy anyway?')) { alert('Not saved: ' + e.message); return; }
    try { out = await send('POST', mapi('draft', '/save'), {force: true}); } catch (e2) { alert('Not saved: ' + e2.message); return; }
  }
  updateEntry(out.entry); await loadMode();
  toast(`Saved ${out.changes} change(s) to ${out.saved.split('/').pop()}.`);
}
async function discardDraft() {
  const d = (LIST.find(b => b.id === bid) || {}).draft; if (!d) return;
  if (!confirm(`Throw away the working copy (${d.changes} change(s) since ${d.made})?\n\nVerdicts and notes made since then go with it.`)) return;
  let out;
  try { out = await send('POST', mapi('draft', '/discard')); } catch (e) { alert('Discard failed: ' + e.message); return; }
  updateEntry(out.entry); await loadMode();
  toast(`Discarded ${out.discarded} change(s); the blueprint is as it was.`);
}
async function syncSha() { try { shaSeen = (await j(`/api/blueprints/${encodeURIComponent(bid)}/sha`)).sha; } catch (e) {} }

async function openBlueprint(id) {
  if (!id) return;
  if (bid && mode === 'groups') await MODE.groups.leave();
  bid = id; setHash(); renderDraft();
  $('#panel').innerHTML = '<p class="help">loading…</p>';
  await loadMode();
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 4000); }
// the blueprint file can change under the page (an --apply, a loop run): reload the mode in place when it does
let checking = false;
async function checkFresh() {
  if (!bid || checking) return; checking = true;
  try {
    const {sha} = await j(`/api/blueprints/${encodeURIComponent(bid)}/sha`);
    if (shaSeen && sha !== shaSeen) {
      LIST = await j('/api/blueprints'); renderPicker();
      await loadMode();
      toast('The blueprint changed on disk; reloaded.');
    }
  } catch (e) {} finally { checking = false; }
}
async function loadMode() {
  try { await M().load(); }
  catch (e) { $('#panel').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  await syncSha(); renderDraft();
  const pages = M().pages();
  if (!pages.some(p => p.page === page) || !M().pageLabel(page)) page = M().startPage() || (pages[0] || {}).page || 1;
  renderModebar(); renderPages(); await showPage(); M().panel(); M().progress();
}
async function setMode(m) {
  if (!MODE[m] || m === mode) return;
  if (bid && mode === 'groups') await MODE.groups.leave();
  mode = m; store('br_mode', m); renderTabs(); setHash();
  if (!$('#helpmenu').hidden) toggleHelp(true);
  document.querySelectorAll('#canvas > div').forEach(e => e.remove());
  if (bid) await loadMode(); else renderModebar();
}
function renderModebar() { $('#modebar').innerHTML = M().bar(); M().bindBar(); }

function renderPages() {
  const el = $('#pages'); el.innerHTML = '';
  for (const p of M().pages()) {
    const label = M().pageLabel(p.page); if (!label) continue;
    const b = document.createElement('button'); b.textContent = label;
    b.className = p.page === page ? 'on' : ''; b.onclick = () => gotoPage(p.page);
    el.appendChild(b);
  }
}
async function gotoPage(p) { page = p; renderPages(); await showPage(); if (M().onPage) M().onPage(); M().panel(); }
function setZoom(z) { zoom = Math.min(6, Math.max(0.6, z)); store('br_zoom', zoom); if (bid) { sizeImage(); placeAll(); } }
function sizeImage() { const p = M().pages().find(x => x.page === page); if (p) $('#img').style.width = (p.w_pt * zoom) + 'px'; }
async function showPage() {
  const img = $('#img'), url = `/api/blueprints/${encodeURIComponent(bid)}/png/${page}`;
  sizeImage();
  if (!(img.complete && img.getAttribute('src') === url)) await new Promise(res => { img.onload = res; img.onerror = res; img.src = url; });
  placeAll();
}
function placeAll() {
  const canvas = $('#canvas'); canvas.querySelectorAll(':scope > div').forEach(e => e.remove());
  const p = M().pages().find(x => x.page === page); if (!p) return;
  scale = $('#img').clientWidth / p.w_pt;
  M().place();
}
function put(cls, r, title) {
  const d = document.createElement('div'); d.className = cls;
  d.style.left = (r[0] * scale) + 'px'; d.style.top = (r[1] * scale) + 'px';
  d.style.width = Math.max(5, (r[2] - r[0]) * scale) + 'px'; d.style.height = Math.max(5, (r[3] - r[1]) * scale) + 'px';
  if (title) d.title = title;
  $('#canvas').appendChild(d); return d;
}
function bindCanvas() {
  $('#canvas').addEventListener('mousedown', e => { if (bid && M().mousedown) M().mousedown(e); });
  window.addEventListener('mousemove', e => { if (bid && M().mousemove) M().mousemove(e); });
  window.addEventListener('mouseup', e => { if (bid && M().mouseup) M().mouseup(e); });
}

// the help menu (2026-10-07): every key hint lives here, not in the bars and buttons; the current mode first
const GLOBAL_KEYS = [['Shift+1 / 2 / 3 / 4', 'Review / Groups / Add / remove / Audit'], ['1-9', 'go to that page'], ['+ / -', 'zoom in / out'], ['?', 'this help']];
const MODE_NAME = {review: 'Review', groups: 'Groups', add: 'Add / remove', audit: 'Audit'};
function helpHtml() {
  const keys = rows => `<table>${rows.map(([k, d]) => `<tr><td>${k.split(' / ').map(x => `<kbd>${esc(x)}</kbd>`).join(' / ')}</td><td>${esc(d)}</td></tr>`).join('')}</table>`;
  const h = M().help || {keys: [], tips: []};
  return `<h4>${esc(MODE_NAME[mode])}</h4>${keys(h.keys)}${h.tips.length ? `<ul class="help">${h.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    <h4>Everywhere</h4>${keys(GLOBAL_KEYS)}`;
}
function toggleHelp(on) {
  const el = $('#helpmenu'); on = on ?? el.hidden;
  if (on) el.innerHTML = helpHtml();
  el.hidden = !on;
}

function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && ['TEXTAREA', 'INPUT', 'SELECT'].includes(t.tagName) && t.type !== 'checkbox' && t.type !== 'radio') return;
  if (e.key === '?') { toggleHelp(); e.preventDefault(); return; }
  if (e.key === 'Escape' && !$('#helpmenu').hidden) { toggleHelp(false); e.preventDefault(); return; }
  if (e.shiftKey && /^Digit[1234]$/.test(e.code)) { setMode(['review', 'groups', 'add', 'audit'][+e.code.slice(5) - 1]); e.preventDefault(); return; }
  if (!bid) return;
  if (e.key === '+' || e.key === '=') setZoom(zoom * 1.25);
  else if (e.key === '-') setZoom(zoom / 1.25);
  else if (/^[1-9]$/.test(e.key)) { const p = +e.key; if (M().pages().some(x => x.page === p) && M().pageLabel(p)) gotoPage(p); }
  else if (!M().key(e)) return;
  e.preventDefault();
}

// ======================================================================= Review: accept / flag / note per field
MODE.review = (() => {
  let selOpt = null;           // the option box clicked on the page, within a group (its key): highlighted in the card
  // p / ←: back through the fields actually visited, like a browser's back button (Andrew, 2026-10-14: stepping back
  // through the list landed elsewhere once accepting a field reordered or filtered it)
  let visited = [], goingBack = false, visitedFor = null, pulsed = null;
  let BP = null, selected = null, unrevOnly = false, order = store('hr_order') || 'risk', removed = [], clashOn = false;
  // Claude's changes only: a filter beside 'unreviewed only' (Andrew, 2026-10-14), not an order
  let claudeOnly = store('hr_claude') === '1';
  let flagOnly = false;        // flagged only (2026-10-14); excludes 'unreviewed only', a flag being a verdict
  if (order === 'claude') { order = 'risk'; claudeOnly = true; }
  const TIER_RANK = {contested: 0, unknown: 1, single: 2, settled: 3};
  const TIER_LETTER = {contested: '!', unknown: '?', single: '1', settled: '2+'};
  const verdictOf = n => { const v = BP.verdicts[n]; return v ? v.verdict : ''; };
  const isRemoved = n => removed.some(r => r.name === n);
  // removing a field is recorded with the field-add record (Add / remove mode; field_add --apply drops it); a field
  // removed here also gets a flag with the note "removed" when it has no verdict, so the review stays complete
  async function putRemovals() {
    const out = await send('PUT', mapi('review', '/removals'), {removed});
    updateEntry(out.entry);
    return out;
  }
  async function load() { if (visitedFor !== bid) { visited = []; visitedFor = bid; } const keep = selected; BP = await j(mapi('review')); removed = (await j(mapi('review', '/removals'))).removed; BP.fields.forEach((f, i) => f.idx = i); BP.checked = (LIST.find(b => b.id === bid) || {}).checked || BP.checked; selected = BP.fields.some(f => f.name === keep) ? keep : null; }
  // the page reads the working copy again after a change went into it (a correction, a removal)
  async function reload() { await load(); await syncSha(); renderPages(); placeAll(); panel(); progress(); }
  async function removeField() {
    const f = BP.fields.find(x => x.name === selected); if (!f || isRemoved(f.name)) return;
    const list = ordered(), after = list[(list.indexOf(f) + 1) % list.length];
    removed.push({name: f.name, page: f.page, rect: f.rects[0].rect, when: localNow(), from: 'review'});
    const out = await putRemovals();
    if (out.applied && out.applied.length) {             // gone from the working copy
      await reload(); if (after && after !== f && BP.fields.some(x => x.name === after.name)) select(after.name);
      toast(`Removed ${f.name} from the working copy.`); return;
    }
    if (out.apply_error || (out.errors && out.errors.length)) toast('Recorded, not removed yet: ' + (out.apply_error || out.errors.join('; ')));
    if (!verdictOf(f.name)) await putV({[f.name]: {verdict: 'accept', note: 'removed'}});   // removing it is the fix
    next();
  }
  async function keepField() {
    const f = BP.fields.find(x => x.name === selected); if (!f) return;
    removed = removed.filter(r => r.name !== f.name);
    await putRemovals();
    const v = BP.verdicts[f.name];
    if (v && v.note === 'removed') await putV({[f.name]: null});
    placeAll(); panel();
  }
  // Claude's changes, the riskiest first (Andrew, 2026-10-13: the saved blueprint is the ground truth, so the review
  // time goes to the changes most likely to be wrong): wrong names, added boxes, suggestions, then the rest
  const CLAUDE_RANK = {wrong: 0, add: 1, caption: 3, type: 4, clarity: 5, suffix: 6};
  const claudeRank = f => f.claude ? (CLAUDE_RANK[f.claude.kind] ?? 5) : (f.why || []).some(w => /^Claude:/.test(w.text)) ? 2 : 9;
  function ordered() {
    const list = BP.fields.filter(f => (!unrevOnly || !verdictOf(f.name)) && (!flagOnly || verdictOf(f.name) === 'flag')
                                       && (!claudeOnly || claudeRank(f) < 9));
    if (claudeOnly && order === 'risk') return list.sort((a, b) => (claudeRank(a) - claudeRank(b)) || (a.idx - b.idx));
    if (order === 'risk') list.sort((a, b) => ((TIER_RANK[a.tier] ?? 1) - (TIER_RANK[b.tier] ?? 1)) || (a.idx - b.idx));
    else if (order === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
    return list;
  }
  function select(name, scroll = true, opt = null) {
    if (selected && selected !== name && !goingBack) { visited.push(selected); if (visited.length > 500) visited.shift(); }
    selected = name; selOpt = opt;
    const f = BP.fields.find(x => x.name === name);
    if (f && !f.rects.some(r => r.page === page)) { page = f.page; renderPages(); showPage().then(() => { panel(); if (scroll) scrollSel(); }); return; }
    placeAll(); panel(); if (scroll) scrollSel();
  }
  function scrollSel() { const el = document.querySelector('.rv.sel'); if (el) el.scrollIntoView({block: 'center', inline: 'center', behavior: 'smooth'}); }
  function back() {
    while (visited.length) {
      const n = visited.pop();
      if (n !== selected && BP.fields.some(f => f.name === n)) { goingBack = true; try { select(n); } finally { goingBack = false; } return; }
    }
    next(-1);                                  // nothing visited yet on this form: the previous field in the list
  }
  function next(step = 1) {
    const list = ordered();
    // the last one in the list (unreviewed only, Claude's changes only): stay, but show the verdict that was just saved
    if (!list.length || (list.length === 1 && list[0].name === selected)) { placeAll(); panel(); progress(); toast('No more fields in this list.'); return; }

      if (r.name) {
        const p = props[i], taken = new Set([...added.map(a => a.name), ...props.filter((_, k) => k !== i).map(q => q.name)]);
        let n = r.name, k = 2; while (taken.has(n)) n = `${r.name}_${k++}`;
        p.name_options = p.name_options.filter(o => o.source !== 'labeler').concat([{name: n, source: 'labeler', types: {}}]);
        p.name = n; p.name_source = 'labeler';
      } else notes = ['the labeler returned no name'];
    } catch (e) { notes = ['labeler failed: ' + e.message]; }
    panel();
  }
  function addProps(idx) {
    const bad = idx.map(i => props[i]).filter(p => !/^[a-z0-9][a-z0-9_]*$/.test(p.name || ''));
    if (bad.length) { notes = [`not a field name: ${bad.map(p => p.name).join(', ')}`]; return panel(); }
    const now = localNow();
    for (const i of idx) added.push({...props[i], when: now});
    props = props.filter((_, i) => !idx.includes(i));
    if (!props.length) { notes = []; save().then(() => { if (curSid && remaining().length) gotoSuggestion(1); else { curSid = null; placeAll(); panel(); } }); }
    else save();
  }
  function notAField() {
    const s = BP.suggestions.find(x => x.sid === curSid); if (!s) return;
    dismissed.push({sid: s.sid, page: s.page, rect: s.rect, source: s.source, what: s.what, when: localNow()});
    props = []; notes = []; save().then(() => gotoSuggestion(1));
  }
  function cancel() { props = []; notes = []; picked = null; placeAll(); panel(); }
  // a save goes into the working copy when it plans cleanly: added fields become fields, removed ones go, and the
  // page reads the copy again (the suggestions follow)
  async function save() {
    try {
      PLAN = await send('PUT', mapi('add', '/record'), {added, dismissed, removed}); BP.stale = false; updateEntry(PLAN.entry);
      if (PLAN.applied && PLAN.applied.length) {
        const d = await j(mapi('add')); BP = d; added = d.added; dismissed = d.dismissed; removed = d.removed || [];
        if (picked && !(BP.field_specs || {})[picked]) picked = null;
        await syncSha(); renderPages();
        toast(PLAN.applied.length === 1 ? `Working copy: ${PLAN.applied[0]}` : `${PLAN.applied.length} changes went into the working copy.`);
      }
      if (PLAN.apply_error) notes = ['not applied: ' + PLAN.apply_error];
    }
    catch (e) { alert('Save failed: ' + e.message); }
    placeAll(); panel();
  }
  async function runFinder() {
    $('#runFinder').textContent = 'running (local CPU)…'; $('#runFinder').disabled = true;
    try { BP = await send('POST', mapi('add', '/finder')); added = BP.added; dismissed = BP.dismissed; removed = BP.removed || []; }
    catch (e) { notes = ['finder failed: ' + e.message]; }
    placeAll(); panel();
  }
  function renderChanges() {
    const el = $('#aChanges'); if (!el) return;
    if (!PLAN || (!added.length && !removed.length)) { el.innerHTML = ''; return; }
    el.innerHTML = `<h4>Not in the working copy yet</h4><ul>
      ${PLAN.errors.map(e => `<li class="err">${esc(e)}</li>`).join('')}${(PLAN.skipped || []).map(e => `<li class="help">skip ${esc(e)}</li>`).join('')}${PLAN.changes.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      ${PLAN.changes.length ? `<button class="btn ok" id="aApply" ${PLAN.errors.length ? 'disabled title="fix the errors first"' : ''}>apply to working copy</button>` : ''}
      <div class="help">Additions and removals go into the working copy as they are saved, unless something above stops them.</div>`;
    const b = $('#aApply'); if (b) b.onclick = applyAdds;
  }
  async function applyAdds() { await save(); }
  function progress() { const el = $('#progress'); if (el && BP) el.innerHTML = `<b>${added.length}</b> to add · <b>${removed.length}</b> to remove · <b>${dismissed.length}</b> not fields · <b>${remaining().length}</b> suggestions left`; }
  const pt = e => { const r = $('#canvas').getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale]; };
  return {
    async load() {
      BP = await j(mapi('add'));
      added = BP.added; dismissed = BP.dismissed; removed = BP.removed || []; props = []; notes = []; curSid = null; picked = null; PLAN = BP.plan;
    },
    pages: () => BP ? BP.pages : [],
    startPage: () => (remaining()[0] || {}).page || 1,
    pageLabel(p) { const n = remaining().filter(s => s.page === p).length; return `p${p}${n ? ` (${n})` : ''}`; },
    bar: () => `<span class="progress" id="progress"></span>
      <label class="help"><input type="checkbox" id="aFields" ${showFields ? 'checked' : ''}> fields</label>
      <label class="help"><input type="checkbox" id="aSug" ${showSug ? 'checked' : ''}> suggestions</label>
      <label class="help"><input type="checkbox" id="aCopies" ${copies ? 'checked' : ''}> repeated copies</label>`,
    help: {keys: [['n', 'next suggestion'], ['p', 'previous suggestion'], ['Enter', 'add what is proposed'], ['x', 'not a field'],
                  ['d', 'remove the clicked field / keep it'], ['Esc', 'cancel'], ['f', 'fields on / off'], ['s', 'suggestions on / off']],
           tips: ['Drag over an area of the page, or click a box, to propose a field.', 'Click a purple field (one the blueprint has) to remove it.']},
    bindBar() {
      $('#aFields').onchange = e => { showFields = e.target.checked; placeAll(); };
      $('#aSug').onchange = e => { showSug = e.target.checked; placeAll(); };
      $('#aCopies').onchange = e => { copies = e.target.checked; placeAll(); panel(); };
      if (BP) progress();
    },
    place() {
      if (showFields) for (const f of BP.fields) if (f.page === page) put('ov field' + (isRemoved(f.name) ? ' removed' : '') + (picked === f.name ? ' picked' : ''), f.rect, f.name).dataset.field = f.name;
      if (showSug) for (const s of remaining()) if (s.page === page) put(`ov sug ${s.source}${s.copy ? ' copy' : ''}${s.sid === curSid ? ' cur' : ''}`, s.rect, s.what).dataset.sid = s.sid;
      added.forEach((a, i) => boxesOf(a).filter(b => b.page === page).forEach((b, k) => {
        const d = put('ov added', b.rect, a.name); d.dataset.added = i;
        if (k === 0) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = a.name; d.appendChild(t); }
      }));
      for (const p of props) for (const b of boxesOf(p)) if (b.page === page) put('ov prop', b.rect);
    },
    panel, progress,
    mousedown(e) { if (e.button !== 0) return; e.preventDefault(); drawStart = pt(e); drawTarget = e.target; },
    mousemove(e) {
      if (!drawStart) return; const p = pt(e);
      const r = [Math.min(drawStart[0], p[0]), Math.min(drawStart[1], p[1]), Math.max(drawStart[0], p[0]), Math.max(drawStart[1], p[1])];
      if (!drawBox && (r[2] - r[0]) * scale < 4 && (r[3] - r[1]) * scale < 4) return;
      if (!drawBox) drawBox = put('ov draw', r);
      else { drawBox.style.left = r[0] * scale + 'px'; drawBox.style.top = r[1] * scale + 'px'; drawBox.style.width = (r[2] - r[0]) * scale + 'px'; drawBox.style.height = (r[3] - r[1]) * scale + 'px'; }
      drawBox._r = r;
    },
    async mouseup() {
      if (!drawStart) return;
      const s = drawStart, b = drawBox, t = drawTarget; drawStart = null; drawBox = null; drawTarget = null;
      if (b) { b.remove(); curSid = null; picked = null; return propose({page, rect: b._r}); }
      if (t && t.dataset && t.dataset.sid) { const sg = BP.suggestions.find(x => x.sid === t.dataset.sid); if (sg) return proposeSid(sg); }
      if (t && t.dataset && t.dataset.field) { props = []; curSid = null; notes = []; picked = t.dataset.field; placeAll(); return panel(); }
      if (t && t.dataset && t.dataset.added !== undefined) { notes = [`${added[+t.dataset.added].name} is recorded to be added (remove it from the list below)`]; return panel(); }
      curSid = null; propose({page, rect: [s[0] - 1, s[1] - 1, s[0] + 1, s[1] + 1]});
    },
    key(e) {
      if (e.key === 'n') gotoSuggestion(1);
      else if (e.key === 'p') gotoSuggestion(-1);
      else if (e.key === 'Enter' && props.length) addProps(props.map((_, i) => i));
      else if (e.key === 'x' && curSid) notAField();
      else if (e.key === 'Escape') cancel();
      else if (e.key === 'd' && picked) toggleRemove();
      else if (e.key === 'f') { showFields = !showFields; $('#aFields').checked = showFields; placeAll(); }
      else if (e.key === 's') { showSug = !showSug; $('#aSug').checked = showSug; placeAll(); }
      else return false;
      return true;
    },
  };
})();

// ======================================================================= Audit: versions and run history (run_audit)
// Andrew, 2026-10-14: "build a 'run audit' into the review interface, so you can see the run history and all the data
// for each form". Read only. Numbers are per page as well: forms differ too much in size for per-form numbers.
MODE.audit = (() => {
  let A = null, B = null, view = store('br_audit_view') || 'form';
  const n = (x, d = 0) => x === null || x === undefined ? '' : (typeof x === 'number' ? x.toFixed(d) : esc(x));
  const pp = (x, pages) => x === null || x === undefined ? '' : `${x} <span class="help">(${(x / Math.max(1, pages)).toFixed(2)}/p)</span>`;
  const money = x => x === null || x === undefined ? '' : '$' + x.toFixed(x < 1 ? 3 : 2);
  function verRows(vs) {
    const row = (label, f) => `<tr><th>${label}</th>${vs.map(v => `<td>${f(v)}</td>`).join('')}</tr>`;
    const pc = v => v.page_check || {}, jv = v => v.jev || {}, rv = v => v.review || {};
    return `<table><tr><th></th>${vs.map(v => `<th>${esc(v.kind)}<br><code>${esc(v.id)}</code><br><button class="btn" data-open="${esc(v.id)}">open in Review</button></th>`).join('')}</tr>
      ${row('file', v => `<span class="help">${esc(v.path)}</span>`)}
      ${row('built', v => v.build ? `${esc(v.build.when || '')} <span class="help">${esc(v.build.classifier_model || v.build.basis || '')}</span>${v.stable === false ? ' <span class="warnc">not stable</span>' : ''}` : '<span class="help">no build stamp (petey-master)</span>')}
      ${row('pages with fields', v => n(v.pages))}
      ${row('fields', v => `${v.fields} <span class="help">(${(v.per_page || {}).fields ?? ''}/p)</span>`)}
      ${row('no text layer', v => v.no_text_pages && v.no_text_pages.length ? `<span class="bad">pages ${v.no_text_pages.join(', ')}</span>` : '<span class="help">none</span>')}
      ${row('page check: name flags', v => v.page_check ? pp(pc(v).name_flags, v.pages) : '<span class="help">not run</span>')}
      ${row('page check: all flags', v => v.page_check ? pp(pc(v).flags, v.pages) + ` <span class="help">${esc(Object.entries(pc(v).problems || {}).map(([k, c]) => k + ' ' + c).join(', '))}</span>` : '')}
      ${row('page check: run', v => v.page_check ? `<span class="help">${esc(pc(v).model || '')} · ${esc(pc(v).when || '')} · judged ${pc(v).judged}/${v.fields}</span>` : '')}
      ${row('Jev below 0.3', v => v.jev ? pp(jv(v).below_03, v.pages) : '<span class="help">not run</span>')}
      ${row('Jev below 0.5', v => v.jev ? pp(jv(v).below_05, v.pages) + ` <span class="help">${esc(jv(v).when)}</span>` : '')}
      ${row('name-check errors', v => v.name_errors !== undefined ? pp(v.name_errors, v.pages) + (v.name_errors_from ? ` <span class="help">as of ${esc(v.name_errors_from)}</span>` : '') : '')}
      ${row('boxes no field covers', v => v.unclaimed !== undefined ? n(v.unclaimed) : (v.unclaimed_error ? `<span class="help">${esc(v.unclaimed_error)}</span>` : '<span class="help">(open this version)</span>'))}
      ${row('mechanical pass', v => v.mechanical ? `<span class="help">${esc(v.mechanical.when)} · fixed ${esc(JSON.stringify(v.mechanical.fixed))}</span>` : '<span class="help">not run</span>')}
      ${row('hand review', v => `${rv(v).verdicts} verdicts, ${rv(v).looked_at} looked at, ${rv(v).flags} flagged${rv(v).checked && rv(v).checked.validated ? ' · <span class="good">VALIDATED</span>' : ''}`)}
      ${row('corrections on fields', v => esc(Object.entries(v.corrections || {}).map(([k, c]) => k + ' ' + c).join(', ')) || '<span class="help">none</span>')}
    </table>`;
  }
  function histRows(ev) {
    return `<table><tr><th>when</th><th>what</th><th></th><th class="n">cost</th><th class="n">per page</th><th class="n">min/page</th></tr>${ev.map(e => `<tr>
      <td><span class="help">${esc(e.when)}</span></td><td><span class="kind">${esc(e.kind)}</span></td>
      <td><details><summary>${esc(e.title)}</summary><pre>${esc(JSON.stringify(e.detail || {}, null, 1))}</pre></details></td>
      <td class="n">${money(e.cost)}</td><td class="n">${money(e.cost_per_page)}</td><td class="n">${n(e.minutes_per_page, 1)}</td></tr>`).join('')}</table>`;
  }
  function formHtml() {
    if (!A) return '<p class="help">Pick a form.</p>';
    return `<h3>${esc(A.form)}</h3><div class="help">${A.versions.length} version${A.versions.length === 1 ? '' : 's'}; the one picked is checked in full (name checks, uncovered boxes)</div>
      <h4>Versions</h4>${verRows(A.versions)}<h4>History (${A.history.length})</h4>${histRows(A.history)}`;
  }
  function batchHtml() {
    if (!B) return '<p class="help">loading the batch…</p>';
    const rows = B.rows, tot = {};
    for (const r of rows) {
      const t = tot[r.kind] = tot[r.kind] || {pages: 0, fields: 0, nf: 0, af: 0, j3: 0, ne: 0, pcp: 0, jp: 0, nep: 0};
      t.pages += r.pages || 0; t.fields += r.fields || 0;
      if (r.page_check) { t.nf += r.page_check.name_flags; t.af += r.page_check.flags; t.pcp += r.pages; }
      if (r.jev) { t.j3 += r.jev.below_03; t.jp += r.pages; }
      if (r.name_errors !== undefined) { t.ne += r.name_errors; t.nep += r.pages; }
    }
    const per = (x, p) => p ? (x / p).toFixed(2) : '';
    return `<h3>Batch: the forms at the top of the menu</h3><div class="help">${esc(B.why || '')}</div>
      <h4>Totals, per page (pooled over pages)</h4><table><tr><th>version</th><th class="n">pages</th><th class="n">fields/p</th><th class="n">page-check name flags/p</th><th class="n">all flags/p</th><th class="n">Jev &lt;0.3/p</th><th class="n">name-check errors/p</th></tr>
      ${Object.entries(tot).map(([k, t]) => `<tr><td>${esc(k)}</td><td class="n">${t.pages}</td><td class="n">${per(t.fields, t.pages)}</td><td class="n">${per(t.nf, t.pcp)}</td><td class="n">${per(t.af, t.pcp)}</td><td class="n">${per(t.j3, t.jp)}</td><td class="n">${per(t.ne, t.nep)}</td></tr>`).join('')}</table>
      <h4>Every version (click a row for its audit)</h4><table><tr><th>form</th><th>version</th><th class="n">pages</th><th class="n">fields</th><th class="n">page-check name flags</th><th class="n">all flags</th><th class="n">Jev &lt;0.3</th><th class="n">name-check errors</th><th>text layer</th><th>review</th></tr>
      ${rows.map(r => r.error ? `<tr><td>${esc(r.form)}</td><td><code>${esc(r.id)}</code></td><td colspan="8" class="bad">${esc(r.error)}</td></tr>` : `<tr class="click ${r.id === bid ? 'cur' : ''}" data-aud="${esc(r.id)}">
        <td>${esc(r.form)}</td><td><span class="kind">${esc(r.kind)}</span></td><td class="n">${r.pages}</td><td class="n">${r.fields}</td>
        <td class="n">${r.page_check ? pp(r.page_check.name_flags, r.pages) : '<span class="help">not run</span>'}</td>
        <td class="n">${r.page_check ? pp(r.page_check.flags, r.pages) : ''}</td>
        <td class="n">${r.jev ? pp(r.jev.below_03, r.pages) : '<span class="help">not run</span>'}</td>
        <td class="n">${r.name_errors !== undefined ? pp(r.name_errors, r.pages) : ''}</td>
        <td>${r.no_text_pages && r.no_text_pages.length ? '<span class="bad">none on p' + r.no_text_pages.join(', ') + '</span>' : 'yes'}</td>
        <td>${(r.review || {}).checked && r.review.checked.validated ? '<span class="good">VALIDATED</span>' : `${(r.review || {}).verdicts || 0} verdicts`}</td></tr>`).join('')}</table>`;
  }
  function panel() {
    const a = $('#panel');
    a.innerHTML = `<div class="aud">${view === 'batch' ? batchHtml() : formHtml()}</div>`;
    a.querySelectorAll('[data-open]').forEach(b => b.onclick = async () => { $('#pick').value = b.dataset.open; await openBlueprint(b.dataset.open); await setMode('review'); });
    a.querySelectorAll('[data-aud]').forEach(r => r.onclick = async () => { view = 'form'; store('br_audit_view', view); renderModebar(); $('#pick').value = r.dataset.aud; await openBlueprint(r.dataset.aud); });
  }
  async function loadBatch() { B = null; panel(); try { B = await j('/api/audit-batch'); } catch (e) { B = {rows: [], why: 'could not load: ' + e.message}; } if (view === 'batch') panel(); }
  return {
    async load() { A = await j(mapi('audit')); },
    pages: () => [], startPage: () => 1, pageLabel: () => '',
    bar: () => `<span class="progress" id="progress"></span>
      <label class="help"><input type="radio" name="audv" value="form" ${view === 'form' ? 'checked' : ''}> this form</label>
      <label class="help"><input type="radio" name="audv" value="batch" ${view === 'batch' ? 'checked' : ''}> batch (the forms at the top)</label>`,
    bindBar() {
      document.querySelectorAll('input[name=audv]').forEach(r => r.onchange = async e => {
        view = e.target.value; store('br_audit_view', view);
        if (view === 'batch' && !B) await loadBatch(); else panel();
      });
      if (view === 'batch' && !B) loadBatch(); else if (A || view === 'batch') panel();
    },
    help: {keys: [['b', 'batch table / this form']],
           tips: ['Read only. Each version of the form: the library copy and any fresh run of the current pipeline, with page-check flags, Jev, name checks and review, per page.',
                  'History: generation (petey-master or a fresh run, with cost and minutes per page), validate runs, page checks, Jev, the mechanical pass, hand review, Claude, library commits. Click a line for its details.']},
    place() {}, panel,
    progress() { const el = $('#progress'); if (el) el.innerHTML = A && view === 'form' ? `<b>${esc(A.form)}</b> · ${A.versions.length} versions · ${A.history.length} events` : ''; },
    key(e) {
      if (e.key === 'b') { view = view === 'batch' ? 'form' : 'batch'; store('br_audit_view', view); renderModebar(); if (view === 'batch' && !B) loadBatch(); else panel(); return true; }
      return false;
    },
  };
})();

init();
</script>
</body>
</html>
