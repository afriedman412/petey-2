<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blueprint review</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --line:#ddd; --panel:#fafafa; --card:#fff; --sel:#1a73e8; --ok:#1e8e3e; --bad:#c5221f;
          --accept:#1e8e3e; --flag:#c5221f; --none:#8a8a8a; --orphan:#7a7a7a; --over:rgba(26,115,232,.18);
          --field:#8e24aa; --sug:#e37400; --added:#188038; --txt:#00838f; --tabon:#e8f0fe; }
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.4 -apple-system, Helvetica, Arial, sans-serif; color:var(--fg); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header, #modebar { display:flex; gap:12px; align-items:center; padding:6px 12px; flex-wrap:wrap; }
  header { border-bottom:1px solid var(--line); }
  #modebar { border-bottom:1px solid var(--line); background:var(--panel); min-height:36px; }
  header select { font:inherit; max-width:520px; }
  .tabs { display:flex; gap:0; }
  .tabs button { font:inherit; padding:4px 12px; border:1px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer; margin-left:-1px; }
  .tabs button:first-child { border-radius:4px 0 0 4px; } .tabs button:last-child { border-radius:0 4px 4px 0; }
  .tabs button.on { background:var(--tabon); border-color:var(--sel); font-weight:600; position:relative; }
  .pages button, .btn { font:inherit; padding:3px 9px; border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:4px; cursor:pointer; }
  #modebar .btn { background:var(--bg); }
  .pages button.on { background:var(--tabon); border-color:var(--sel); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.primary { border-color:var(--ok); color:var(--ok); }
  .btn.warn { border-color:var(--bad); color:var(--bad); }
  .help { color:var(--muted); font-size:12px; }
  .stale, .err { color:var(--bad); }
  .progress { color:var(--muted); } .progress b { color:var(--fg); }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; overflow:auto; background:#efefef; }
  #canvas { position:relative; margin:12px; display:inline-block; box-shadow:0 1px 4px rgba(0,0,0,.25); user-select:none; }
  #canvas.drawable { cursor:crosshair; }
  #canvas img { display:block; -webkit-user-drag:none; pointer-events:none; }
  aside { width:440px; border-left:1px solid var(--line); overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  aside > * { flex-shrink:0; }
  #toast { position:fixed; left:16px; bottom:16px; background:var(--fg); color:var(--bg); padding:6px 12px; border-radius:4px; font-size:12px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:10; }
  #toast.on { opacity:.92; }
  h4 { margin:0 0 4px; font-size:12px; color:var(--muted); font-weight:600; }
  .badge { font-size:11px; font-weight:600; border-radius:3px; padding:0 5px; }

  /* review */
  .rv { position:absolute; border:1.5px solid var(--none); cursor:pointer; }
  .rv.accept { border-color:var(--accept); }
  .rv.flag { border-color:var(--flag); background:rgba(197,34,31,.06); }
  .rv.contested:not(.accept):not(.flag) { border-style:dashed; border-color:#c5221f; }
  .rv.removed { border:2px dashed var(--bad); background:rgba(197,34,31,.18); }
  .rlist div.removed { text-decoration:line-through; color:var(--muted); }
  .rbanner { background:#fce8e6; border:1px solid #f4c7c3; color:#a50e0e; padding:6px 8px; border-radius:4px; margin:8px 0; }
  .rv.sel { border-width:2.5px; border-color:var(--sel); box-shadow:0 0 0 2px rgba(26,115,232,.35); z-index:2; }
  dl { display:grid; grid-template-columns:96px 1fr; gap:3px 8px; margin:8px 0; } dt { color:var(--muted); } dd { margin:0; word-break:break-word; }
  .rpanel h2 { font-size:15px; margin:0 0 6px; word-break:break-all; }
  .verdict { display:flex; gap:8px; margin:12px 0 6px; }
  .verdict .btn.accept { border-color:var(--accept); color:var(--accept); } .verdict .btn.flag { border-color:var(--flag); color:var(--flag); }
  .verdict .btn.on.accept { background:var(--accept); color:#fff; } .verdict .btn.on.flag { background:var(--flag); color:#fff; }
  textarea { width:100%; font:inherit; min-height:54px; }
  .loop { background:#fff8e1; border:1px solid #f1e2a8; padding:6px 8px; border-radius:4px; margin:8px 0; }
  .adj { background:#e8f0fe; border:1px solid #c6d8f7; padding:6px 8px; border-radius:4px; margin:8px 0; }
  .rlist { margin-top:4px; border-top:1px solid var(--line); padding-top:8px; max-height:38vh; overflow:auto; }
  .rlist div { padding:2px 4px; cursor:pointer; border-left:3px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rlist div.accept { border-left-color:var(--accept); } .rlist div.flag { border-left-color:var(--flag); } .rlist div.sel { background:var(--tabon); }
  .badge.checked { background:#e6f4ea; color:#137333; border:1px solid #a8dab5; }
  .badge.stalecheck { background:#fef7e0; color:#7a5b00; border:1px solid #f1e2a8; }
  .tier { display:inline-block; min-width:1.1em; text-align:center; font-size:11px; font-weight:600; border-radius:3px; padding:0 3px; margin-right:4px; }
  .tier.contested { background:#fce8e6; color:#a50e0e; } .tier.unknown { background:#eee; color:#555; }
  .tier.single { background:#fef7e0; color:#7a5b00; } .tier.settled { background:#e6f4ea; color:#137333; }
  .fix { margin:8px 0; font-size:12px; } .fix label { margin-right:8px; } .fix input, .fix select { font:inherit; }
  .why { margin:8px 0; font-size:13px; } .why div { padding:2px 0 2px 8px; border-left:3px solid; margin:2px 0; }
  .why .usefix { padding:0 6px; font-size:11px; margin-left:4px; }
  .why .error { border-color:#a50e0e; } .why .suggestion { border-color:#b06000; color:var(--muted); }
  details.raw { font-size:12px; } details.raw summary { cursor:pointer; color:var(--muted); }
  .wit { margin:8px 0; font-size:12px; } .wit div { padding:1px 0; } .wit .no { color:#a50e0e; } .wit .yes { color:#137333; } .wit .mute { color:var(--muted); }

  /* groups */
  .gh { position:absolute; border:1.5px dashed var(--c); background:color-mix(in srgb, var(--c) 7%, transparent); border-radius:3px; z-index:1; cursor:pointer; }
  .gh.sel { border-style:solid; border-width:2px; background:color-mix(in srgb, var(--c) 14%, transparent); z-index:2; }
  .gh.ok { border-style:solid; }
  .gi { position:absolute; border:2px solid var(--c); background:color-mix(in srgb, var(--c) 18%, transparent); z-index:3; cursor:grab; }
  .gi::after { content:''; position:absolute; inset:-3px; }
  .gi.orphan { border-style:dashed; background:transparent; }
  .gi.sel { box-shadow:0 0 0 2px var(--sel); z-index:4; }
  .gi.locked { cursor:not-allowed; } .gi.dragging { opacity:.35; }
  .over { outline:3px solid var(--sel) !important; background:var(--over) !important; }
  .gcard { border:1px solid var(--line); border-left:4px solid var(--c, var(--orphan)); border-radius:4px; padding:6px 8px; background:var(--card); }
  .gcard.sel { box-shadow:0 0 0 2px var(--sel); } .gcard.ok { border-left-color:var(--ok); }
  .gcard h3 { margin:0; font-size:13px; display:flex; gap:6px; align-items:center; cursor:pointer; word-break:break-all; }
  .gcard h3 .grip { cursor:grab; color:var(--muted); }
  .gchips { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .gchip { border:1px solid var(--line); border-radius:10px; padding:1px 8px; background:var(--panel); cursor:grab; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  .gchip.orphan { border-style:dashed; } .gchip.sel { border-color:var(--sel); } .gchip .x { margin-left:5px; color:var(--muted); cursor:pointer; }
  .tray { border:1.5px dashed var(--orphan); border-radius:4px; padding:6px 8px; min-height:44px; }
  .gcur { border:1px solid var(--sel); border-radius:4px; padding:8px 10px; }
  .gcur h2 { margin:0 0 6px; font-size:14px; } .gcur input[type=text] { font:inherit; width:100%; padding:3px 5px; }
  .gcur .row { display:flex; gap:8px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  .gcur ol { margin:6px 0; padding-left:20px; }
  .btn.ok { border-color:var(--ok); color:var(--ok); } .btn.ok.on { background:var(--ok); color:#fff; }
  .badge.edit { background:#fef7e0; color:#7a5b00; } .badge.new { background:#e8f0fe; color:#1a4fa0; } .badge.ok { background:#e6f4ea; color:#137333; }
  .warn { color:var(--bad); font-size:12px; }
  .changes { font-size:12px; } .changes li { margin:1px 0; } .changes .err { color:var(--bad); }

  /* add fields */
  .ov { position:absolute; }
  .ov.field { border:1.5px solid var(--field); background:color-mix(in srgb, var(--field) 10%, transparent); }
  .ov.field.removed { border:2px dashed var(--bad); background:rgba(197,34,31,.18); }
  .ov.field.picked { box-shadow:0 0 0 2px var(--sel); }
  .ov.field:hover { background:color-mix(in srgb, var(--field) 25%, transparent); }
  .ov.sug { border:2px solid var(--sug); background:color-mix(in srgb, var(--sug) 10%, transparent); cursor:pointer; }
  .ov.sug.finder { border-style:dashed; } .ov.sug.copy { opacity:.35; } .ov.sug.cur { box-shadow:0 0 0 2px var(--sel); }
  .ov.added { border:2px solid var(--added); background:color-mix(in srgb, var(--added) 12%, transparent); cursor:pointer; }
  .ov.added .tag { position:absolute; left:0; top:-14px; font-size:10px; line-height:12px; background:var(--card); color:var(--added); padding:0 3px; white-space:nowrap; pointer-events:none; }
  .ov.prop { border:2px solid var(--sel); background:color-mix(in srgb, var(--sel) 12%, transparent); pointer-events:none; }
  .ov.draw { border:1.5px dashed var(--sel); background:color-mix(in srgb, var(--sel) 8%, transparent); pointer-events:none; }
  .acard { border:1px solid var(--sel); border-radius:4px; padding:8px 10px; background:var(--card); }
  .acard h3 { margin:0 0 6px; font-size:13px; }
  .acard input[type=text], .acard textarea, .acard select { font:inherit; width:100%; padding:3px 5px; }
  .acard textarea { min-height:40px; }
  .grid { display:grid; grid-template-columns:84px 1fr; gap:4px 8px; align-items:center; margin:6px 0; } .grid label { color:var(--muted); }
  .achips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .achip { border:1px solid var(--line); border-radius:10px; padding:1px 8px; background:var(--panel); cursor:pointer; font-size:12px; }
  .achip.on { border-color:var(--sel); background:var(--tabon); } .achip .src { color:var(--muted); margin-left:4px; }
  .ev { font-size:12px; color:var(--muted); margin:6px 0 0; padding-left:16px; }
  .opts td { padding:1px 3px; } .opts input { font:inherit; width:100%; }
  .arow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .notes { font-size:12px; color:var(--muted); }
  .alist div { padding:2px 4px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .alist div:hover { background:var(--panel); } .alist .x { color:var(--muted); }

  .gi.text { border-width:1.5px; background:color-mix(in srgb, var(--c) 8%, transparent); }
  .gi.text.loose { opacity:.85; }
  .gh.text { border-style:solid; border-width:2px; }

  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1e1e; --fg:#eee; --muted:#aaa; --line:#444; --panel:#2c2c2c; --card:#242424; --orphan:#9a9a9a; --field:#ce93d8; --txt:#4dd0e1; --tabon:#1f2d44; }
    #stage { background:#2a2a2a; }
    .loop { background:#3a3420; border-color:#6a5d2a; } .adj { background:#1f2d44; border-color:#2f4d7a; }
    .badge.edit { background:#3a3420; color:#f1d77a; } .badge.new { background:#1f2d44; color:#9cc0ff; } .badge.ok { background:#1e3a26; color:#8fd4a0; }
  }
</style>
</head>
<body>
<header>
  <select id="pick"></select>
  <label class="help">list <select id="listorder"><option value="name">by name</option><option value="oldest">oldest first</option></select></label>
  <span class="tabs" id="tabs">
    <button data-mode="review" title="Shift+1">Review</button><button data-mode="groups" title="Shift+2">Groups</button><button data-mode="add" title="Shift+3">Add / remove</button>
  </span>
  <span class="pages" id="pages"></span>
  <span class="help">zoom <button class="btn" id="zout">-</button> <button class="btn" id="zin">+</button></span>
  <button class="btn" id="reboot" title="restart the server so edited code loads, then reload this page">reboot</button>
</header>
<div id="modebar"></div>
<main>
  <div id="stage"><div id="canvas"><img id="img" alt=""></div></div>
  <aside id="panel"><p class="help">Pick a blueprint.</p></aside>
</main>
<div id="toast"></div>
<script>
// ======================================================================= shared: picker, modes, page, zoom, keys
let LIST = [], bid = null, page = 1, zoom = 1.6, scale = 1, mode = 'review', shaSeen = null;
const MODE = {};
const M = () => MODE[mode];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function j(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); }
const send = (method, url, body) => j(url, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
const mapi = (m, p = '') => `/api/${m}/${encodeURIComponent(bid)}${p}`;
function localNow() { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; }
function overlap(a, b) {
  const ix = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])), iy = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  const i = ix * iy; if (i <= 0) return 0;
  return i / Math.min(Math.max((a[2] - a[0]) * (a[3] - a[1]), 1e-6), Math.max((b[2] - b[0]) * (b[3] - b[1]), 1e-6));
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

async function init() {
  $('#pick').innerHTML = '<option>loading blueprints…</option>';
  try { LIST = await j('/api/blueprints'); }
  catch (e) { $('#pick').innerHTML = ''; $('#panel').innerHTML = `<p class="err">Could not load the blueprint list: ${esc(e.message)}</p>`; return; }
  zoom = parseFloat(store('br_zoom')) || zoom;
  $('#listorder').value = store('br_listorder') || 'name';
  const [hm, hb] = decodeURIComponent(location.hash.slice(1)).split('/');
  mode = MODE[hm] ? hm : (store('br_mode') || 'review');
  renderTabs(); renderPicker(); renderModebar();
  $('#pick').addEventListener('change', () => openBlueprint($('#pick').value));
  $('#listorder').addEventListener('change', e => { store('br_listorder', e.target.value); renderPicker(); });
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $('#zin').onclick = () => setZoom(zoom * 1.25); $('#zout').onclick = () => setZoom(zoom / 1.25);
  $('#reboot').onclick = reboot;
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', () => bid && placeAll());
  window.addEventListener('focus', checkFresh);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkFresh(); });
  setInterval(() => { if (!document.hidden) checkFresh(); }, 20000);
  bindCanvas();
  const first = hb && LIST.some(b => b.id === hb) ? hb : null;
  if (first) { $('#pick').value = first; openBlueprint(first); }
}

// the reboot button: the server re-execs itself on the same port (edited Python loads); wait for it to answer
// again, re-indexing takes a while, then reload the page so edited HTML loads too
async function reboot() {
  const b = $('#reboot'); b.disabled = true; b.textContent = 'rebooting…';
  try { await send('POST', '/api/restart'); }
  catch (e) { b.disabled = false; b.textContent = 'reboot'; alert('Reboot failed: ' + e.message); return; }
  await new Promise(r => setTimeout(r, 1000));
  for (let i = 0; i < 300; i++) {
    try { const r = await fetch('/api/blueprints', {cache: 'no-store'}); if (r.ok) { location.reload(); return; } } catch (e) {}
    await new Promise(r => setTimeout(r, 1000));
  }
  b.disabled = false; b.textContent = 'reboot';
  alert('The server did not come back within 5 minutes; check the terminal it was started from.');
}
function setHash() { history.replaceState(null, '', '#' + encodeURIComponent(mode) + (bid ? '/' + encodeURIComponent(bid) : '')); }
function renderTabs() { document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode)); $('#canvas').classList.toggle('drawable', mode === 'add'); }

function ageText(a) {
  if (!a) return '';
  const v = a.validated ? `validated ${a.validated} on ${a.finder || '?'}${a.finder_current === false ? ' (old finder)' : ''}` : 'no build stamp';
  return `${a.by} ${a.when || '?'} · ${v}`;
}
function pickerText(b) {
  const bits = [`${b.fields} fields`];
  const done = b.accepted + b.flagged;
  if (b.checked) bits.push(b.checked.stale ? 'checked, file changed since' : `checked${b.checked.flagged ? `, ${b.checked.flagged} flagged` : ''}`);
  else if (done) bits.push(`${done} reviewed`);
  if (b.stale) bits.push('verdicts stale');
  if (b.groups && b.groups.units) bits.push(b.groups.confirmed === b.groups.units ? 'groups confirmed' : `groups ${b.groups.confirmed}/${b.groups.units}`);
  if (b.groups && b.groups.combos) bits.push(`${b.groups.combos} text combined`);
  if (b.add && b.add.added) bits.push(`${b.add.added} to add`);
  if (b.add && b.add.removed) bits.push(`${b.add.removed} to remove`);
  if (b.rerun || b.launch) {
    if (b.check_errors != null) bits.push(`${b.check_errors} errors, ${b.check_suggestions} suggestions`);
    else if (b.page_check_flags != null) bits.push(`${b.page_check_flags} page-check flags`);
    if (b.run) bits.push(b.run.stable ? 'stable' : `NOT stable: ${b.run.stop}`);
  }
  return `${b.form}  (${bits.join(', ')})  ·  ${ageText(b.age)}`;
}
function renderPicker() {
  const pick = $('#pick'), keep = pick.value || bid;
  pick.innerHTML = '<option value="">pick a blueprint…</option>';
  const groups = {t1: 'launch T1', t2: 'launch T2', t3: 'launch T3', t4: 'launch T4',
                  rerun: 'fresh runs of library forms (new code)', lib: 'library', je: 'judge-eval side copies',
                  rl: 'relabels', fl: 'flat forms'};
  const oldest = $('#listorder').value === 'oldest';
  const groupOf = x => x.launch ? 't' + x.launch : x.rerun ? 'rerun' : x.source;
  for (const src of Object.keys(groups)) {
    const items = LIST.filter(x => groupOf(x) === src); if (!items.length) continue;
    items.sort(oldest ? (a, b) => ((a.age || {}).when || '').localeCompare((b.age || {}).when || '') || a.form.localeCompare(b.form)
                      : (a, b) => a.form.localeCompare(b.form));
    const og = document.createElement('optgroup'); og.label = groups[src];
    for (const b of items) { const o = document.createElement('option'); o.value = b.id; o.textContent = pickerText(b); og.appendChild(o); }
    pick.appendChild(og);
  }
  if (keep && LIST.some(b => b.id === keep)) pick.value = keep;
}
function updateEntry(e) { if (!e) return; const i = LIST.findIndex(b => b.id === e.id); if (i >= 0) LIST[i] = e; renderPicker(); }

async function openBlueprint(id) {
  if (!id) return;
  bid = id; setHash();
  $('#panel').innerHTML = '<p class="help">loading…</p>';
  await loadMode();
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 4000); }
// the blueprint file can change under the page (an --apply, a loop run): reload the mode in place when it does
let checking = false;
async function checkFresh() {
  if (!bid || checking) return; checking = true;
  try {
    const {sha} = await j(`/api/blueprints/${encodeURIComponent(bid)}/sha`);
    if (shaSeen && sha !== shaSeen) {
      LIST = await j('/api/blueprints'); renderPicker();
      await loadMode();
      toast('The blueprint changed on disk; reloaded.');
    }
  } catch (e) {} finally { checking = false; }
}
async function loadMode() {
  try { await M().load(); }
  catch (e) { $('#panel').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  try { shaSeen = (await j(`/api/blueprints/${encodeURIComponent(bid)}/sha`)).sha; } catch (e) {}
  const pages = M().pages();
  if (!pages.some(p => p.page === page) || !M().pageLabel(page)) page = M().startPage() || (pages[0] || {}).page || 1;
  renderModebar(); renderPages(); await showPage(); M().panel(); M().progress();
}
async function setMode(m) {
  if (!MODE[m] || m === mode) return;
  mode = m; store('br_mode', m); renderTabs(); setHash();
  document.querySelectorAll('#canvas > div').forEach(e => e.remove());
  if (bid) await loadMode(); else renderModebar();
}
function renderModebar() { $('#modebar').innerHTML = M().bar(); M().bindBar(); }

function renderPages() {
  const el = $('#pages'); el.innerHTML = '';
  for (const p of M().pages()) {
    const label = M().pageLabel(p.page); if (!label) continue;
    const b = document.createElement('button'); b.textContent = label;
    b.className = p.page === page ? 'on' : ''; b.onclick = () => gotoPage(p.page);
    el.appendChild(b);
  }
}
async function gotoPage(p) { page = p; renderPages(); await showPage(); if (M().onPage) M().onPage(); M().panel(); }
function setZoom(z) { zoom = Math.min(6, Math.max(0.6, z)); store('br_zoom', zoom); if (bid) { sizeImage(); placeAll(); } }
function sizeImage() { const p = M().pages().find(x => x.page === page); if (p) $('#img').style.width = (p.w_pt * zoom) + 'px'; }
async function showPage() {
  const img = $('#img'), url = `/api/blueprints/${encodeURIComponent(bid)}/png/${page}`;
  sizeImage();
  if (!(img.complete && img.getAttribute('src') === url)) await new Promise(res => { img.onload = res; img.onerror = res; img.src = url; });
  placeAll();
}
function placeAll() {
  const canvas = $('#canvas'); canvas.querySelectorAll(':scope > div').forEach(e => e.remove());
  const p = M().pages().find(x => x.page === page); if (!p) return;
  scale = $('#img').clientWidth / p.w_pt;
  M().place();
}
function put(cls, r, title) {
  const d = document.createElement('div'); d.className = cls;
  d.style.left = (r[0] * scale) + 'px'; d.style.top = (r[1] * scale) + 'px';
  d.style.width = Math.max(5, (r[2] - r[0]) * scale) + 'px'; d.style.height = Math.max(5, (r[3] - r[1]) * scale) + 'px';
  if (title) d.title = title;
  $('#canvas').appendChild(d); return d;
}
function bindCanvas() {
  $('#canvas').addEventListener('mousedown', e => { if (bid && M().mousedown) M().mousedown(e); });
  window.addEventListener('mousemove', e => { if (bid && M().mousemove) M().mousemove(e); });
  window.addEventListener('mouseup', e => { if (bid && M().mouseup) M().mouseup(e); });
}

function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && ['TEXTAREA', 'INPUT', 'SELECT'].includes(t.tagName) && t.type !== 'checkbox' && t.type !== 'radio') return;
  if (e.shiftKey && /^Digit[123]$/.test(e.code)) { setMode(['review', 'groups', 'add'][+e.code.slice(5) - 1]); e.preventDefault(); return; }
  if (!bid) return;
  if (e.key === '+' || e.key === '=') setZoom(zoom * 1.25);
  else if (e.key === '-') setZoom(zoom / 1.25);
  else if (/^[1-9]$/.test(e.key)) { const p = +e.key; if (M().pages().some(x => x.page === p) && M().pageLabel(p)) gotoPage(p); }
  else if (!M().key(e)) return;
  e.preventDefault();
}

// ======================================================================= Review: accept / flag / note per field
MODE.review = (() => {
  let BP = null, selected = null, unrevOnly = false, order = store('hr_order') || 'risk', removed = [];
  const TIER_RANK = {contested: 0, unknown: 1, single: 2, settled: 3};
  const TIER_LETTER = {contested: '!', unknown: '?', single: '1', settled: '2+'};
  const verdictOf = n => { const v = BP.verdicts[n]; return v ? v.verdict : ''; };
  const isRemoved = n => removed.some(r => r.name === n);
  // removing a field is recorded with the field-add record (Add / remove mode; field_add --apply drops it); a field
  // removed here also gets a flag with the note "removed" when it has no verdict, so the review stays complete
  async function putRemovals() {
    const out = await send('PUT', mapi('review', '/removals'), {removed});
    updateEntry(out.entry);
  }
  async function removeField() {
    const f = BP.fields.find(x => x.name === selected); if (!f || isRemoved(f.name)) return;
    removed.push({name: f.name, page: f.page, rect: f.rects[0].rect, when: localNow(), from: 'review'});
    await putRemovals();
    if (!verdictOf(f.name)) await putV({[f.name]: {verdict: 'flag', note: 'removed'}});
    next();
  }
  async function keepField() {
    const f = BP.fields.find(x => x.name === selected); if (!f) return;
    removed = removed.filter(r => r.name !== f.name);
    await putRemovals();
    const v = BP.verdicts[f.name];
    if (v && v.verdict === 'flag' && v.note === 'removed') await putV({[f.name]: null});
    placeAll(); panel();
  }
  function ordered() {
    const list = BP.fields.filter(f => !unrevOnly || !verdictOf(f.name));
    if (order === 'risk') list.sort((a, b) => ((TIER_RANK[a.tier] ?? 1) - (TIER_RANK[b.tier] ?? 1)) || (a.idx - b.idx));
    return list;
  }
  function select(name, scroll = true) {
    selected = name;
    const f = BP.fields.find(x => x.name === name);
    if (f && f.page !== page) { page = f.page; renderPages(); showPage().then(() => { panel(); if (scroll) scrollSel(); }); return; }
    placeAll(); panel(); if (scroll) scrollSel();
  }
  function scrollSel() { const el = document.querySelector('.rv.sel'); if (el) el.scrollIntoView({block: 'center', inline: 'center', behavior: 'smooth'}); }
  function next(step = 1) {
    const list = ordered(); if (!list.length) return;
    let i = list.findIndex(f => f.name === selected);
    if (i < 0) { const all = BP.fields; const j0 = all.findIndex(f => f.name === selected); i = list.findIndex(f => all.indexOf(f) > j0) - 1; }
    i = (i + step + list.length) % list.length;
    select(list[i].name);
  }
  async function putV(verdicts) {
    const out = await send('PUT', mapi('review', '/verdicts'), {verdicts});
    BP.verdicts = out.verdicts; BP.stale = false;
    const was = !!BP.checked; BP.checked = out.entry ? out.entry.checked : null;
    updateEntry(out.entry); progress();
    if (!was && BP.checked) { const el = $('#progress'); el.classList.add('justchecked'); setTimeout(() => el.classList.remove('justchecked'), 2500); }
  }
  async function setVerdict(verdict) {
    if (!selected) return;
    const note = $('#note') ? $('#note').value : (BP.verdicts[selected] || {}).note || '';
    const edit = verdict === 'flag' ? (BP.verdicts[selected] || {}).edit : undefined;   // flag keeps a correction
    await putV({[selected]: verdict ? {verdict, note, edit} : null});
    if (verdict) next(); else { placeAll(); panel(); }
  }
  async function saveNote() {
    if (!selected || !$('#note')) return;
    const v = BP.verdicts[selected]; const note = $('#note').value;
    if (v && v.note !== note) await putV({[selected]: {verdict: v.verdict, note, edit: v.edit}});
  }
  async function applyCorrections() {
    const pending = Object.entries(BP.verdicts).filter(([, v]) => v.edit && !v.applied);
    const lines = pending.map(([n, v]) => `${n}${v.edit.name ? ' → ' + v.edit.name : ''}${v.edit.type ? ' : ' + v.edit.type : ''}`);
    if (!confirm(`Write ${pending.length} correction(s) into ${BP.path}?\n\n${lines.join('\n')}`)) return;
    let out;
    try { out = await send('POST', mapi('review', '/apply')); }
    catch (e) { alert('Apply failed: ' + e.message); return; }
    LIST = await j('/api/blueprints'); renderPicker();
    await loadMode();
    toast(`Applied ${pending.length} correction(s) to the blueprint.`);
  }
  // a correction (2026-10-07): the field name and type set directly; saved as a flag with a structured edit, written
  // into the blueprint by the apply button (or `hand_review --apply <id>`)
  async function saveFix() {
    if (!selected || !$('#eName')) return;
    const f = BP.fields.find(x => x.name === selected);
    const edit = {name: $('#eName').value.trim(), type: $('#eType').value};

    const note = $('#note') ? $('#note').value : '';

  }
  async function bulkAccept() {
    const todo = BP.fields.filter(f => f.tier === 'settled' && !verdictOf(f.name));

    if (!confirm(`Accept ${todo.length} settled field(s) without looking at them? Each is saved with the note "bulk: settled".`)) return;
    await putV(Object.fromEntries(todo.map(f => [f.name, {verdict: 'accept', note: 'bulk: settled'}])));

  function madeHtml(m) {
    if (!m) return '';
    const e = esc, rows = [];
    if (m.labeler) rows.push(`labeled by ${e(m.labeler.method || '?')}${m.labeler.model ? ' / ' + e(m.labeler.model) : ''}${m.labeler.when ? ' on ' + e(m.labeler.when) : ' (date not recorded)'}`);

    if (m.origin) rows.push(`made in ${e(m.origin.repo)}: first commit ${e(m.origin.first.when)} by ${e(m.origin.first.who)}, last ${e(m.origin.last.when)} by ${e(m.origin.last.who)}`);
    if (m.git_first) rows.push(`in git since ${e(m.git_first.when)} by ${e(m.git_first.who)} (${e(m.git_first.commit)}: ${e(m.git_first.subject.slice(0, 60))})`);
    if (m.git_last && m.git_commits > 1) rows.push(`last commit ${e(m.git_last.when)} by ${e(m.git_last.who)} (${e(m.git_last.commit)}: ${e(m.git_last.subject.slice(0, 60))}); ${m.git_commits} commits`);

    if (m.validated) rows.push(`last validated ${e(m.validated.when || '?')}${m.validated.run ? ' (' + e(m.validated.run) + ')' : ''}`);
    return `<div class="help">${rows.join('<br>')}</div>`;
  }
  const tierChip = f => f.tier ? `<span class="tier ${f.tier}" title="${f.tier}">${TIER_LETTER[f.tier]}</span>` : '';
  function whyHtml(f) {
    // one plain sentence per reason (witness.explain): errors first, then suggestions (2026-10-07)
    if (!f.why || !f.why.length) return '';
    return `<div class="why">${f.why.map((w, i) => `<div class="${w.kind}">${w.kind === 'suggestion' ? 'Suggestion: ' : ''}${esc(w.text)}${w.fix ? ` <button class="btn usefix" data-i="${i}" title="put this into the correction boxes below">use</button>` : ''}</div>`).join('')}</div>`;
  }
  // "use" on a reason with a suggested fix fills the correction boxes; the person still saves (2026-10-07)
  function bindFixes(f) {

      const fix = (f.why[+b.dataset.i] || {}).fix || {};

      ($('#eName') || {}).focus && $('#eName').focus();
    });
  }
  function witnessHtml(f) {
    if (!f.witnesses || !Object.keys(f.witnesses).length) return '';
    const rows = Object.entries(f.witnesses).map(([k, [v, d]]) => {
      const cls = v === true ? 'yes' : (v === false ? 'no' : 'mute'), mark = v === true ? 'for' : (v === false ? 'against' : 'silent');
      return `<div class="${cls}"><b>${esc(k)}</b> ${mark}${d ? ': ' + esc(d) : ''}</div>`;
    }).join('');
    return `<details class="raw"><summary>${tierChip(f)}<b>${f.tier}</b> · check details</summary><div class="wit">${rows}</div></details>`;
  }
  const listHtml = () => `<div class="rlist">${ordered().map(f => `<div data-n="${esc(f.name)}" class="${verdictOf(f.name)} ${f.name === selected ? 'sel' : ''} ${isRemoved(f.name) ? 'removed' : ''}">${tierChip(f)}p${f.page} · ${esc(f.name)}${(BP.verdicts[f.name] || {}).edit ? ` <b>→ ${esc(BP.verdicts[f.name].edit.name || f.name)}${BP.verdicts[f.name].edit.type ? ' : ' + esc(BP.verdicts[f.name].edit.type) : ''}</b>` : ''}</div>`).join('')}</div>`;
  function bindList() { document.querySelectorAll('.rlist div').forEach(d => d.onclick = () => select(d.dataset.n)); }
  function renderList() { const old = document.querySelector('.rlist'); if (!old) return; old.outerHTML = listHtml(); bindList(); }
  function panel() {
    const a = $('#panel'), f = BP.fields.find(x => x.name === selected);
    const head = `<div class="help">${esc(BP.path)}${BP.stale ? ' <span class="stale">· verdicts predate this file</span>' : ''}${BP.build ? ` · built with ${esc(BP.build.finder)}` : ''}</div>${madeHtml(BP.made)}`;
    if (!f) { a.innerHTML = `<div class="rpanel">${head}<p class="help">Click a box on the page, or press n.</p>${listHtml()}</div>`; bindList(); return; }
    const v = BP.verdicts[f.name] || {};
    const opts = f.options.length ? `<dt>options</dt><dd>${f.options.map(o => `${esc(o.on_state)}: ${o.caption ? esc(o.caption) : '<i>no caption</i>'}`).join('<br>')}</dd>` : '';
    const loop = f.loop ? `<div class="loop"><b>loop changed</b> ${esc((f.loop.changed || []).join(', '))}${f.loop.old_name ? ` (was <code>${esc(f.loop.old_name)}</code>)` : ''}<br>${esc(f.loop.reason || '')}</div>` : '';
    const adj = f.adjudication ? `<div class="adj"><b>adjudicator</b> ${esc(f.adjudication.verdict)} for <code>${esc(f.adjudication.proposed)}</code>: ${esc(f.adjudication.reason || '')}</div>` : '';
    a.innerHTML = `<div class="rpanel">${head}
      <h2>${esc(f.name)}</h2>
      <dl>
        <dt>type</dt><dd>${esc(f.type || '')}${f.semantic_type ? ' / ' + esc(f.semantic_type) : ''}</dd>
        ${f.pattern ? `<dt>pattern</dt><dd><code>${esc(f.pattern)}</code></dd>` : ''}
        ${f.values ? `<dt>values</dt><dd>${esc(f.values.join(', '))}</dd>` : ''}
        <dt>description</dt><dd>${f.description ? esc(f.description) : '<i>none</i>'}</dd>
        <dt>path</dt><dd><code>${esc((f.path || '').split('.').slice(-1)[0])}</code></dd>
        ${opts}
      </dl>
      ${whyHtml(f)}${witnessHtml(f)}${loop}${adj}
      ${isRemoved(f.name) ? `<div class="rbanner">to be removed from the blueprint (<code>field_add --apply</code>) <button class="btn" id="vKeep">keep it (d)</button></div>` : ''}
      <div class="verdict">
        <button class="btn accept ${v.verdict === 'accept' ? 'on' : ''}" id="vAccept">accept (a)</button>
        <button class="btn flag ${v.verdict === 'flag' ? 'on' : ''}" id="vFlag">flag (f)</button>
        <button class="btn" id="vClear">clear (c)</button>
        ${isRemoved(f.name) ? '' : '<button class="btn warn" id="vRemove" title="remove this field from the blueprint">remove field (d)</button>'}
      </div>
      <div class="fix">
        <label>field name <input id="eName" size="34" value="${esc((v.edit || {}).name || f.name)}"></label>
        <label>type <select id="eType">${['string', 'number', 'integer', 'date', 'boolean', 'category'].map(t => `<option ${((v.edit || {}).type || f.type) === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        <button class="btn flag" id="vFix">save correction (e)</button>
        ${v.edit ? `<div class="help">correction saved${v.edit.name ? ` · name → <code>${esc(v.edit.name)}</code>` : ''}${v.edit.type ? ` · type → ${esc(v.edit.type)}` : ''}${v.applied ? ' · applied' : ' · not applied yet (the apply button above)'}</div>` : ''}
      </div>
      <textarea id="note" placeholder="anything else that is wrong (saved with the verdict)">${esc(v.note || '')}</textarea>
      <div class="help">note saves on blur or Enter; Shift+Enter for a newline</div>
      ${listHtml()}</div>`;
    $('#vAccept').onclick = () => setVerdict('accept'); $('#vFlag').onclick = () => setVerdict('flag'); $('#vClear').onclick = () => setVerdict(null);
    $('#vFix').onclick = saveFix;
    bindFixes(f);
    $('#eName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveFix(); } e.stopPropagation(); });
    const rm = $('#vRemove'); if (rm) rm.onclick = removeField;
    const kp = $('#vKeep'); if (kp) kp.onclick = keepField;
    const note = $('#note');
    note.addEventListener('blur', () => saveNote());
    note.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveNote(); note.blur(); } e.stopPropagation(); });
    bindList();
  }
  function progress() {
    const el = $('#progress'); if (!el || !BP) return;
    const n = BP.fields.length, acc = BP.fields.filter(f => verdictOf(f.name) === 'accept').length, flg = BP.fields.filter(f => verdictOf(f.name) === 'flag').length;
    const t = {}; BP.fields.forEach(f => { if (f.tier) t[f.tier] = (t[f.tier] || 0) + 1; });
    const tiers = Object.keys(TIER_RANK).filter(k => t[k]).map(k => `${k} ${t[k]}`).join(' · ');
    const ck = BP.checked ? (BP.checked.stale ? ' <span class="badge stalecheck">checked, file changed since</span>'
                                               : ` <span class="badge checked">checked ${esc((BP.checked.when || '').slice(0, 10))}</span>`) : '';
    el.innerHTML = ck + ` <b>${acc}</b> accepted · <b>${flg}</b> flagged · <b>${n - acc - flg}</b> left of ${n}` + (tiers ? ` <span class="help">(${tiers})</span>` : '') + (BP.witness_error ? ` <span class="stale">witnesses failed: ${esc(BP.witness_error)}</span>` : '');
    const left = BP.fields.filter(f => f.tier === 'settled' && !verdictOf(f.name)).length;
    const b = $('#bulk'); if (b) { b.textContent = `accept settled (${left})`; b.disabled = !left; }
    // corrections saved but not yet written into the blueprint: an apply button (2026-10-07)
    const pending = Object.values(BP.verdicts).filter(v => v.edit && !v.applied).length;
    if (pending) {
      el.insertAdjacentHTML('beforeend', ` <button class="btn ok" id="rApply" title="write the saved field-name and type corrections into the blueprint (hand_review --apply)">apply ${pending} correction${pending === 1 ? '' : 's'} to blueprint</button>`);

  }
  return {
    async load() { const keep = selected; BP = await j(mapi('review')); removed = (await j(mapi('review', '/removals'))).removed; BP.fields.forEach((f, i) => f.idx = i); BP.checked = (LIST.find(b => b.id === bid) || {}).checked || BP.checked; selected = BP.fields.some(f => f.name === keep) ? keep : null; },
    pages: () => BP ? BP.pages : [],
    startPage: () => BP.fields.length ? BP.fields[0].page : 1,
    pageLabel(p) { const n = BP.fields.filter(f => f.page === p).length; return n ? `p${p} (${n})` : null; },
    bar: () => `<span class="progress" id="progress"></span>
      <label class="help"><input type="checkbox" id="unrev" ${unrevOnly ? 'checked' : ''}> unreviewed only (u)</label>
      <label class="help">order <select id="order"><option value="risk">risk first</option><option value="reading">reading</option></select></label>
      <button class="btn" id="bulk" title="accept every unreviewed field that two or more witnesses back and none disputes">accept settled</button>
      <span class="help">a accept · f flag · c clear · d remove / keep · n/p next/prev · 1-9 page · Shift+1-3 mode</span>`,
    bindBar() {
      $('#unrev').onchange = e => { unrevOnly = e.target.checked; renderList(); };
      $('#order').value = order; $('#order').onchange = e => { order = e.target.value; store('hr_order', order); renderList(); };
      $('#bulk').onclick = bulkAccept; if (BP) progress();
    },
    place() {
      for (const f of BP.fields) {
        f.rects.forEach((r, i) => {
          if (r.page !== page) return;
          const d = put('rv ' + verdictOf(f.name) + (f.tier === 'contested' ? ' contested' : '') + (isRemoved(f.name) ? ' removed' : '') + (selected === f.name ? ' sel' : ''), r.rect,
                        f.options.length && f.options[i] ? `${f.name} · ${f.options[i].caption || f.options[i].on_state}` : f.name);
          d.onclick = () => select(f.name, false);

    },
    panel, progress,
    key(e) {

      else if (e.key === 'f') setVerdict('flag');
      else if (e.key === 'e') { const el = $('#eName'); if (el) { el.focus(); el.select(); } }
      else if (e.key === 'c') setVerdict(null);
      else if (e.key === 'd') { if (isRemoved(selected)) keepField(); else removeField(); }
      else if (e.key === 'n' || e.key === 'ArrowRight') next(1);
      else if (e.key === 'p' || e.key === 'ArrowLeft') next(-1);
      else if (e.key === 'u') { unrevOnly = !unrevOnly; $('#unrev').checked = unrevOnly; renderList(); }
      else return false;
      return true;
    },
  };
})();

// ======================================================================= Groups: confirm option groups, drag boxes to regroup; combine text fields
MODE.groups = (() => {
  let BP = null, units = [], selected = null, unconfOnly = false, undoStack = [], nextUid = 1, PLAN = null, planTimer = null, notes = [];
  let showText = store('gr_text') !== '0';
  const PALETTE = ['#1a73e8', '#d93025', '#188038', '#e37400', '#9334e6', '#c5221f', '#b06000', '#3f51b5', '#a142f4', '#795548'];
  const item = id => BP.items[id];
  const unitOf = id => units.find(u => u.items.includes(id));
  const unitByUid = uid => units.find(u => u.uid === uid);
  const isText = u => !!u && u.kind === 'text';
  const isTextItem = id => item(id).kind === 'text';
  const optUnits = () => units.filter(u => !isText(u));
  const isGroup = u => isText(u) || u.items.length > 1 || u.type !== 'boolean';
  const orderKey = it => [it.page, Math.round(it.rect[1] / 6), it.rect[0]];
  const cmpKey = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
  const firstItem = u => u.items.map(item).sort((a, b) => cmpKey(orderKey(a), orderKey(b)))[0];
  function sortUnits() {
    for (const u of units) u.items.sort((a, b) => cmpKey(orderKey(item(a)), orderKey(item(b))));
    units.sort((a, b) => cmpKey(orderKey(firstItem(a)), orderKey(firstItem(b))));
  }
  const onPage = (u, p = page) => u.items.some(id => item(id).page === p);
  const label = id => { const it = item(id); return it.kind === 'text' ? it.field : (it.caption || (it.key ?? it.field)); };
  const looseText = (p = page) => Object.values(BP.items).filter(it => it.kind === 'text' && it.page === p && !unitOf(it.id));
  function colorOf(u) {
    if (isText(u)) return 'var(--txt)';
    if (!isGroup(u)) return 'var(--orphan)';
    const gs = optUnits().filter(x => isGroup(x) && onPage(x)); const i = gs.indexOf(u);
    return PALETTE[(i < 0 ? 0 : i) % PALETTE.length];
  }
  const baseOf = u => !isText(u) && u.origin ? BP.base.find(b => b.name === u.origin) : null;
  function status(u) {
    const b = baseOf(u); if (!b) return 'new';
    return b.name === u.name && b.type === u.type && [...b.items].sort().join('|') === [...u.items].sort().join('|') ? 'as blueprint' : 'edited';
  }

      added.forEach((a, i) => boxesOf(a).filter(b => b.page === page).forEach((b, k) => {
        const d = put('ov added', b.rect, a.name); d.dataset.added = i;
        if (k === 0) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = a.name; d.appendChild(t); }
      }));
      for (const p of props) for (const b of boxesOf(p)) if (b.page === page) put('ov prop', b.rect);
    },
    panel, progress,
    mousedown(e) { if (e.button !== 0) return; e.preventDefault(); drawStart = pt(e); drawTarget = e.target; },
    mousemove(e) {
      if (!drawStart) return; const p = pt(e);
      const r = [Math.min(drawStart[0], p[0]), Math.min(drawStart[1], p[1]), Math.max(drawStart[0], p[0]), Math.max(drawStart[1], p[1])];
      if (!drawBox && (r[2] - r[0]) * scale < 4 && (r[3] - r[1]) * scale < 4) return;
      if (!drawBox) drawBox = put('ov draw', r);
      else { drawBox.style.left = r[0] * scale + 'px'; drawBox.style.top = r[1] * scale + 'px'; drawBox.style.width = (r[2] - r[0]) * scale + 'px'; drawBox.style.height = (r[3] - r[1]) * scale + 'px'; }
      drawBox._r = r;
    },
    async mouseup() {
      if (!drawStart) return;
      const s = drawStart, b = drawBox, t = drawTarget; drawStart = null; drawBox = null; drawTarget = null;
      if (b) { b.remove(); curSid = null; picked = null; return propose({page, rect: b._r}); }
      if (t && t.dataset && t.dataset.sid) { const sg = BP.suggestions.find(x => x.sid === t.dataset.sid); if (sg) return proposeSid(sg); }
      if (t && t.dataset && t.dataset.field) { props = []; curSid = null; notes = []; picked = t.dataset.field; placeAll(); return panel(); }
      if (t && t.dataset && t.dataset.added !== undefined) { notes = [`${added[+t.dataset.added].name} is recorded to be added (remove it from the list below)`]; return panel(); }
      curSid = null; propose({page, rect: [s[0] - 1, s[1] - 1, s[0] + 1, s[1] + 1]});
    },
    key(e) {
      if (e.key === 'n') gotoSuggestion(1);
      else if (e.key === 'p') gotoSuggestion(-1);
      else if (e.key === 'Enter' && props.length) addProps(props.map((_, i) => i));
      else if (e.key === 'x' && curSid) notAField();
      else if (e.key === 'Escape') cancel();
      else if (e.key === 'd' && picked) toggleRemove();
      else if (e.key === 'f') { showFields = !showFields; $('#aFields').checked = showFields; placeAll(); }
      else if (e.key === 's') { showSug = !showSug; $('#aSug').checked = showSug; placeAll(); }
      else return false;
      return true;
    },
  };
})();

init();
</script>
</body>
