<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blueprint review</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --line:#ddd; --panel:#fafafa; --card:#fff; --sel:#1a73e8; --ok:#1e8e3e; --bad:#c5221f;
          --accept:#1e8e3e; --flag:#c5221f; --none:#8a8a8a; --orphan:#7a7a7a; --over:rgba(26,115,232,.18);
          --field:#8e24aa; --sug:#e37400; --added:#188038; --txt:#00838f; --tabon:#e8f0fe; }
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.4 -apple-system, Helvetica, Arial, sans-serif; color:var(--fg); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header, #modebar { display:flex; gap:12px; align-items:center; padding:6px 12px; flex-wrap:wrap; }
  header { border-bottom:1px solid var(--line); }
  #modebar { border-bottom:1px solid var(--line); background:var(--panel); min-height:36px; }
  header select { font:inherit; max-width:520px; }
  .tabs { display:flex; gap:0; }
  .tabs button { font:inherit; padding:4px 12px; border:1px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer; margin-left:-1px; }
  .tabs button:first-child { border-radius:4px 0 0 4px; } .tabs button:last-child { border-radius:0 4px 4px 0; }
  .tabs button.on { background:var(--tabon); border-color:var(--sel); font-weight:600; position:relative; }
  .pages button, .btn { font:inherit; padding:3px 9px; border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:4px; cursor:pointer; }
  #modebar .btn { background:var(--bg); }
  .pages button.on { background:var(--tabon); border-color:var(--sel); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.primary { border-color:var(--ok); color:var(--ok); }
  .btn.warn { border-color:var(--bad); color:var(--bad); }
  .help { color:var(--muted); font-size:12px; }
  .stale, .err { color:var(--bad); }
  .progress { color:var(--muted); } .progress b { color:var(--fg); }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; overflow:auto; background:#efefef; }
  #canvas { position:relative; margin:12px; display:inline-block; box-shadow:0 1px 4px rgba(0,0,0,.25); user-select:none; }
  #canvas.drawable { cursor:crosshair; }
  #canvas img { display:block; -webkit-user-drag:none; pointer-events:none; }
  aside { width:440px; border-left:1px solid var(--line); overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  aside > * { flex-shrink:0; }
  h4 { margin:0 0 4px; font-size:12px; color:var(--muted); font-weight:600; }
  .badge { font-size:11px; font-weight:600; border-radius:3px; padding:0 5px; }

  /* review */
  .rv { position:absolute; border:1.5px solid var(--none); cursor:pointer; }
  .rv.accept { border-color:var(--accept); }
  .rv.flag { border-color:var(--flag); background:rgba(197,34,31,.06); }
  .rv.contested:not(.accept):not(.flag) { border-style:dashed; border-color:#c5221f; }
  .rv.sel { border-width:2.5px; border-color:var(--sel); box-shadow:0 0 0 2px rgba(26,115,232,.35); z-index:2; }
  dl { display:grid; grid-template-columns:96px 1fr; gap:3px 8px; margin:8px 0; } dt { color:var(--muted); } dd { margin:0; word-break:break-word; }
  .rpanel h2 { font-size:15px; margin:0 0 6px; word-break:break-all; }
  .verdict { display:flex; gap:8px; margin:12px 0 6px; }
  .verdict .btn.accept { border-color:var(--accept); color:var(--accept); } .verdict .btn.flag { border-color:var(--flag); color:var(--flag); }
  .verdict .btn.on.accept { background:var(--accept); color:#fff; } .verdict .btn.on.flag { background:var(--flag); color:#fff; }
  textarea { width:100%; font:inherit; min-height:54px; }
  .loop { background:#fff8e1; border:1px solid #f1e2a8; padding:6px 8px; border-radius:4px; margin:8px 0; }
  .adj { background:#e8f0fe; border:1px solid #c6d8f7; padding:6px 8px; border-radius:4px; margin:8px 0; }
  .rlist { margin-top:4px; border-top:1px solid var(--line); padding-top:8px; max-height:38vh; overflow:auto; }
  .rlist div { padding:2px 4px; cursor:pointer; border-left:3px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rlist div.accept { border-left-color:var(--accept); } .rlist div.flag { border-left-color:var(--flag); } .rlist div.sel { background:var(--tabon); }
  .badge.checked { background:#e6f4ea; color:#137333; border:1px solid #a8dab5; }
  .badge.stalecheck { background:#fef7e0; color:#7a5b00; border:1px solid #f1e2a8; }
  .tier { display:inline-block; min-width:1.1em; text-align:center; font-size:11px; font-weight:600; border-radius:3px; padding:0 3px; margin-right:4px; }
  .tier.contested { background:#fce8e6; color:#a50e0e; } .tier.unknown { background:#eee; color:#555; }
  .tier.single { background:#fef7e0; color:#7a5b00; } .tier.settled { background:#e6f4ea; color:#137333; }
  .wit { margin:8px 0; font-size:12px; } .wit div { padding:1px 0; } .wit .no { color:#a50e0e; } .wit .yes { color:#137333; } .wit .mute { color:var(--muted); }

  /* groups */
  .gh { position:absolute; border:1.5px dashed var(--c); background:color-mix(in srgb, var(--c) 7%, transparent); border-radius:3px; z-index:1; cursor:pointer; }
  .gh.sel { border-style:solid; border-width:2px; background:color-mix(in srgb, var(--c) 14%, transparent); z-index:2; }
  .gh.ok { border-style:solid; }
  .gi { position:absolute; border:2px solid var(--c); background:color-mix(in srgb, var(--c) 18%, transparent); z-index:3; cursor:grab; }
  .gi::after { content:''; position:absolute; inset:-3px; }
  .gi.orphan { border-style:dashed; background:transparent; }
  .gi.sel { box-shadow:0 0 0 2px var(--sel); z-index:4; }
  .gi.locked { cursor:not-allowed; } .gi.dragging { opacity:.35; }
  .over { outline:3px solid var(--sel) !important; background:var(--over) !important; }
  .gcard { border:1px solid var(--line); border-left:4px solid var(--c, var(--orphan)); border-radius:4px; padding:6px 8px; background:var(--card); }
  .gcard.sel { box-shadow:0 0 0 2px var(--sel); } .gcard.ok { border-left-color:var(--ok); }
  .gcard h3 { margin:0; font-size:13px; display:flex; gap:6px; align-items:center; cursor:pointer; word-break:break-all; }
  .gcard h3 .grip { cursor:grab; color:var(--muted); }
  .gchips { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .gchip { border:1px solid var(--line); border-radius:10px; padding:1px 8px; background:var(--panel); cursor:grab; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  .gchip.orphan { border-style:dashed; } .gchip.sel { border-color:var(--sel); } .gchip .x { margin-left:5px; color:var(--muted); cursor:pointer; }
  .tray { border:1.5px dashed var(--orphan); border-radius:4px; padding:6px 8px; min-height:44px; }
  .gcur { border:1px solid var(--sel); border-radius:4px; padding:8px 10px; }
  .gcur h2 { margin:0 0 6px; font-size:14px; } .gcur input[type=text] { font:inherit; width:100%; padding:3px 5px; }
  .gcur .row { display:flex; gap:8px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  .gcur ol { margin:6px 0; padding-left:20px; }
  .btn.ok { border-color:var(--ok); color:var(--ok); } .btn.ok.on { background:var(--ok); color:#fff; }
  .badge.edit { background:#fef7e0; color:#7a5b00; } .badge.new { background:#e8f0fe; color:#1a4fa0; } .badge.ok { background:#e6f4ea; color:#137333; }
  .warn { color:var(--bad); font-size:12px; }
  .changes { font-size:12px; } .changes li { margin:1px 0; } .changes .err { color:var(--bad); }

  /* add fields */
  .ov { position:absolute; }
  .ov.field { border:1.5px solid var(--field); background:color-mix(in srgb, var(--field) 10%, transparent); }
  .ov.field:hover { background:color-mix(in srgb, var(--field) 25%, transparent); }
  .ov.sug { border:2px solid var(--sug); background:color-mix(in srgb, var(--sug) 10%, transparent); cursor:pointer; }
  .ov.sug.finder { border-style:dashed; } .ov.sug.copy { opacity:.35; } .ov.sug.cur { box-shadow:0 0 0 2px var(--sel); }
  .ov.added { border:2px solid var(--added); background:color-mix(in srgb, var(--added) 12%, transparent); cursor:pointer; }
  .ov.added .tag { position:absolute; left:0; top:-14px; font-size:10px; line-height:12px; background:var(--card); color:var(--added); padding:0 3px; white-space:nowrap; pointer-events:none; }
  .ov.prop { border:2px solid var(--sel); background:color-mix(in srgb, var(--sel) 12%, transparent); pointer-events:none; }
  .ov.draw { border:1.5px dashed var(--sel); background:color-mix(in srgb, var(--sel) 8%, transparent); pointer-events:none; }
  .acard { border:1px solid var(--sel); border-radius:4px; padding:8px 10px; background:var(--card); }
  .acard h3 { margin:0 0 6px; font-size:13px; }
  .acard input[type=text], .acard textarea, .acard select { font:inherit; width:100%; padding:3px 5px; }
  .acard textarea { min-height:40px; }
  .grid { display:grid; grid-template-columns:84px 1fr; gap:4px 8px; align-items:center; margin:6px 0; } .grid label { color:var(--muted); }
  .achips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .achip { border:1px solid var(--line); border-radius:10px; padding:1px 8px; background:var(--panel); cursor:pointer; font-size:12px; }
  .achip.on { border-color:var(--sel); background:var(--tabon); } .achip .src { color:var(--muted); margin-left:4px; }
  .ev { font-size:12px; color:var(--muted); margin:6px 0 0; padding-left:16px; }
  .opts td { padding:1px 3px; } .opts input { font:inherit; width:100%; }
  .arow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .notes { font-size:12px; color:var(--muted); }
  .alist div { padding:2px 4px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .alist div:hover { background:var(--panel); } .alist .x { color:var(--muted); }

  /* combine */
  .cb { position:absolute; }
  .cb.other { border:1px solid var(--none); opacity:.45; pointer-events:none; }
  .cb.text { border:1.5px solid var(--txt); background:color-mix(in srgb, var(--txt) 8%, transparent); cursor:pointer; }
  .cb.text:hover { background:color-mix(in srgb, var(--txt) 22%, transparent); }
  .cb.text.sel { border:2.5px solid var(--sel); background:color-mix(in srgb, var(--sel) 18%, transparent); z-index:2; }
  .cb.member { border:1px dashed var(--added); opacity:.6; pointer-events:none; }
  .cb.combo { border:2px solid var(--added); background:color-mix(in srgb, var(--added) 10%, transparent); cursor:pointer; z-index:1; }
  .cb.combo .tag, .cb.preview .tag { position:absolute; left:0; top:-14px; font-size:10px; line-height:12px; background:var(--card); color:var(--added); padding:0 3px; white-space:nowrap; pointer-events:none; }
  .cb.preview { border:2px dashed var(--sel); pointer-events:none; }
  .cb.draw { border:1.5px dashed var(--sel); background:color-mix(in srgb, var(--sel) 8%, transparent); pointer-events:none; }
  .ccard { border:1px solid var(--sel); border-radius:4px; padding:8px 10px; background:var(--card); }
  .ccard input[type=text], .ccard textarea { font:inherit; width:100%; padding:3px 5px; }
  .ccard ol { margin:6px 0; padding-left:20px; }

  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1e1e; --fg:#eee; --muted:#aaa; --line:#444; --panel:#2c2c2c; --card:#242424; --orphan:#9a9a9a; --field:#ce93d8; --txt:#4dd0e1; --tabon:#1f2d44; }
    #stage { background:#2a2a2a; }
    .loop { background:#3a3420; border-color:#6a5d2a; } .adj { background:#1f2d44; border-color:#2f4d7a; }
    .badge.edit { background:#3a3420; color:#f1d77a; } .badge.new { background:#1f2d44; color:#9cc0ff; } .badge.ok { background:#1e3a26; color:#8fd4a0; }
  }
</style>
</head>
<body>
<header>
  <select id="pick"></select>
  <label class="help">list <select id="listorder"><option value="name">by name</option><option value="oldest">oldest first</option></select></label>
  <span class="tabs" id="tabs">
    <button data-mode="review" title="Shift+1">Review</button><button data-mode="groups" title="Shift+2">Groups</button><button data-mode="add" title="Shift+3">Add fields</button><button data-mode="combine" title="Shift+4">Combine</button>
  </span>
  <span class="pages" id="pages"></span>
  <span class="help">zoom <button class="btn" id="zout">-</button> <button class="btn" id="zin">+</button></span>
</header>
<div id="modebar"></div>
<main>
  <div id="stage"><div id="canvas"><img id="img" alt=""></div></div>
  <aside id="panel"><p class="help">Pick a blueprint.</p></aside>
</main>
<script>
// ======================================================================= shared: picker, modes, page, zoom, keys
let LIST = [], bid = null, page = 1, zoom = 1.6, scale = 1, mode = 'review';
const MODE = {};
const M = () => MODE[mode];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function j(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); }
const send = (method, url, body) => j(url, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
const mapi = (m, p = '') => `/api/${m}/${encodeURIComponent(bid)}${p}`;
function localNow() { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; }
function overlap(a, b) {
  const ix = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])), iy = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  const i = ix * iy; if (i <= 0) return 0;
  return i / Math.min(Math.max((a[2] - a[0]) * (a[3] - a[1]), 1e-6), Math.max((b[2] - b[0]) * (b[3] - b[1]), 1e-6));
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

async function init() {
  $('#pick').innerHTML = '<option>loading blueprints…</option>';
  try { LIST = await j('/api/blueprints'); }
  catch (e) { $('#pick').innerHTML = ''; $('#panel').innerHTML = `<p class="err">Could not load the blueprint list: ${esc(e.message)}</p>`; return; }
  zoom = parseFloat(store('br_zoom')) || zoom;
  $('#listorder').value = store('br_listorder') || 'name';
  const [hm, hb] = decodeURIComponent(location.hash.slice(1)).split('/');
  mode = MODE[hm] ? hm : (store('br_mode') || 'review');
  renderTabs(); renderPicker(); renderModebar();
  $('#pick').addEventListener('change', () => openBlueprint($('#pick').value));
  $('#listorder').addEventListener('change', e => { store('br_listorder', e.target.value); renderPicker(); });
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $('#zin').onclick = () => setZoom(zoom * 1.25); $('#zout').onclick = () => setZoom(zoom / 1.25);
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', () => bid && placeAll());
  bindCanvas();
  const first = hb && LIST.some(b => b.id === hb) ? hb : null;
  if (first) { $('#pick').value = first; openBlueprint(first); }
}

function setHash() { history.replaceState(null, '', '#' + encodeURIComponent(mode) + (bid ? '/' + encodeURIComponent(bid) : '')); }
function renderTabs() { document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode)); $('#canvas').classList.toggle('drawable', mode === 'add' || mode === 'combine'); }

function ageText(a) {
  if (!a) return '';
  const v = a.validated ? `validated ${a.validated} on ${a.finder || '?'}${a.finder_current === false ? ' (old finder)' : ''}` : 'no build stamp';
  return `${a.by} ${a.when || '?'} · ${v}`;
}
function pickerText(b) {
  const bits = [`${b.fields} fields`];
  const done = b.accepted + b.flagged;
  if (b.checked) bits.push(b.checked.stale ? 'checked, file changed since' : `checked${b.checked.flagged ? `, ${b.checked.flagged} flagged` : ''}`);
  else if (done) bits.push(`${done} reviewed`);
  if (b.stale) bits.push('verdicts stale');
  if (b.groups) bits.push(b.groups.confirmed === b.groups.units ? 'groups confirmed' : `groups ${b.groups.confirmed}/${b.groups.units}`);
  if (b.add && b.add.added) bits.push(`${b.add.added} to add`);
  if (b.combine) bits.push(`${b.combine} to combine`);
  return `${b.form}  (${bits.join(', ')})  ·  ${ageText(b.age)}`;
}
function renderPicker() {
  const pick = $('#pick'), keep = pick.value || bid;
  pick.innerHTML = '<option value="">pick a blueprint…</option>';
  const groups = {lib: 'library', je: 'judge-eval side copies', rl: 'relabels', fl: 'flat forms'};
  const oldest = $('#listorder').value === 'oldest';
  for (const src of Object.keys(groups)) {
    const items = LIST.filter(x => x.source === src); if (!items.length) continue;
    items.sort(oldest ? (a, b) => ((a.age || {}).when || '').localeCompare((b.age || {}).when || '') || a.form.localeCompare(b.form)
                      : (a, b) => a.form.localeCompare(b.form));
    const og = document.createElement('optgroup'); og.label = groups[src];
    for (const b of items) { const o = document.createElement('option'); o.value = b.id; o.textContent = pickerText(b); og.appendChild(o); }
    pick.appendChild(og);
  }
  if (keep && LIST.some(b => b.id === keep)) pick.value = keep;
}
function updateEntry(e) { if (!e) return; const i = LIST.findIndex(b => b.id === e.id); if (i >= 0) LIST[i] = e; renderPicker(); }

async function openBlueprint(id) {
  if (!id) return;
  bid = id; setHash();
  $('#panel').innerHTML = '<p class="help">loading…</p>';
  await loadMode();
}
async function loadMode() {
  try { await M().load(); }
  catch (e) { $('#panel').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const pages = M().pages();
  if (!pages.some(p => p.page === page) || !M().pageLabel(page)) page = M().startPage() || (pages[0] || {}).page || 1;
  renderModebar(); renderPages(); await showPage(); M().panel(); M().progress();
}
async function setMode(m) {
  if (!MODE[m] || m === mode) return;
  mode = m; store('br_mode', m); renderTabs(); setHash();
  document.querySelectorAll('#canvas > div').forEach(e => e.remove());
  if (bid) await loadMode(); else renderModebar();
}
function renderModebar() { $('#modebar').innerHTML = M().bar(); M().bindBar(); }

function renderPages() {
  const el = $('#pages'); el.innerHTML = '';
  for (const p of M().pages()) {
    const label = M().pageLabel(p.page); if (!label) continue;
    const b = document.createElement('button'); b.textContent = label;
    b.className = p.page === page ? 'on' : ''; b.onclick = () => gotoPage(p.page);
    el.appendChild(b);
  }
}
async function gotoPage(p) { page = p; renderPages(); await showPage(); if (M().onPage) M().onPage(); M().panel(); }
function setZoom(z) { zoom = Math.min(6, Math.max(0.6, z)); store('br_zoom', zoom); if (bid) { sizeImage(); placeAll(); } }
function sizeImage() { const p = M().pages().find(x => x.page === page); if (p) $('#img').style.width = (p.w_pt * zoom) + 'px'; }
async function showPage() {
  const img = $('#img'), url = `/api/blueprints/${encodeURIComponent(bid)}/png/${page}`;
  sizeImage();
  if (!(img.complete && img.getAttribute('src') === url)) await new Promise(res => { img.onload = res; img.onerror = res; img.src = url; });
  placeAll();
}
function placeAll() {
  const canvas = $('#canvas'); canvas.querySelectorAll(':scope > div').forEach(e => e.remove());
  const p = M().pages().find(x => x.page === page); if (!p) return;
  scale = $('#img').clientWidth / p.w_pt;
  M().place();
}
function put(cls, r, title) {
  const d = document.createElement('div'); d.className = cls;
  d.style.left = (r[0] * scale) + 'px'; d.style.top = (r[1] * scale) + 'px';
  d.style.width = Math.max(5, (r[2] - r[0]) * scale) + 'px'; d.style.height = Math.max(5, (r[3] - r[1]) * scale) + 'px';
  if (title) d.title = title;
  $('#canvas').appendChild(d); return d;
}
function bindCanvas() {
  $('#canvas').addEventListener('mousedown', e => { if (bid && M().mousedown) M().mousedown(e); });
  window.addEventListener('mousemove', e => { if (bid && M().mousemove) M().mousemove(e); });
  window.addEventListener('mouseup', e => { if (bid && M().mouseup) M().mouseup(e); });
}

function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && ['TEXTAREA', 'INPUT', 'SELECT'].includes(t.tagName) && t.type !== 'checkbox' && t.type !== 'radio') return;
  if (e.shiftKey && /^Digit[1234]$/.test(e.code)) { setMode(['review', 'groups', 'add', 'combine'][+e.code.slice(5) - 1]); e.preventDefault(); return; }
  if (!bid) return;
  if (e.key === '+' || e.key === '=') setZoom(zoom * 1.25);
  else if (e.key === '-') setZoom(zoom / 1.25);
  else if (/^[1-9]$/.test(e.key)) { const p = +e.key; if (M().pages().some(x => x.page === p) && M().pageLabel(p)) gotoPage(p); }
  else if (!M().key(e)) return;
  e.preventDefault();
}

// ======================================================================= Review: accept / flag / note per field
MODE.review = (() => {
  let BP = null, selected = null, unrevOnly = false, order = store('hr_order') || 'risk';
  const TIER_RANK = {contested: 0, unknown: 1, single: 2, settled: 3};
  const TIER_LETTER = {contested: '!', unknown: '?', single: '1', settled: '2+'};

    onPage() { const u = units.find(x => onPage(x) && (!unconfOnly || !x.confirmed)) || units.find(x => onPage(x)); if (u) selected = u.uid; placeAll(); },
    bar: () => `<span class="progress" id="progress"></span>
      <label class="help"><input type="checkbox" id="gUnconf" ${unconfOnly ? 'checked' : ''}> unconfirmed only (u)</label>
      <button class="btn" id="gUndo" ${undoStack.length ? '' : 'disabled'}>undo (z)</button>

    bindBar() { $('#gUnconf').onchange = e => { unconfOnly = e.target.checked; panel(); }; $('#gUndo').onclick = undo; if (BP) progress(); },
    place() {

          h.onclick = () => select(u.uid, false);

          $('#canvas').appendChild(h);
        }
        for (const it of its) {
          const d = document.createElement('div'); d.dataset.item = it.id;
          d.className = 'gi' + (isGroup(u) ? '' : ' orphan') + (sel ? ' sel' : '') + (u.locked ? ' locked' : '');
          d.style.setProperty('--c', c); box(d, it.rect, 0);
          d.title = `${u.name}${isGroup(u) ? ' · ' + label(it.id) : ''}${u.locked ? ' (locked: ' + u.locked + ')' : ''}`;
          d.onclick = e => { e.stopPropagation(); select(u.uid, false); };

    panel, progress,
    key(e) {

      else if (e.key === 'p' || e.key === 'ArrowLeft') next(-1);
      else if (e.key === 'z') undo();
      else if (e.key === 'u') { unconfOnly = !unconfOnly; $('#gUnconf').checked = unconfOnly; panel(); }
      else return false;
      return true;
    },
  };
})();

      <div class="help">The page only records. To write it into the blueprint:<br><code>PYTHONPATH=. venv/bin/python -m petey.validate.field_add --apply ${esc(bid)}</code></div>`;
  }
  function progress() { const el = $('#progress'); if (el && BP) el.innerHTML = `<b>${added.length}</b> to add · <b>${dismissed.length}</b> not fields · <b>${remaining().length}</b> suggestions left`; }
  const pt = e => { const r = $('#canvas').getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale]; };
  return {
    async load() {
      BP = await j(mapi('add'));
      added = BP.added; dismissed = BP.dismissed; props = []; notes = []; curSid = null; PLAN = BP.plan;
    },
    pages: () => BP ? BP.pages : [],
    startPage: () => (remaining()[0] || {}).page || 1,
    pageLabel(p) { const n = remaining().filter(s => s.page === p).length; return `p${p}${n ? ` (${n})` : ''}`; },
    bar: () => `<span class="progress" id="progress"></span>
      <label class="help"><input type="checkbox" id="aFields" ${showFields ? 'checked' : ''}> fields (f)</label>
      <label class="help"><input type="checkbox" id="aSug" ${showSug ? 'checked' : ''}> suggestions (s)</label>
      <label class="help"><input type="checkbox" id="aCopies" ${copies ? 'checked' : ''}> repeated copies</label>
      <span class="help">drag over an area, or click a box · n/p suggestion · Enter add · x not a field · Esc cancel · Shift+1-4 mode</span>`,
    bindBar() {
      $('#aFields').onchange = e => { showFields = e.target.checked; placeAll(); };
      $('#aSug').onchange = e => { showSug = e.target.checked; placeAll(); };
      $('#aCopies').onchange = e => { copies = e.target.checked; placeAll(); panel(); };
      if (BP) progress();
    },
    place() {
      if (showFields) for (const f of BP.fields) if (f.page === page) put('ov field', f.rect, f.name).dataset.field = f.name;
      if (showSug) for (const s of remaining()) if (s.page === page) put(`ov sug ${s.source}${s.copy ? ' copy' : ''}${s.sid === curSid ? ' cur' : ''}`, s.rect, s.what).dataset.sid = s.sid;
      added.forEach((a, i) => boxesOf(a).filter(b => b.page === page).forEach((b, k) => {
        const d = put('ov added', b.rect, a.name); d.dataset.added = i;
        if (k === 0) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = a.name; d.appendChild(t); }
      }));
      for (const p of props) for (const b of boxesOf(p)) if (b.page === page) put('ov prop', b.rect);
    },
    panel, progress,
    mousedown(e) { if (e.button !== 0) return; e.preventDefault(); drawStart = pt(e); drawTarget = e.target; },
    mousemove(e) {
      if (!drawStart) return; const p = pt(e);
      const r = [Math.min(drawStart[0], p[0]), Math.min(drawStart[1], p[1]), Math.max(drawStart[0], p[0]), Math.max(drawStart[1], p[1])];
      if (!drawBox && (r[2] - r[0]) * scale < 4 && (r[3] - r[1]) * scale < 4) return;
      if (!drawBox) drawBox = put('ov draw', r);
      else { drawBox.style.left = r[0] * scale + 'px'; drawBox.style.top = r[1] * scale + 'px'; drawBox.style.width = (r[2] - r[0]) * scale + 'px'; drawBox.style.height = (r[3] - r[1]) * scale + 'px'; }
      drawBox._r = r;
    },
    async mouseup() {
      if (!drawStart) return;
      const s = drawStart, b = drawBox, t = drawTarget; drawStart = null; drawBox = null; drawTarget = null;
      if (b) { b.remove(); curSid = null; return propose({page, rect: b._r}); }
      if (t && t.dataset && t.dataset.sid) { const sg = BP.suggestions.find(x => x.sid === t.dataset.sid); if (sg) return proposeSid(sg); }
      if (t && t.dataset && t.dataset.field) { props = []; curSid = null; notes = [fieldInfo(t.dataset.field)]; placeAll(); return panel(); }
      if (t && t.dataset && t.dataset.added !== undefined) { notes = [`${added[+t.dataset.added].name} is recorded to be added (remove it from the list below)`]; return panel(); }
      curSid = null; propose({page, rect: [s[0] - 1, s[1] - 1, s[0] + 1, s[1] + 1]});
    },
    key(e) {
      if (e.key === 'n') gotoSuggestion(1);
      else if (e.key === 'p') gotoSuggestion(-1);
      else if (e.key === 'Enter' && props.length) addProps(props.map((_, i) => i));
      else if (e.key === 'x' && curSid) notAField();
      else if (e.key === 'Escape') cancel();
      else if (e.key === 'f') { showFields = !showFields; $('#aFields').checked = showFields; placeAll(); }
      else if (e.key === 's') { showSug = !showSug; $('#aSug').checked = showSug; placeAll(); }
      else return false;
      return true;
    },
  };
})();

// ======================================================================= Combine: text fields -> one bigger text field
MODE.combine = (() => {
  let BP = null, sel = [], combos = [], PLAN = null, nameDraft = null, descDraft = null, edited = false, notes = [];
  let drawStart = null, drawBox = null, drawTarget = null;
  const T = n => BP.texts.find(t => t.name === n);
  const orderKey = t => [t.page, Math.round(t.rect[1] / 6), t.rect[0]];
  const cmp = (a, b) => { const x = orderKey(a), y = orderKey(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; };
  const union = rs => [Math.min(...rs.map(r => r[0])), Math.min(...rs.map(r => r[1])), Math.max(...rs.map(r => r[2])), Math.max(...rs.map(r => r[3]))];
  const comboOf = n => combos.find(c => c.members.includes(n));
  const free = t => !comboOf(t.name);
  const sorted = names => names.map(T).sort(cmp).map(t => t.name);
  function taken(except) {
    const members = new Set(combos.flatMap(c => c.members).concat(sel));
    return new Set([...BP.names.filter(n => !members.has(n)), ...combos.filter(c => c !== except).map(c => c.name)]);
  }
  function suggestName(names) {
    const parts = names.map(n => n.split('_')), pre = [];
    for (let i = 0; i < Math.min(...parts.map(p => p.length)); i++) { if (parts.every(p => p[i] === parts[0][i])) pre.push(parts[0][i]); else break; }
    while (pre.length && (/^\d+$/.test(pre[pre.length - 1]) || ['part', 'pt', 'line', 'ln', 'row', 'col'].includes(pre[pre.length - 1]))) pre.pop();
    const last = parts.map(p => p[p.length - 1]);
    const suffix = last.every(x => x === last[0]) && ['txt', 'nm', 'amt', 'dt', 'cd', 'num'].includes(last[0]) && pre[pre.length - 1] !== last[0] ? last[0] : null;
    let base = pre.join('_') + (suffix ? '_' + suffix : '');
    if (!/^[a-z][a-z0-9_]*$/.test(base) || pre.length === 0) base = names[0] + '_combined';
    const t = taken(null); let n = base, k = 2; while (t.has(n)) n = `${base}_${k++}`;
    return n;
  }
  function defaultDesc(names) { const ds = [...new Set(names.map(n => (T(n).description || '').trim()).filter(Boolean))]; return ds.join(' / '); }
  function refreshDraft() { if (!edited) { nameDraft = sel.length >= 2 ? suggestName(sorted(sel)) : null; descDraft = sel.length >= 2 ? defaultDesc(sorted(sel)) : null; } }
  function toggle(n) {
    const t = T(n); if (!t || !free(t)) return;
    if (sel.length && T(sel[0]).page !== t.page) sel = [];
    sel = sel.includes(n) ? sel.filter(x => x !== n) : sel.concat([n]);
    notes = []; refreshDraft(); placeAll(); panel();
  }
  function selectIn(r, add) {
    const hit = BP.texts.filter(t => t.page === page && free(t) && (t.rect[0] + t.rect[2]) / 2 >= r[0] && (t.rect[0] + t.rect[2]) / 2 <= r[2]
                                     && (t.rect[1] + t.rect[3]) / 2 >= r[1] && (t.rect[1] + t.rect[3]) / 2 <= r[3]).map(t => t.name);
    sel = add ? [...new Set(sel.filter(n => T(n).page === page).concat(hit))] : hit;
    notes = hit.length ? [] : ['no free text fields in that area']; edited = false; refreshDraft(); placeAll(); panel();
  }
  function clear() { sel = []; edited = false; nameDraft = descDraft = null; notes = []; placeAll(); panel(); }
  function combine() {
    if (sel.length < 2) { notes = ['select two or more text fields']; return panel(); }
    const name = (nameDraft || '').trim();
    if (!/^[a-z][a-z0-9_]*$/.test(name)) { notes = ['not a field name (lower case, digits, underscores)']; return panel(); }
    if (taken(null).has(name)) { notes = [`${name} is already a field`]; return panel(); }
    combos.push({name, members: sorted(sel), description: (descDraft || '').trim(), when: localNow()});
    sel = []; edited = false; nameDraft = descDraft = null; notes = []; save();
  }
  async function save() {
    try { PLAN = await send('PUT', mapi('combine', '/record'), {combos}); BP.stale = false; updateEntry(PLAN.entry); }
    catch (e) { alert('Save failed: ' + e.message); }
    placeAll(); panel(); progress(); renderPages();
  }
  function panel() {
    const a = $('#panel');
    const head = `<div class="help">${esc(BP.path)}${BP.stale ? ' <span class="stale">· recorded against an earlier version of this file</span>' : ''}</div>`;
    let cur;
    if (sel.length) {
      const ts = sorted(sel).map(T);
      cur = `<div class="ccard"><h4>Selected on p${ts[0].page} (${ts.length})</h4>
        <ol>${ts.map(t => `<li>${esc(t.name)} <span class="help">${esc(t.type || '')}${t.semantic_type ? '/' + esc(t.semantic_type) : ''}${t.path ? ' · ' + esc(t.path.split('.').pop()) : ''}</span></li>`).join('')}</ol>
        ${ts.length >= 2 ? `<label class="help">name of the combined text field</label>
          <input type="text" id="cName" value="${esc(nameDraft || '')}">
          <label class="help">description</label>
          <textarea id="cDesc">${esc(descDraft || '')}</textarea>
          <div class="help">one string field over the union of these boxes; no path (the reader clips the page text, the filler splits over the widgets)</div>` : '<p class="help">select one more</p>'}
        <div class="arow"><button class="btn primary" id="cGo" ${ts.length < 2 ? 'disabled' : ''}>combine (Enter)</button><button class="btn" id="cClear">clear (Esc)</button></div></div>`;
    } else cur = '<p class="help">Click text fields (teal) to select them, or drag a box over them; then name the whole and press Enter. Text fields only, one page at a time.</p>';
    const nts = notes.length ? `<div class="notes">${notes.map(n => `<div class="err">${esc(n)}</div>`).join('')}</div>` : '';
    const list = `<div><h4>To combine (${combos.length})</h4><div class="alist">${combos.map((c, i) =>
        `<div data-cgoto="${i}"><span>p${T(c.members[0]) ? T(c.members[0]).page : '?'} · ${esc(c.name)} <span class="help">← ${esc(c.members.join(', '))}</span></span><span class="x" data-cdel="${i}" title="undo this combination">×</span></div>`).join('') || '<p class="help">nothing yet</p>'}</div></div>`;
    const ch = PLAN && combos.length ? `<div class="changes"><h4>What applying would change in the blueprint</h4><ul>
        ${PLAN.errors.map(e => `<li class="err">${esc(e)}</li>`).join('')}${PLAN.changes.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
        <div class="help">The page only records. To write it into the blueprint:<br><code>PYTHONPATH=. venv/bin/python -m petey.validate.field_combine --apply ${esc(bid)}</code></div></div>` : '';
    a.innerHTML = head + cur + nts + list + ch;
    const n = $('#cName');
    if (n) {
      n.addEventListener('input', () => { nameDraft = n.value; edited = true; });
      n.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') combine(); if (e.key === 'Escape') clear(); });
    }
    const d = $('#cDesc'); if (d) { d.addEventListener('input', () => { descDraft = d.value; edited = true; }); d.addEventListener('keydown', e => e.stopPropagation()); }
    const go = $('#cGo'); if (go) go.onclick = combine;
    const cl = $('#cClear'); if (cl) cl.onclick = clear;
    document.querySelectorAll('[data-cdel]').forEach(el => el.onclick = e => { e.stopPropagation(); combos.splice(+el.dataset.cdel, 1); save(); });
    document.querySelectorAll('[data-cgoto]').forEach(el => el.onclick = () => { const t = T(combos[+el.dataset.cgoto].members[0]); if (t && t.page !== page) gotoPage(t.page); });
  }
  function progress() {
    const el = $('#progress'); if (!el || !BP) return;
    const left = BP.texts.filter(free).length;
    el.innerHTML = `<b>${combos.length}</b> to combine · ${BP.texts.length} text fields${sel.length ? ` · <b>${sel.length}</b> selected` : ''}`;
  }
  const pt = e => { const r = $('#canvas').getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale]; };
  return {
    async load() { BP = await j(mapi('combine')); combos = BP.combos; PLAN = BP.plan; sel = []; edited = false; nameDraft = descDraft = null; notes = []; },
    pages: () => BP ? BP.pages : [],
    startPage: () => (BP.texts.slice().sort(cmp)[0] || {}).page || 1,
    pageLabel(p) { const n = BP.texts.filter(t => t.page === p).length; return n ? `p${p} (${n})` : null; },
    onPage() { if (sel.length && T(sel[0]).page !== page) { sel = []; edited = false; refreshDraft(); } placeAll(); },
    bar: () => `<span class="progress" id="progress"></span>
      <span class="help">click text fields or drag a box over them (Shift adds) · Enter combine · Esc clear · Shift+1-4 mode</span>`,
    bindBar() { if (BP) progress(); },
    place() {
      for (const o of BP.others) if (o.page === page) put('cb other', o.rect, o.name);
      for (const t of BP.texts) {
        if (t.page !== page) continue;
        if (comboOf(t.name)) { put('cb member', t.rect, `${t.name} (in ${comboOf(t.name).name})`); continue; }
        put('cb text' + (sel.includes(t.name) ? ' sel' : ''), t.rect, `${t.name} · ${t.type || ''}`).dataset.text = t.name;
      }
      combos.forEach((c, i) => {
        const ts = c.members.map(T).filter(Boolean); if (!ts.length || ts[0].page !== page) return;
        const d = put('cb combo', union(ts.map(t => t.rect)), `${c.name} ← ${c.members.join(', ')}`); d.dataset.combo = i;
        const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = c.name; d.appendChild(tag);
      });
      if (sel.length >= 2 && T(sel[0]).page === page) {
        const d = put('cb preview', union(sel.map(n => T(n).rect)));
        const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = nameDraft || ''; d.appendChild(tag);
      }
      progress();
    },
    panel, progress,
    mousedown(e) { if (e.button !== 0) return; e.preventDefault(); drawStart = pt(e); drawTarget = e.target; drawStart.shift = e.shiftKey; },
    mousemove(e) {
      if (!drawStart) return; const p = pt(e);
      const r = [Math.min(drawStart[0], p[0]), Math.min(drawStart[1], p[1]), Math.max(drawStart[0], p[0]), Math.max(drawStart[1], p[1])];
      if (!drawBox && (r[2] - r[0]) * scale < 4 && (r[3] - r[1]) * scale < 4) return;
      if (!drawBox) drawBox = put('cb draw', r);
      else { drawBox.style.left = r[0] * scale + 'px'; drawBox.style.top = r[1] * scale + 'px'; drawBox.style.width = (r[2] - r[0]) * scale + 'px'; drawBox.style.height = (r[3] - r[1]) * scale + 'px'; }
      drawBox._r = r;
    },
    mouseup() {
      if (!drawStart) return;
      const s = drawStart, b = drawBox, t = drawTarget; drawStart = null; drawBox = null; drawTarget = null;
      if (b) { b.remove(); return selectIn(b._r, s.shift); }
      if (t && t.dataset && t.dataset.text) return toggle(t.dataset.text);
      if (t && t.dataset && t.dataset.combo !== undefined) { const c = combos[+t.dataset.combo]; notes = [`${c.name} combines ${c.members.join(', ')} (remove it from the list to undo)`]; return panel(); }
    },
    key(e) {
      if (e.key === 'Enter') combine();
      else if (e.key === 'Escape') clear();
      else return false;
      return true;
    },
  };
})();

init();
</script>
</body>
