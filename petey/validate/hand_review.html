<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hand review</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --line:#ddd; --accept:#1e8e3e; --flag:#c5221f; --sel:#1a73e8; --none:#8a8a8a; }
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.4 -apple-system, Helvetica, Arial, sans-serif; color:var(--fg); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header select { font:inherit; max-width:420px; }
  .pages button, .btn { font:inherit; padding:3px 9px; border:1px solid var(--line); background:#fafafa; border-radius:4px; cursor:pointer; }
  .pages button.on { background:#e8f0fe; border-color:var(--sel); }
  .progress { color:var(--muted); }
  .progress b { color:var(--fg); }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; overflow:auto; background:#efefef; position:relative; }
  #canvas { position:relative; margin:12px; display:inline-block; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #canvas img { display:block; }
  .rect { position:absolute; border:1.5px solid var(--none); background:transparent; cursor:pointer; }
  .rect.accept { border-color:var(--accept); }
  .rect.flag { border-color:var(--flag); background:rgba(197,34,31,.06); }
  .rect.sel { border-width:2.5px; border-color:var(--sel); box-shadow:0 0 0 2px rgba(26,115,232,.35); z-index:2; }
  .rect .tag { position:absolute; left:0; top:-14px; font-size:10px; line-height:12px; background:rgba(255,255,255,.9); color:var(--fg); padding:0 3px; white-space:nowrap; pointer-events:none; max-width:260px; overflow:hidden; text-overflow:ellipsis; }
  aside { width:400px; border-left:1px solid var(--line); overflow:auto; padding:12px 14px; }
  aside h2 { font-size:15px; margin:0 0 6px; word-break:break-all; }
  dl { display:grid; grid-template-columns:96px 1fr; gap:3px 8px; margin:8px 0; }
  dt { color:var(--muted); }
  dd { margin:0; word-break:break-word; }
  .verdict { display:flex; gap:8px; margin:12px 0 6px; }
  .verdict .btn.accept { border-color:var(--accept); color:var(--accept); }
  .verdict .btn.flag { border-color:var(--flag); color:var(--flag); }
  .verdict .btn.on.accept { background:var(--accept); color:#fff; }
  .verdict .btn.on.flag { background:var(--flag); color:#fff; }
  textarea { width:100%; font:inherit; min-height:54px; }
  .loop { background:#fff8e1; border:1px solid #f1e2a8; padding:6px 8px; border-radius:4px; margin:8px 0; }
  .adj { background:#e8f0fe; border:1px solid #c6d8f7; padding:6px 8px; border-radius:4px; margin:8px 0; }
  .list { margin-top:12px; border-top:1px solid var(--line); padding-top:8px; max-height:38vh; overflow:auto; }
  .list div { padding:2px 4px; cursor:pointer; border-left:3px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list div.accept { border-left-color:var(--accept); }
  .list div.flag { border-left-color:var(--flag); }
  .list div.sel { background:#e8f0fe; }
  .help { color:var(--muted); font-size:12px; }
  .stale { color:var(--flag); }
  .tier { display:inline-block; min-width:1.1em; text-align:center; font-size:11px; font-weight:600; border-radius:3px; padding:0 3px; margin-right:4px; }
  .tier.contested { background:#fce8e6; color:#a50e0e; } .tier.unknown { background:#eee; color:#555; }
  .tier.single { background:#fef7e0; color:#7a5b00; } .tier.settled { background:#e6f4ea; color:#137333; }
  .wit { margin:8px 0; font-size:12px; } .wit div { padding:1px 0; } .wit .no { color:#a50e0e; } .wit .yes { color:#137333; } .wit .mute { color:var(--muted); }
  .rect.contested:not(.accept):not(.flag) { border-style:dashed; border-color:#c5221f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1e1e; --fg:#eee; --muted:#aaa; --line:#444; } #stage { background:#2a2a2a; } .pages button, .btn { background:#2c2c2c; color:var(--fg); } .loop { background:#3a3420; border-color:#6a5d2a; } .adj { background:#1f2d44; border-color:#2f4d7a; } .list div.sel, .pages button.on { background:#1f2d44; } .rect .tag { background:rgba(30,30,30,.9); } }
</style>
</head>
<body>
<header>
  <select id="pick"></select>
  <label class="help">list <select id="listorder"><option value="name">by name</option><option value="oldest">oldest first</option></select></label>
  <span class="pages" id="pages"></span>
  <span class="progress" id="progress"></span>
  <label class="help"><input type="checkbox" id="unrev"> unreviewed only (u)</label>
  <label class="help">order <select id="order"><option value="risk">risk first</option><option value="reading">reading</option></select></label>
  <button class="btn" id="bulk" title="accept every unreviewed field that two or more witnesses back and none disputes">accept settled</button>
  <span class="help">a accept · f flag · c clear · n/p next/prev · 1-9 page</span>
</header>
<main>
  <div id="stage"><div id="canvas"><img id="img" alt=""></div></div>
  <aside id="panel"><p class="help">Pick a blueprint.</p></aside>
</main>
<script>
let BP = null, bid = null, page = 1, selected = null, scale = 1, unrevOnly = false, order = 'risk', LIST = [];
const TIER_RANK = {contested: 0, unknown: 1, single: 2, settled: 3};
const TIER_LETTER = {contested: '!', unknown: '?', single: '1', settled: '2+'};
const $ = s => document.querySelector(s);

async function j(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); }

async function init() {
  const pick = $('#pick');
  pick.innerHTML = '<option>loading blueprints…</option>';
  try { LIST = await j('/api/blueprints'); }
  catch (e) { pick.innerHTML = ''; $('#panel').innerHTML = `<p class="stale">Could not load the blueprint list: ${escapeHtml(e.message)}</p>`; return; }
  const list = LIST;
  try { $('#listorder').value = localStorage.getItem('hr_listorder') || 'name'; } catch (e) {}
  renderPicker();
  $('#listorder').addEventListener('change', e => { try { localStorage.setItem('hr_listorder', e.target.value); } catch (_) {} renderPicker(); });
  pick.addEventListener('change', () => load(pick.value));
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash && list.some(b => b.id === hash)) { pick.value = hash; load(hash); }
  else if (list.length) { load(pick.value); }
  window.addEventListener('keydown', onKey);
  $('#unrev').addEventListener('change', e => { unrevOnly = e.target.checked; renderList(); });
  try { order = localStorage.getItem('hr_order') || 'risk'; } catch (e) {}
  $('#order').value = order;
  $('#order').addEventListener('change', e => { order = e.target.value; try { localStorage.setItem('hr_order', order); } catch (_) {} renderList(); });
  $('#bulk').addEventListener('click', bulkAccept);
  window.addEventListener('resize', () => BP && placeRects());
}

// who made the blueprint, when, and what it was last validated on: "petey-master 2026-07-01 · never validated"
function ageText(a) {
  if (!a) return '';
  const v = a.validated ? `validated ${a.validated} on ${a.finder || '?'}${a.finder_current === false ? ' (old finder)' : ''}` : 'never validated';
  return `${a.by} ${a.when || '?'} · ${v}`;
}

function renderPicker() {
  const pick = $('#pick'), keep = pick.value || decodeURIComponent(location.hash.slice(1));
  pick.innerHTML = '';
  const groups = {lib: 'library', je: 'judge-eval side copies', rl: 'relabels'};
  const oldest = $('#listorder').value === 'oldest';
  for (const src of ['lib', 'je', 'rl']) {
    const og = document.createElement('optgroup'); og.label = groups[src];
    const items = LIST.filter(x => x.source === src);
    if (oldest) items.sort((a, b) => ((a.age || {}).when || '').localeCompare((b.age || {}).when || '') || a.form.localeCompare(b.form));
    for (const b of items) {
      const o = document.createElement('option'); o.value = b.id;
      const done = b.accepted + b.flagged;
      o.textContent = `${b.form}  (${b.fields} fields${done ? `, ${done} reviewed` : ''}${b.stale ? ', stale' : ''})  ·  ${ageText(b.age)}`;
      og.appendChild(o);
    }
    pick.appendChild(og);
  }
  if (keep && LIST.some(b => b.id === keep)) pick.value = keep;
}

async function load(id) {
  bid = id; location.hash = encodeURIComponent(id);
  BP = await j(`/api/blueprints/${encodeURIComponent(id)}`);
  BP.fields.forEach((f, i) => f.idx = i);       // reading order, as the server sorts them
  page = BP.fields.length ? BP.fields[0].page : 1; selected = null;
  renderPages(); await showPage(); renderPanel(); renderProgress();
}

function renderPages() {
  const el = $('#pages'); el.innerHTML = '';
  for (const p of BP.pages) {
    const n = BP.fields.filter(f => f.page === p.page).length;
    if (!n) continue;
    const b = document.createElement('button'); b.textContent = `p${p.page} (${n})`;
    b.className = p.page === page ? 'on' : ''; b.onclick = () => { page = p.page; showPage(); renderPages(); };
    el.appendChild(b);
  }
}

async function showPage() {
  const img = $('#img');
  await new Promise(res => { img.onload = res; img.src = `/api/blueprints/${encodeURIComponent(bid)}/png/${page}`; });
  placeRects();
}

function placeRects() {
  const img = $('#img'), canvas = $('#canvas');
  canvas.querySelectorAll('.rect').forEach(e => e.remove());
  const pinfo = BP.pages.find(p => p.page === page); if (!pinfo) return;
  scale = img.clientWidth / pinfo.w_pt;
  for (const f of BP.fields) {
    if (f.page !== page && !f.rects.some(r => r.page === page)) continue;
    f.rects.filter(r => r.page === page).forEach((r, i) => {
      const [x0, y0, x1, y1] = r.rect;
      const d = document.createElement('div');
      d.className = 'rect ' + verdictOf(f.name) + (f.tier === 'contested' ? ' contested' : '') + (selected === f.name ? ' sel' : '');
      d.style.left = (x0 * scale) + 'px'; d.style.top = (y0 * scale) + 'px';
      d.style.width = Math.max(4, (x1 - x0) * scale) + 'px'; d.style.height = Math.max(4, (y1 - y0) * scale) + 'px';
      d.title = f.options.length && f.options[i] ? `${f.name} · ${f.options[i].caption || f.options[i].on_state}` : f.name;
      d.onclick = () => select(f.name);
      canvas.appendChild(d);
    });
  }
}

function verdictOf(name) { const v = BP.verdicts[name]; return v ? v.verdict : ''; }

function ordered() {
  const list = BP.fields.filter(f => !unrevOnly || !verdictOf(f.name));
  if (order === 'risk') list.sort((a, b) => ((TIER_RANK[a.tier] ?? 1) - (TIER_RANK[b.tier] ?? 1)) || (a.idx - b.idx));
  return list;
}

async function bulkAccept() {
  if (!BP) return;
  const todo = BP.fields.filter(f => f.tier === 'settled' && !verdictOf(f.name));
  if (!todo.length) { alert('No unreviewed settled fields.'); return; }
  if (!confirm(`Accept ${todo.length} settled field(s) without looking at them? Each is saved with the note "bulk: settled".`)) return;
  await put(Object.fromEntries(todo.map(f => [f.name, {verdict: 'accept', note: 'bulk: settled'}])));
  placeRects(); renderPanel(); renderProgress();
}

function madeHtml(m) {
  if (!m) return '';
  const e = escapeHtml, rows = [];
  if (m.labeler) rows.push(`labeled by ${e(m.labeler.method || '?')}${m.labeler.model ? ' / ' + e(m.labeler.model) : ''}${m.labeler.when ? ' on ' + e(m.labeler.when) : ' (date not recorded)'}`);
  else rows.push('labeler not recorded (imported from petey-master)');
  if (m.origin) rows.push(`made in ${e(m.origin.repo)}: first commit ${e(m.origin.first.when)} by ${e(m.origin.first.who)}, last ${e(m.origin.last.when)} by ${e(m.origin.last.who)}`);
  if (m.git_first) rows.push(`in git since ${e(m.git_first.when)} by ${e(m.git_first.who)} (${e(m.git_first.commit)}: ${e(m.git_first.subject.slice(0, 60))})`);
  if (m.git_last && m.git_commits > 1) rows.push(`last commit ${e(m.git_last.when)} by ${e(m.git_last.who)} (${e(m.git_last.commit)}: ${e(m.git_last.subject.slice(0, 60))}); ${m.git_commits} commits`);
  if (m.uncommitted) rows.push('<span class="stale">uncommitted changes on disk</span>');
  if (m.file_time) rows.push(`not in git; file last written ${e(m.file_time)}`);
  if (m.loop_edits) rows.push('loop edits kept: ' + Object.entries(m.loop_edits).map(([k, n]) => `${n} by ${e(k || '?')}`).join(', '));
  if (m.validated) rows.push(`last validated ${e(m.validated.when || '?')}${m.validated.run ? ' (' + e(m.validated.run) + ')' : ''}`);
  return `<div class="help made">${rows.join('<br>')}</div>`;
}

function tierChip(f) { return f.tier ? `<span class="tier ${f.tier}" title="${f.tier}">${TIER_LETTER[f.tier]}</span>` : ''; }

function witnessHtml(f) {
  if (!f.witnesses || !Object.keys(f.witnesses).length) return '';
  const rows = Object.entries(f.witnesses).map(([k, [v, d]]) => {
    const cls = v === true ? 'yes' : (v === false ? 'no' : 'mute');
    const mark = v === true ? 'for' : (v === false ? 'against' : 'silent');
    return `<div class="${cls}"><b>${k}</b> ${mark}${d ? ': ' + escapeHtml(d) : ''}</div>`;
  }).join('');
  return `<div class="wit">${tierChip(f)}<b>${f.tier}</b>${rows}</div>`;
}

function select(name, scroll = true) {
  selected = name;
  const f = BP.fields.find(x => x.name === name);
  if (f && f.page !== page) { page = f.page; renderPages(); showPage().then(() => { renderPanel(); renderList(); }); return; }
  placeRects(); renderPanel(); renderList();
  if (scroll) { const el = document.querySelector('.rect.sel'); if (el) el.scrollIntoView({block: 'center', inline: 'center', behavior: 'smooth'}); }
}

function renderPanel() {
  const a = $('#panel');
  const f = BP.fields.find(x => x.name === selected);
  const head = `<div class="help">${BP.path}${BP.stale ? ' <span class="stale">· verdicts predate this file</span>' : ''}${BP.build ? ` · built with ${BP.build.finder}` : ''}</div>${madeHtml(BP.made)}`;
  if (!f) { a.innerHTML = head + '<p class="help">Click a box on the page, or press n.</p>' + listHtml(); bindList(); return; }
  const v = BP.verdicts[f.name] || {};
  const opts = f.options.length ? `<dt>options</dt><dd>${f.options.map(o => `${o.on_state}: ${o.caption || '<i>no caption</i>'}`).join('<br>')}</dd>` : '';
  const loop = f.loop ? `<div class="loop"><b>loop changed</b> ${(f.loop.changed || []).join(', ')}${f.loop.old_name ? ` (was <code>${f.loop.old_name}</code>)` : ''}<br>${f.loop.reason || ''}</div>` : '';
  const adj = f.adjudication ? `<div class="adj"><b>adjudicator</b> ${f.adjudication.verdict} for <code>${f.adjudication.proposed}</code>: ${f.adjudication.reason || ''}</div>` : '';
  a.innerHTML = head + `
    <h2>${f.name}</h2>
    <dl>
      <dt>type</dt><dd>${f.type || ''}${f.semantic_type ? ' / ' + f.semantic_type : ''}</dd>
      ${f.pattern ? `<dt>pattern</dt><dd><code>${escapeHtml(f.pattern)}</code></dd>` : ''}
      ${f.values ? `<dt>values</dt><dd>${f.values.join(', ')}</dd>` : ''}
      <dt>description</dt><dd>${f.description ? escapeHtml(f.description) : '<i>none</i>'}</dd>
      <dt>path</dt><dd><code>${escapeHtml((f.path || '').split('.').slice(-1)[0])}</code></dd>
      ${opts}
    </dl>
    ${witnessHtml(f)}${loop}${adj}
    <div class="verdict">
      <button class="btn accept ${v.verdict === 'accept' ? 'on' : ''}" onclick="setVerdict('accept')">accept (a)</button>
      <button class="btn flag ${v.verdict === 'flag' ? 'on' : ''}" onclick="setVerdict('flag')">flag (f)</button>
      <button class="btn" onclick="setVerdict(null)">clear (c)</button>
    </div>
    <textarea id="note" placeholder="what is wrong, or the right name (saved with the verdict)">${escapeHtml(v.note || '')}</textarea>
    <div class="help">note saves on blur or Enter; Shift+Enter for a newline</div>
    ${listHtml()}`;
  const note = $('#note');
  note.addEventListener('blur', () => saveNote());
  note.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveNote(); note.blur(); } e.stopPropagation(); });
  bindList();
}

function listHtml() {
  return `<div class="list">${ordered().map(f => `<div data-n="${escapeHtml(f.name)}" class="${verdictOf(f.name)} ${f.name === selected ? 'sel' : ''}">${tierChip(f)}p${f.page} · ${escapeHtml(f.name)}</div>`).join('')}</div>`;
}
function bindList() { document.querySelectorAll('.list div').forEach(d => d.onclick = () => select(d.dataset.n)); }
function renderList() { const old = document.querySelector('.list'); if (!old) return; old.outerHTML = listHtml(); bindList(); }

async function setVerdict(verdict) {
  if (!selected) return;
  const note = $('#note') ? $('#note').value : (BP.verdicts[selected] || {}).note || '';
  await put({[selected]: verdict ? {verdict, note} : null});
  if (verdict) next();
  else { placeRects(); renderPanel(); renderProgress(); }
}
async function saveNote() {
  if (!selected || !$('#note')) return;
  const v = BP.verdicts[selected]; const note = $('#note').value;
  if (v && v.note !== note) await put({[selected]: {verdict: v.verdict, note}});
}
async function put(verdicts) {
  const out = await j(`/api/blueprints/${encodeURIComponent(bid)}/verdicts`, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({verdicts})});
  BP.verdicts = out.verdicts; BP.stale = false; renderProgress();
}

function renderProgress() {
  const n = BP.fields.length, acc = BP.fields.filter(f => verdictOf(f.name) === 'accept').length, flg = BP.fields.filter(f => verdictOf(f.name) === 'flag').length;
  const t = {}; BP.fields.forEach(f => { if (f.tier) t[f.tier] = (t[f.tier] || 0) + 1; });
  const tiers = Object.keys(TIER_RANK).filter(k => t[k]).map(k => `${k} ${t[k]}`).join(' · ');
  $('#progress').innerHTML = `<b>${acc}</b> accepted · <b>${flg}</b> flagged · <b>${n - acc - flg}</b> left of ${n}` + (tiers ? ` <span class="help">(${tiers})</span>` : '') + (BP.witness_error ? ` <span class="stale">witnesses failed: ${escapeHtml(BP.witness_error)}</span>` : '');
  const left = BP.fields.filter(f => f.tier === 'settled' && !verdictOf(f.name)).length;
  $('#bulk').textContent = `accept settled (${left})`; $('#bulk').disabled = !left;
}

function next(step = 1) {
  const list = ordered(); if (!list.length) return;
  let i = list.findIndex(f => f.name === selected);
  if (i < 0) { const all = BP.fields; const j0 = all.findIndex(f => f.name === selected); i = list.findIndex(f => all.indexOf(f) > j0) - 1; }
  i = (i + step + list.length) % list.length;
  select(list[i].name);
}

function onKey(e) {
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if (!BP) return;
  if (e.key === 'a') setVerdict('accept');
  else if (e.key === 'f') setVerdict('flag');
  else if (e.key === 'c') setVerdict(null);
  else if (e.key === 'n' || e.key === 'ArrowRight') next(1);
  else if (e.key === 'p' || e.key === 'ArrowLeft') next(-1);
  else if (e.key === 'u') { unrevOnly = !unrevOnly; $('#unrev').checked = unrevOnly; renderList(); }
  else if (/^[1-9]$/.test(e.key)) { const p = parseInt(e.key); if (BP.pages.some(x => x.page === p)) { page = p; renderPages(); showPage(); } }
  else return;
  e.preventDefault();
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
init();
</script>
</body>
</html>
