<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Group review</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --line:#ddd; --panel:#fafafa; --sel:#1a73e8; --ok:#1e8e3e; --bad:#c5221f; --orphan:#7a7a7a; --over:rgba(26,115,232,.18); --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.4 -apple-system, Helvetica, Arial, sans-serif; color:var(--fg); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header select { font:inherit; max-width:460px; }
  .pages button, .btn { font:inherit; padding:3px 9px; border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:4px; cursor:pointer; }
  .pages button.on { background:#e8f0fe; border-color:var(--sel); }
  .btn:disabled { opacity:.5; cursor:default; }
  .progress { color:var(--muted); } .progress b { color:var(--fg); }
  .help { color:var(--muted); font-size:12px; }
  .stale { color:var(--bad); }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; overflow:auto; background:#efefef; }
  #canvas { position:relative; margin:12px; display:inline-block; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #canvas img { display:block; user-select:none; -webkit-user-drag:none; }
  .hull { position:absolute; border:1.5px dashed var(--c); background:color-mix(in srgb, var(--c) 7%, transparent); border-radius:3px; z-index:1; cursor:pointer; }
  .hull.sel { border-style:solid; border-width:2px; background:color-mix(in srgb, var(--c) 14%, transparent); z-index:2; }
  .hull.ok { border-style:solid; }
  .item { position:absolute; border:2px solid var(--c); background:color-mix(in srgb, var(--c) 18%, transparent); z-index:3; cursor:grab; }
  .item::after { content:''; position:absolute; inset:-3px; }             /* a bigger target than an 8 pt box */
  .item.orphan { border-style:dashed; background:transparent; }
  .item.sel { box-shadow:0 0 0 2px var(--sel); z-index:4; }
  .item.locked { cursor:not-allowed; }
  .item.dragging { opacity:.35; }
  .over { outline:3px solid var(--sel) !important; background:var(--over) !important; }
  aside { width:420px; border-left:1px solid var(--line); overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  aside > * { flex-shrink:0; }
  .card { border:1px solid var(--line); border-left:4px solid var(--c, var(--orphan)); border-radius:4px; padding:6px 8px; background:var(--card); }
  .card.sel { box-shadow:0 0 0 2px var(--sel); }
  .card.ok { border-left-color:var(--ok); }
  .card h3 { margin:0; font-size:13px; display:flex; gap:6px; align-items:center; cursor:pointer; word-break:break-all; }
  .card h3 .grip { cursor:grab; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .chip { border:1px solid var(--line); border-radius:10px; padding:1px 8px; background:var(--panel); cursor:grab; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  .chip.orphan { border-style:dashed; }
  .chip.sel { border-color:var(--sel); }
  .chip .x { margin-left:5px; color:var(--muted); cursor:pointer; }
  .tray { border:1.5px dashed var(--orphan); border-radius:4px; padding:6px 8px; min-height:44px; }
  .tray h4, .section h4 { margin:0 0 4px; font-size:12px; color:var(--muted); font-weight:600; }
  .cur { border:1px solid var(--sel); border-radius:4px; padding:8px 10px; }
  .cur h2 { margin:0 0 6px; font-size:14px; }
  .cur input[type=text] { font:inherit; width:100%; padding:3px 5px; }
  .cur .row { display:flex; gap:8px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  .cur ol { margin:6px 0; padding-left:20px; } .cur li { margin:1px 0; }
  .btn.ok { border-color:var(--ok); color:var(--ok); } .btn.ok.on { background:var(--ok); color:#fff; }
  .badge { font-size:11px; font-weight:600; border-radius:3px; padding:0 5px; }
  .badge.edit { background:#fef7e0; color:#7a5b00; } .badge.new { background:#e8f0fe; color:#1a4fa0; } .badge.ok { background:#e6f4ea; color:#137333; }
  .warn { color:var(--bad); font-size:12px; }
  .changes { font-size:12px; } .changes li { margin:1px 0; } .changes .err { color:var(--bad); }
  .tip { font-size:12px; color:var(--muted); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1e1e; --fg:#eee; --muted:#aaa; --line:#444; --panel:#2c2c2c; --card:#242424; --orphan:#9a9a9a; }
    #stage { background:#2a2a2a; } .pages button.on { background:#1f2d44; }
    .badge.edit { background:#3a3420; color:#f1d77a; } .badge.new { background:#1f2d44; color:#9cc0ff; } .badge.ok { background:#1e3a26; color:#8fd4a0; }
  }
</style>
</head>
<body>
<header>
  <select id="pick"></select>
  <span class="pages" id="pages"></span>
  <span class="progress" id="progress"></span>
  <label class="help"><input type="checkbox" id="unconf"> unconfirmed only (u)</label>
  <span class="help">zoom <button class="btn" id="zout">-</button> <button class="btn" id="zin">+</button></span>
  <button class="btn" id="undo" disabled>undo (z)</button>
  <span class="help">a confirm · n/p next/prev · 1-9 page · drag a box onto a group, onto another loose box, or onto the tray</span>
</header>
<main>
  <div id="stage"><div id="canvas"><img id="img" alt=""></div></div>
  <aside id="panel"><p class="help">Pick a blueprint.</p></aside>
</main>
<script>
// Units: {uid, name, type, items:[item id], origin, confirmed, locked?}. A unit is a group when it has more than one
// item or a non-boolean type; otherwise it is a loose box (an orphan). Every change saves the whole list.
let LIST = [], BP = null, bid = null, page = 1, units = [], selected = null, zoom = 1.6, unconfOnly = false;
let undoStack = [], nextUid = 1, planTimer = null, PLAN = null;
const PALETTE = ['#1a73e8', '#d93025', '#188038', '#e37400', '#9334e6', '#007b83', '#c5221f', '#b06000', '#3f51b5', '#a142f4'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function j(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); }

async function init() {
  const pick = $('#pick');
  pick.innerHTML = '<option>loading blueprints…</option>';
  try { LIST = await j('/api/blueprints'); }
  catch (e) { pick.innerHTML = ''; $('#panel').innerHTML = `<p class="stale">Could not load the blueprint list: ${esc(e.message)}</p>`; return; }
  try { zoom = parseFloat(localStorage.getItem('gr_zoom')) || zoom; } catch (e) {}
  renderPicker();
  pick.addEventListener('change', () => load(pick.value));
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash && LIST.some(b => b.id === hash)) { pick.value = hash; load(hash); }
  else if (LIST.length) load(pick.value);
  window.addEventListener('keydown', onKey);
  $('#unconf').addEventListener('change', e => { unconfOnly = e.target.checked; renderPanel(); });
  $('#zin').onclick = () => setZoom(zoom * 1.25);
  $('#zout').onclick = () => setZoom(zoom / 1.25);
  $('#undo').onclick = undo;
  window.addEventListener('resize', () => BP && placeBoxes());
}

function setZoom(z) {
  zoom = Math.min(6, Math.max(0.6, z));
  try { localStorage.setItem('gr_zoom', zoom); } catch (e) {}
  if (BP) { sizeImage(); placeBoxes(); }
}

function renderPicker() {
  const pick = $('#pick'), keep = pick.value || decodeURIComponent(location.hash.slice(1));
  pick.innerHTML = '';
  const groups = {lib: 'library', je: 'judge-eval side copies', rl: 'relabels', fl: 'flat forms'};
  for (const src of Object.keys(groups)) {
    const items = LIST.filter(x => x.source === src).sort((a, b) => a.form.localeCompare(b.form));
    if (!items.length) continue;
    const og = document.createElement('optgroup'); og.label = groups[src];
    for (const b of items) {
      const o = document.createElement('option'); o.value = b.id;
      const done = b.confirmed === b.units ? '[confirmed] ' : '';
      o.textContent = `${done}${b.form}  (${b.groups} groups, ${b.orphans} loose${b.confirmed && !done ? `, ${b.confirmed}/${b.units} confirmed` : ''}${b.stale ? ', stale' : ''})`;
      og.appendChild(o);
    }
    pick.appendChild(og);
  }
  if (keep && LIST.some(b => b.id === keep)) pick.value = keep;
}

async function load(id) {
  bid = id; location.hash = encodeURIComponent(id);
  BP = await j(`/api/blueprints/${encodeURIComponent(id)}`);
  units = BP.units.map(u => ({...u, uid: nextUid++}));
  undoStack = []; $('#undo').disabled = true;
  sortUnits();
  selected = units.length ? units[0].uid : null;
  page = units.length ? firstItem(units[0]).page : 1;
  renderPages(); await showPage(); renderPanel(); renderProgress(); schedulePlan();
}

// ------------------------------------------------------------------ model helpers

const item = id => BP.items[id];
const unitOf = id => units.find(u => u.items.includes(id));
const unitByUid = uid => units.find(u => u.uid === uid);
const isGroup = u => u.items.length > 1 || u.type !== 'boolean';
const orderKey = it => [it.page, Math.round(it.rect[1] / 6), it.rect[0]];
function cmpKey(a, b) { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; }
function firstItem(u) { return u.items.map(item).sort((a, b) => cmpKey(orderKey(a), orderKey(b)))[0]; }
function sortUnits() {
  for (const u of units) u.items.sort((a, b) => cmpKey(orderKey(item(a)), orderKey(item(b))));
  units.sort((a, b) => cmpKey(orderKey(firstItem(a)), orderKey(firstItem(b))));
}
function onPage(u, p = page) { return u.items.some(id => item(id).page === p); }
function label(id) { const it = item(id); return it.caption || (it.key ?? it.field); }
function colorOf(u) {
  if (!isGroup(u)) return 'var(--orphan)';
  const groups = units.filter(x => isGroup(x) && onPage(x)); const i = groups.indexOf(u);
  return PALETTE[(i < 0 ? 0 : i) % PALETTE.length];
}
function baseOf(u) { return u.origin ? BP.base.find(b => b.name === u.origin) : null; }
function status(u) {
  const b = baseOf(u);
  if (!b) return 'new';
  const same = b.name === u.name && b.type === u.type && [...b.items].sort().join('|') === [...u.items].sort().join('|');
  return same ? 'as blueprint' : 'edited';
}

function takenNames(except) {
  return new Set([...BP.other_names, ...units.filter(u => u !== except).map(u => u.name)]);
}
function uniqueName(base, except) {
  const taken = takenNames(except); let n = base, k = 2;
  while (taken.has(n)) n = `${base}_${k++}`;
  return n;
}
// a new group's name: the shared leading words of its members' field names, else group_<n>
function suggestName(ids) {
  const parts = ids.map(id => { const it = item(id); return (it.key === null ? it.field : it.field).split('_'); });
  const pre = [];
  for (let i = 0; i < Math.min(...parts.map(p => p.length)); i++) {
    if (parts.every(p => p[i] === parts[0][i])) pre.push(parts[0][i]); else break;
  }
  let base = pre.join('_');
  if (!/^[a-z][a-z0-9_]*$/.test(base) || base.length < 3) base = `group_p${item(ids[0]).page}`;
  return uniqueName(base, null);
}

// ------------------------------------------------------------------ edits (each one undoable, each one saved)

function snapshot() { undoStack.push(JSON.stringify(units)); if (undoStack.length > 200) undoStack.shift(); $('#undo').disabled = false; }
function undo() {
  if (!undoStack.length) return;
  units = JSON.parse(undoStack.pop()); $('#undo').disabled = !undoStack.length;
  if (!unitByUid(selected)) selected = units.length ? units[0].uid : null;
  afterEdit();
}
async function afterEdit() {
  sortUnits(); renderPages(); placeBoxes(); renderPanel(); renderProgress();
  await save(); schedulePlan();
}

function detach(id) {
  const u = unitOf(id);
  u.items = u.items.filter(x => x !== id); u.confirmed = false;
  if (!u.items.length) units = units.filter(x => x !== u);
  return u;
}

// drop item `id` on a target: {unit: uid} (a group), {item: id} (a box: its group, or a new group with a loose box),
// or {tray: true} (out of its group, a loose box of its own)
function moveItem(id, target) {
  const src = unitOf(id); if (!src || src.locked) return;
  if (target.item && target.inTray && isGroup(src)) target = {tray: true};   // out of a group into the tray: loose
  if (target.item) {
    if (target.item === id) return;
    const t = unitOf(target.item); if (t.locked) return;
    if (isGroup(t)) return moveItem(id, {unit: t.uid});
    if (t === src) return;
    snapshot(); detach(id); units = units.filter(x => x !== t);
    const g = {uid: nextUid++, name: suggestName([target.item, id]), type: 'category', items: [target.item, id], origin: null, confirmed: false};
    units.push(g); selected = g.uid;
  } else if (target.unit) {
    const t = unitByUid(target.unit); if (!t || t === src || t.locked) return;
    if (!isGroup(t)) return moveItem(id, {item: t.items[0]});
    snapshot(); detach(id); t.items.push(id); t.confirmed = false; selected = t.uid;
  } else if (target.tray) {
    if (!isGroup(src)) return;
    snapshot(); detach(id);
    const it = item(id);
    // a box that was a field of its own goes back to being that field; an option of a group gets <group>_<key>
    const own = it.key === null;
    const u = {uid: nextUid++, name: own ? it.field : uniqueName(`${src.name}_${String(it.key).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'option'}`, null),
               type: 'boolean', items: [id], origin: own ? it.field : null, confirmed: false};
    units.push(u); selected = units.includes(src) ? src.uid : u.uid;     // keep reviewing the group it left
  }
  afterEdit();
}

// drop a whole group on another group (merge) or on a loose box (the group takes it in)
function moveUnit(uid, target) {
  const s = unitByUid(uid); if (!s || s.locked) return;
  if (target.item) { const t = unitOf(target.item); if (!t || t === s) return; target = {unit: t.uid}; }
  const t = unitByUid(target.unit); if (!t || t === s || t.locked) return;
  snapshot();
  if (isGroup(t)) { t.items.push(...s.items); t.confirmed = false; units = units.filter(x => x !== s); selected = t.uid; }
  else { s.items.push(...t.items); s.confirmed = false; units = units.filter(x => x !== t); selected = s.uid; }
  afterEdit();
}

function confirmUnit(uid, on) {
  const u = unitByUid(uid); if (!u) return;
  snapshot(); u.confirmed = on ?? !u.confirmed;
  const advance = u.confirmed;
  afterEdit(); if (advance) next(1);
}
function rename(uid, name) {
  const u = unitByUid(uid); name = name.trim();
  if (!u || name === u.name) return;
  snapshot(); u.name = name; afterEdit();
}
function setType(uid, type) {
  const u = unitByUid(uid); if (!u || u.type === type) return;
  snapshot(); u.type = type; u.confirmed = false; afterEdit();
}

let saving = Promise.resolve();
function save() {
  const body = JSON.stringify({units: units.map(({uid, ...u}) => u)});
  saving = saving.then(async () => {
    try {
      const out = await j(`/api/blueprints/${encodeURIComponent(bid)}/units`, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body});
      if (out.entry) { const i = LIST.findIndex(b => b.id === bid); if (i >= 0) LIST[i] = out.entry; renderPicker(); }
      BP.info.stale = false; BP.info.updated = out.saved;
    } catch (e) { alert('Save failed: ' + e.message); }
  });
  return saving;
}

function schedulePlan() {
  clearTimeout(planTimer);
  planTimer = setTimeout(async () => {
    try { PLAN = await j(`/api/blueprints/${encodeURIComponent(bid)}/plan`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({units: units.map(({uid, ...u}) => u)})}); }
    catch (e) { PLAN = {changes: [], errors: ['plan failed: ' + e.message]}; }
    renderChanges(); renderProgress();
  }, 300);
}

// ------------------------------------------------------------------ drag and drop

function dragData(e, kind, value) {
  e.dataTransfer.setData('text/plain', `${kind}:${value}`); e.dataTransfer.effectAllowed = 'move';
  e.stopPropagation();
}
function asTarget(el, target) {
  el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation(); el.classList.remove('over');
    const d = e.dataTransfer.getData('text/plain'); const i = d.indexOf(':');
    const kind = d.slice(0, i), value = d.slice(i + 1);
    if (kind === 'item') moveItem(value, target);
    else if (kind === 'unit' && !target.tray) moveUnit(Number(value), target);
  });
}

// ------------------------------------------------------------------ page

function renderPages() {
  const el = $('#pages'); el.innerHTML = '';
  for (const p of BP.pages) {
    const n = units.filter(u => onPage(u, p.page)).length; if (!n) continue;
    const left = units.filter(u => onPage(u, p.page) && !u.confirmed).length;
    const b = document.createElement('button'); b.textContent = `p${p.page} (${left ? left + ' left' : 'done'})`;
    b.className = p.page === page ? 'on' : ''; b.onclick = () => gotoPage(p.page);
    el.appendChild(b);
  }
}
async function gotoPage(p) {
  page = p; const u = units.find(x => onPage(x) && (!unconfOnly || !x.confirmed)) || units.find(x => onPage(x));
  if (u) selected = u.uid;
  renderPages(); await showPage(); renderPanel();
}
function sizeImage() { const pinfo = BP.pages.find(p => p.page === page); if (pinfo) $('#img').style.width = (pinfo.w_pt * zoom) + 'px'; }
async function showPage() {
  const img = $('#img'); sizeImage();
  await new Promise(res => { img.onload = res; img.onerror = res; img.src = `/api/blueprints/${encodeURIComponent(bid)}/png/${page}`; });
  placeBoxes();
}

function box(el, r, s, pad = 0) {
  const [x0, y0, x1, y1] = r;
  el.style.left = ((x0 - pad) * s) + 'px'; el.style.top = ((y0 - pad) * s) + 'px';
  el.style.width = Math.max(6, (x1 - x0 + 2 * pad) * s) + 'px'; el.style.height = Math.max(6, (y1 - y0 + 2 * pad) * s) + 'px';
}

function placeBoxes() {
  const canvas = $('#canvas'), img = $('#img');
  canvas.querySelectorAll('.hull, .item').forEach(e => e.remove());
  const pinfo = BP.pages.find(p => p.page === page); if (!pinfo) return;
  const s = img.clientWidth / pinfo.w_pt;
  for (const u of units.filter(x => onPage(x))) {
    const c = colorOf(u), sel = u.uid === selected;
    const its = u.items.map(item).filter(it => it.page === page);
    if (isGroup(u)) {
      const hull = [Math.min(...its.map(i => i.rect[0])), Math.min(...its.map(i => i.rect[1])), Math.max(...its.map(i => i.rect[2])), Math.max(...its.map(i => i.rect[3]))];
      const h = document.createElement('div'); h.dataset.unit = u.name; h.className = 'hull' + (sel ? ' sel' : '') + (u.confirmed ? ' ok' : '');
      h.style.setProperty('--c', c); box(h, hull, s, 6); h.title = `${u.name} (${u.items.length} options)`;
      h.onclick = () => select(u.uid, false);
      if (!u.locked) { h.draggable = true; h.addEventListener('dragstart', e => dragData(e, 'unit', u.uid)); asTarget(h, {unit: u.uid}); }
      canvas.appendChild(h);
    }
    for (const it of its) {
      const d = document.createElement('div'); d.dataset.item = it.id;
      d.className = 'item' + (isGroup(u) ? '' : ' orphan') + (sel ? ' sel' : '') + (u.locked ? ' locked' : '');
      d.style.setProperty('--c', c); box(d, it.rect, s);
      d.title = `${u.name}${isGroup(u) ? ' · ' + label(it.id) : ''}${u.locked ? ' (locked: ' + u.locked + ')' : ''}`;
      d.onclick = e => { e.stopPropagation(); select(u.uid, false); };
      if (!u.locked) {
        d.draggable = true;
        d.addEventListener('dragstart', e => { dragData(e, 'item', it.id); d.classList.add('dragging'); });
        d.addEventListener('dragend', () => d.classList.remove('dragging'));
        asTarget(d, {item: it.id});
      }
      canvas.appendChild(d);
    }
  }
}

// ------------------------------------------------------------------ panel

function select(uid, scroll = true) {
  selected = uid; const u = unitByUid(uid); if (!u) return;
  if (!onPage(u)) { page = firstItem(u).page; renderPages(); showPage().then(() => { renderPanel(); scrollTo(); }); return; }
  placeBoxes(); renderPanel(); if (scroll) scrollTo();
}
function scrollTo() {
  const el = document.querySelector('.hull.sel') || document.querySelector('.item.sel');
  if (el) el.scrollIntoView({block: 'center', inline: 'center', behavior: 'smooth'});
  const card = document.querySelector('.card.sel'); if (card) card.scrollIntoView({block: 'nearest'});
}

function chipHtml(id, u) {
  const it = item(id), orphan = !isGroup(u);
  const where = it.page !== page ? ` <span class="help">p${it.page}</span>` : '';
  const x = !orphan && !u.locked ? `<span class="x" data-out="${esc(id)}" title="take it out of the group">×</span>` : '';
  const text = orphan ? u.name : label(id);
  return `<span class="chip${orphan ? ' orphan' : ''}${u.uid === selected ? ' sel' : ''}" draggable="${!u.locked}" data-item="${esc(id)}" title="${esc(it.field)}${it.key !== null ? ' · ' + esc(it.key) : ''}${it.on_state ? ' · on ' + esc(it.on_state) : ''}">${esc(text)}${where}${x}</span>`;
}
function badge(u) {
  const st = status(u);
  return (u.confirmed ? '<span class="badge ok">confirmed</span>' : '') +
         (st === 'new' ? '<span class="badge new">new</span>' : st === 'edited' ? '<span class="badge edit">edited</span>' : '');
}

function currentHtml(u) {
  if (!u) return '<p class="help">Nothing on this page.</p>';
  const group = isGroup(u), b = baseOf(u), taken = takenNames(u);
  const bad = !/^[a-z][a-z0-9_]*$/.test(u.name) ? 'not a field name (lower case, digits, underscores)' : taken.has(u.name) ? 'another field already has this name' : '';
  const was = b && b.name !== u.name ? ` <span class="help">(was ${esc(b.name)})</span>` : '';
  const items = u.items.map(id => { const it = item(id);
    return `<li>${esc(label(id))} <span class="help">${it.key !== null ? esc(it.field) + ' / ' + esc(it.key) : esc(it.field)}${it.on_state ? ' · on ' + esc(it.on_state) : ''}${it.page !== page ? ' · p' + it.page : ''}</span></li>`; }).join('');
  const what = u.locked ? `<div class="warn">${esc(u.locked)}</div>` :
    group ? `<div class="row"><label>one of <input type="radio" name="ty" value="category" ${u.type === 'category' ? 'checked' : ''}></label>
                 <label>any of <input type="radio" name="ty" value="multi_category" ${u.type === 'multi_category' ? 'checked' : ''}></label>
                 ${u.items.length === 1 ? '<span class="warn">a group of one option</span>' : ''}</div>`
          : `<div class="tip">A loose box: a ${esc(item(u.items[0]).widget_type)} field of its own${item(u.items[0]).appearances ? `, drawn in ${item(u.items[0]).appearances} places` : ''}. Confirm it if it stands alone; drag it onto its group or onto another loose box if not.</div>`;
  return `<div class="cur">
    <h2>${group ? `Group of ${u.items.length}` : 'Loose box'} ${badge(u)}</h2>
    <input type="text" id="uname" value="${esc(u.name)}" ${u.locked ? 'disabled' : ''}>${was}
    ${bad ? `<div class="warn">${bad}</div>` : ''}
    ${what}
    ${group ? `<ol>${items}</ol>` : ''}
    <div class="row">
      <button class="btn ok ${u.confirmed ? 'on' : ''}" id="confirm">${u.confirmed ? 'confirmed' : (group ? 'group is right (a)' : 'stands alone (a)')}</button>
      ${b && status(u) !== 'as blueprint' ? '<button class="btn" id="revert" title="put this unit back as the blueprint has it">back to blueprint</button>' : ''}
    </div>
  </div>`;
}

function listedUnits() { return units.filter(u => onPage(u) && (!unconfOnly || !u.confirmed || u.uid === selected)); }

function renderPanel() {
  const a = $('#panel'); if (!BP) return;
  const u = unitByUid(selected);
  const head = `<div class="help">${esc(BP.path)}${BP.info.stale ? ' <span class="stale">· the saved grouping predates this file; rebased onto it</span>' : ''}${BP.info.applied ? ` · last applied ${esc(BP.info.applied.when)}` : ''}</div>`;
  const groups = listedUnits().filter(isGroup), loose = listedUnits().filter(x => !isGroup(x));
  a.innerHTML = head + currentHtml(u) +
    `<div class="section"><h4>Groups on page ${page} (${groups.length}) · drop a box on a group to add it</h4>
      ${groups.map(g => `<div class="card${g.uid === selected ? ' sel' : ''}${g.confirmed ? ' ok' : ''}" data-unit="${g.uid}" style="--c:${colorOf(g)}">
         <h3><span class="grip" draggable="${!g.locked}" data-drag-unit="${g.uid}" title="drag the whole group">⠿</span>${esc(g.name)} ${badge(g)}</h3>
         <div class="chips">${g.items.map(id => chipHtml(id, g)).join('')}</div></div>`).join('') || '<p class="help">none</p>'}
    </div>
    <div class="tray" id="tray"><h4>Loose boxes on page ${page} (${loose.length}) · drop a box here to take it out of its group; drop one loose box on another to group them</h4>
      <div class="chips">${loose.map(o => chipHtml(o.items[0], o)).join('')}</div></div>
    <div class="section changes" id="changes"></div>`;
  bindPanel(u); renderChanges();
}

function bindPanel(u) {
  if (u) {
    const n = $('#uname');
    if (n) {
      n.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { rename(u.uid, n.value); } });
      n.addEventListener('blur', () => rename(u.uid, n.value));
    }
    document.querySelectorAll('input[name=ty]').forEach(r => r.addEventListener('change', () => setType(u.uid, r.value)));
    const c = $('#confirm'); if (c) c.onclick = () => confirmUnit(u.uid);
    const rv = $('#revert'); if (rv) rv.onclick = () => revert(u);
  }
  document.querySelectorAll('.card').forEach(card => {
    const uid = Number(card.dataset.unit);
    card.querySelector('h3').onclick = () => select(uid);
    if (!unitByUid(uid).locked) asTarget(card, {unit: uid});
  });
  document.querySelectorAll('[data-drag-unit]').forEach(g => g.addEventListener('dragstart', e => dragData(e, 'unit', Number(g.dataset.dragUnit))));
  document.querySelectorAll('.chip').forEach(ch => {
    const id = ch.dataset.item, cu = unitOf(id);
    ch.addEventListener('click', () => select(cu.uid));
    if (cu.locked) return;
    ch.addEventListener('dragstart', e => dragData(e, 'item', id));
    if (!isGroup(cu)) asTarget(ch, {item: id, inTray: true});
  });
  document.querySelectorAll('[data-out]').forEach(x => x.addEventListener('click', e => { e.stopPropagation(); moveItem(x.dataset.out, {tray: true}); }));
  asTarget($('#tray'), {tray: true});
}

// put a unit's boxes back the way the blueprint groups them (other units give them up)
function revert(u) {
  const b = baseOf(u); if (!b) return;
  snapshot();
  for (const id of b.items) { const cur = unitOf(id); if (cur && cur !== u) detach(id); }
  for (const id of u.items.filter(id => !b.items.includes(id))) {
    const it = item(id);     // boxes the blueprint has elsewhere go back to being loose fields or tray options
    u.items = u.items.filter(x => x !== id);
    units.push({uid: nextUid++, name: it.key === null ? it.field : uniqueName(`${u.name}_${it.key}`.toLowerCase().replace(/[^a-z0-9_]+/g, '_'), null),
                type: 'boolean', items: [id], origin: it.key === null ? it.field : null, confirmed: false});
  }
  if (!units.includes(u)) units.push(u);
  u.items = [...b.items]; u.name = b.name; u.type = b.type; u.confirmed = false;
  afterEdit();
}

function renderChanges() {
  const el = $('#changes'); if (!el) return;
  if (!PLAN) { el.innerHTML = ''; return; }
  const errs = PLAN.errors.map(e => `<li class="err">${esc(e)}</li>`).join('');
  const ch = PLAN.changes.map(c => `<li>${esc(c)}</li>`).join('');
  el.innerHTML = `<h4>What applying this grouping would change in the blueprint (${PLAN.changes.length})</h4>
    ${errs || ch ? `<ul>${errs}${ch}</ul>` : '<p class="help">nothing: the grouping is the blueprint\'s</p>'}
    <div class="help">The page only records. To write it into the blueprint:<br><code>PYTHONPATH=. venv/bin/python -m petey.validate.group_review --apply ${esc(bid)}</code></div>`;
}

function renderProgress() {
  if (!BP) return;
  const n = units.length, ok = units.filter(u => u.confirmed).length, g = units.filter(isGroup).length;
  const ch = PLAN ? ` · <b>${PLAN.changes.length}</b> change${PLAN.changes.length === 1 ? '' : 's'}${PLAN.errors.length ? ` <span class="stale">(${PLAN.errors.length} to fix)</span>` : ''}` : '';
  $('#progress').innerHTML = `<b>${ok}</b> of ${n} confirmed · ${g} groups, ${n - g} loose${ch}`;
}

function next(step) {
  const all = units.filter(u => !unconfOnly || !u.confirmed || u.uid === selected); if (!all.length) return;
  let i = all.findIndex(u => u.uid === selected);
  if (unconfOnly) {   // skip the one just confirmed
    const rest = units.filter(u => !u.confirmed); if (!rest.length) { renderPanel(); return; }
    const k = units.findIndex(u => u.uid === selected);
    const after = step > 0 ? units.slice(k + 1).concat(units.slice(0, k)) : units.slice(0, k).reverse().concat(units.slice(k + 1).reverse());
    const t = after.find(u => !u.confirmed); if (t) select(t.uid); return;
  }
  i = (i + step + all.length) % all.length;
  select(all[i].uid);
}

function onKey(e) {
  if (e.target && ['TEXTAREA', 'INPUT', 'SELECT'].includes(e.target.tagName) && e.target.type !== 'checkbox' && e.target.type !== 'radio') return;
  if (!BP || e.metaKey || e.ctrlKey) return;
  if (e.key === 'a' && selected) confirmUnit(selected, true);
  else if (e.key === 'n' || e.key === 'ArrowRight') next(1);
  else if (e.key === 'p' || e.key === 'ArrowLeft') next(-1);
  else if (e.key === 'z') undo();
  else if (e.key === 'u') { unconfOnly = !unconfOnly; $('#unconf').checked = unconfOnly; renderPanel(); }
  else if (e.key === '+' || e.key === '=') setZoom(zoom * 1.25);
  else if (e.key === '-') setZoom(zoom / 1.25);
  else if (/^[1-9]$/.test(e.key)) { const p = parseInt(e.key); if (units.some(u => onPage(u, p))) gotoPage(p); }
  else return;
  e.preventDefault();
}

init();
</script>
</body>
</html>
